<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>The Bullrider's Last Ride — a game about D!</title>
<meta name="description" content="A stick-figure western platformer about D! (Puranjan Gaur), the last cowboy in his family, and the three demons that rode with him: Anxiety, Self-Doubt and Insecurity."/>
<link rel="canonical" href="https://wantedbull.com/game/"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="The Bullrider's Last Ride"/>
<meta property="og:description" content="A stick-figure western platformer about D!, the last cowboy in his family, and the three demons that rode with him."/>
<meta property="og:url" content="https://wantedbull.com/game/"/>
<meta property="og:image" content="https://wantedbull.com/og-image.jpg"/>
<link rel="shortcut icon" type="image/ico" href="../data/favicon.ico"/>
<style>
/* D!'s own lettering. woff2 first (about a third of the size), the .ttf kept as
   a fallback for anything that will not take woff2. font-display:swap means the
   game is playable before the face arrives; the canvas redraws every frame, so
   it picks the real font up the moment it lands. */
@font-face{font-family:"Western Bang Bang";font-style:normal;font-weight:400;font-display:swap;
  src:url("WesternBangBang-Regular.woff2") format("woff2"),
      url("WesternBangBang-Regular.ttf") format("truetype")}
@font-face{font-family:"Western Bang Bang";font-style:italic;font-weight:400;font-display:swap;
  src:url("WesternBangBang-Italic.woff2") format("woff2"),
      url("WesternBangBang-Italic.ttf") format("truetype")}
:root{
  --ink:#241c14; --paper:#e9ddc2; --rust:#c4552a; --red:#a5321f; --soft:#6b5843;
  /* The arrows on the touch pad have no glyph in Western Bang Bang; the
     fallbacks below cover them, per-glyph, without changing the rest. */
  --ui: "Western Bang Bang", ui-monospace, "Courier New", Courier, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#140f08}
body{font-family:var(--ui);color:var(--ink);touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
#stage{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;max-height:100dvh;background:var(--paper);box-shadow:0 0 50px rgba(0,0,0,.7)}
/* Portrait phones get a taller play area — a 16:9 sliver on a tall screen is
   unusably small, and the thumb controls must never sit on top of the game. */
@media (orientation:portrait){ #stage{aspect-ratio:3/4;max-height:74dvh} }
canvas{display:block;width:100%;height:100%;image-rendering:auto}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:.6em;
     padding:.45em .7em;font-size:clamp(14px,2.1vw,20px);letter-spacing:.05em;pointer-events:none;z-index:3}
#hud .box{background:rgba(233,221,194,.82);border:2px solid var(--ink);padding:.2em .5em}
#hud .rust{color:var(--rust)}
#lvl{margin-left:auto;text-transform:uppercase}
/* The one thing in the HUD you can actually press, so it has to take pointer
   events back and be big enough for a thumb. */
#exit{pointer-events:auto;cursor:pointer;color:var(--rust);padding:.3em .7em;user-select:none}
/* Guarded: on a touch screen :hover sticks after a tap and the chip would
   stay lit up long after the card is gone. */
@media (hover:hover){ #exit:hover{background:var(--rust);color:#fff;border-color:var(--ink)} }
#exit:active{transform:translate(1px,1px)}
/* The visible chip matches the rest of the HUD; the pressable area around it
   is grown to a thumb's worth so a small badge is not a small target. */
#exit{position:relative}
#exit::after{content:"";position:absolute;left:-12px;right:-12px;top:-12px;bottom:-12px}

/* overlay cards */
#ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(20,15,8,.82);z-index:6;padding:2.2%}
#ov.on{display:grid}
#card{max-width:32em;max-height:94%;overflow:auto;background:var(--paper);border:3px solid var(--ink);padding:.85em 1.1em;text-align:center;
      box-shadow:8px 8px 0 rgba(0,0,0,.35)}
#card h2{margin:0 0 .05em;font-size:clamp(1.55rem,4.6vw,2.45rem);letter-spacing:.02em;font-weight:400}
#card .sub{color:var(--rust);font-size:clamp(.88rem,2.3vw,1.12rem);letter-spacing:.16em;text-transform:uppercase;margin-bottom:.6em}
#card p{font-family:var(--ui);font-size:clamp(1.16rem,2.9vw,1.42rem);line-height:1.34;margin:.3em 0}
#card .keys{font-size:clamp(.88rem,2.2vw,1.1rem);color:var(--soft);margin-top:.6em;line-height:1.5}
.btn{font-family:var(--ui);font-size:clamp(1.02rem,2.6vw,1.26rem);letter-spacing:.08em;text-transform:uppercase;
     background:var(--paper);border:3px solid var(--ink);padding:.5em 1.05em;margin:.65em .25em 0;cursor:pointer;
     box-shadow:4px 4px 0 var(--ink);min-height:46px}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.go{background:var(--rust);color:#fff;border-color:var(--ink)}

/* toast */
#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:5;pointer-events:none;
       background:var(--paper);border:2px solid var(--rust);padding:.6em .9em;max-width:84%;text-align:center;
       font-family:var(--ui);font-size:clamp(1.04rem,2.6vw,1.3rem);opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#toast b{display:block;font-family:var(--ui);font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:var(--rust)}

/* speech bubble for signs */
#bub{position:absolute;z-index:4;pointer-events:none;background:var(--paper);border:2px solid var(--ink);
     padding:.4em .65em;font-family:var(--ui);font-size:clamp(.98rem,2.4vw,1.22rem);max-width:17em;
     opacity:0;transition:opacity .18s;transform:translate(-50%,-100%)}
#bub.on{opacity:1}

/* touch controls */
#pad{width:100%;max-width:760px;display:none;justify-content:space-between;align-items:center;
     padding:min(3vh,18px) 5% min(4vh,26px);gap:.6rem;flex:0 0 auto}
#pad.on{display:flex}
.pbtn{width:min(18vw,78px);height:min(18vw,78px);border-radius:50%;
      background:rgba(233,221,194,.14);border:3px solid rgba(233,221,194,.55);color:#e9ddc2;
      display:grid;place-items:center;font-size:clamp(20px,6vw,32px);touch-action:none}
.pbtn:active,.pbtn.hit{background:rgba(196,85,42,.75);color:#fff}
.padL,.padR{display:flex;gap:.7rem}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <span class="box">GRIT <span class="rust" id="hlife">3</span></span>
      <span class="box">CODE <span class="rust" id="hcode">0</span>/<span id="hcodemax">14</span></span>
      <span class="box" id="mis">—</span>
      <span class="box" id="lvl">The Salt Desert</span>
      <span class="box" id="exit" role="button" tabindex="0" title="Leave the county">EXIT</span>
    </div>
    <div id="bub"></div>
    <div id="toast"></div>
    <div id="ov"><div id="card"></div></div>
  </div>
  <div id="pad">
    <div class="padL"><div class="pbtn" id="pleft">◀</div><div class="pbtn" id="pright">▶</div></div>
    <div class="padR"><div class="pbtn" id="plasso">➰</div><div class="pbtn" id="pjump">▲</div></div>
  </div>
</div>

<script>
"use strict";
/* ==================================================================== setup */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let VW=480, VH=270;      // world units visible (VW adapts, VH follows the aspect)
let SC=1, DPR=1, CAMY=0;
const GROUND_Y=210;      // every level's ground line lives here
const DEATH_Y=430;       // fall past this and you have left the world
function resize(){
  const r=cv.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*DPR); cv.height=Math.round(r.height*DPR);
  // Zoom in on narrow screens so the character is not a speck.
  VW = r.width<560 ? 300 : 480;
  SC = cv.width/VW;
  VH = VW*cv.height/cv.width;
  // Keep the ground line at ~80% down the view whatever shape the screen is.
  CAMY = GROUND_Y - 0.80*VH;
}
addEventListener("resize",resize);

// Canvas has no CSS cascade: every ctx.font string needs the family spelled
// out. UIF is that one string, and the loads below pull both cuts down early so
// the first frames are not drawn in the fallback.
const UIF='"Western Bang Bang",ui-monospace,monospace';
if(document.fonts&&document.fonts.load){
  try{ document.fonts.load('16px "Western Bang Bang"');
       document.fonts.load('italic 16px "Western Bang Bang"'); }catch(e){}
}

const isTouch = matchMedia("(hover:none)").matches || "ontouchstart" in window;
if(isTouch) pad.classList.add("on");

// hat.png is a scan on a white background. Rather than asking anyone to keep a
// pre-cut transparent copy in sync, the white is knocked out here at load time
// and the result trimmed to its content — so dropping in a new hat.png just works.
/* Every piece of hand-drawn art in this game is a scan on white paper. One
   loader handles them all: knock the paper out to transparent, trim to the ink,
   and hand back a canvas the game can draw like any other sprite.

   Reading those pixels needs a canvas the browser will let us read back.
   Opening this page straight off disk (file://) taints the canvas the moment a
   separately-loaded image is drawn on it and getImageData throws. Two ways out,
   in order: the hat carries an inline copy of itself (small enough to embed),
   and anything larger falls back to drawing the raw image in "multiply" mode —
   white multiplies away against the paper background, so the knockout is not
   needed. If an image is missing outright, the drawn version is still there. */
/* Scans are line art a few thousand pixels wide, shown about a hundred wide.
   Straight downscaling thins the lines to a grey whisper next to the game's
   chunky 2.4-unit strokes, so after trimming each sprite is reduced to a
   working size, its ink dilated a pixel and its alpha boosted, then tinted to
   the game's ink colour. That is what makes a photographed drawing sit in the
   same world as a drawn one. */
function spriteFinish(src,opt){
  const maxW=opt.maxW||360;
  const sc=Math.min(1,maxW/src.width);
  const w=Math.max(1,Math.round(src.width*sc)), h=Math.max(1,Math.round(src.height*sc));
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const g=c.getContext("2d");
  g.imageSmoothingEnabled=true; g.drawImage(src,0,0,w,h);
  if(!opt.weight&&!opt.dilate&&!opt.tint) return c;
  const d=g.getImageData(0,0,w,h), p=d.data;
  if(opt.weight){ const k=opt.weight;
    for(let i=3;i<p.length;i+=4) p[i]=Math.min(255,Math.round(p[i]*k)); }
  if(opt.dilate){
    const a=new Uint8ClampedArray(w*h);
    for(let i=0,j=3;i<a.length;i++,j+=4) a[i]=p[j];
    const r=opt.dilate;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      let m=0;
      for(let dy=-r;dy<=r;dy++){ const yy=y+dy; if(yy<0||yy>=h)continue;
        for(let dx=-r;dx<=r;dx++){ const xx=x+dx; if(xx<0||xx>=w)continue;
          const v=a[yy*w+xx]; if(v>m)m=v; } }
      p[(y*w+x)*4+3]=m;
    }
  }
  if(opt.tint){
    const t=opt.tint, R=parseInt(t.substr(1,2),16), G2=parseInt(t.substr(3,2),16), B=parseInt(t.substr(5,2),16);
    for(let i=0;i<p.length;i+=4){ p[i]=R; p[i+1]=G2; p[i+2]=B; }
  }
  g.putImageData(d,0,0);
  return c;
}
function spriteBuild(img,flip,opt){
  const w=img.naturalWidth, h=img.naturalHeight;
  if(!w||!h) return null;
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const g=c.getContext("2d"); g.drawImage(img,0,0);
  const d=g.getImageData(0,0,w,h), p=d.data;        // throws if the canvas is tainted
  for(let i=0;i<p.length;i+=4){
    const m=Math.min(p[i],p[i+1],p[i+2]);
    if(m>240) p[i+3]=0;                                   // paper -> gone
    else if(m>205) p[i+3]=Math.round(255*(240-m)/35);     // soft edge
  }
  g.putImageData(d,0,0);
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(p[(y*w+x)*4+3]>12){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if(x1<0) return null;
  const tw=x1-x0+1, th=y1-y0+1;
  const t=document.createElement("canvas"); t.width=tw; t.height=th;
  const tg=t.getContext("2d");
  if(flip){ tg.translate(tw,0); tg.scale(-1,1); }
  tg.drawImage(c,x0,y0,tw,th,0,0,tw,th);
  return opt ? spriteFinish(t,opt) : t;
}
/* A photographed animal cannot swing its legs — unless you find them first.
   Hollow line art defeats the obvious tricks (a row through the belly crosses
   the outline twice, exactly like a row through two legs), so the belly line is
   given per sprite as a fraction of the height and only the legs below it are
   detected: sample two rows inside that band, take each run of ink as a leg,
   match the rows up by centre to get the leg's lean, and keep a parallelogram
   that follows it. Drawing clips to those shapes and rotates each one about the
   point where it meets the body — which is how a cartoon horse walks. */
function spriteLegs(cv,cfg){
  try{
    const w=cv.width, h=cv.height;
    const p=cv.getContext("2d").getImageData(0,0,w,h).data;
    const gap=Math.max(4,Math.round(w*0.016));
    const runsAt=function(y){
      const out=[]; let s0=-1, miss=0;
      y=Math.max(0,Math.min(h-1,Math.round(y)));
      for(let x=0;x<w;x++){
        if(p[(y*w+x)*4+3]>40){ if(s0<0)s0=x; miss=0; }
        else if(s0>=0){ if(++miss>gap){ out.push([s0,x-miss]); s0=-1; miss=0; } }
      }
      if(s0>=0) out.push([s0,w-1]);
      return out.filter(function(r){ return r[1]-r[0]>=2; });
    };
    const top=Math.round(h*(cfg.top||0.72)), bot=h-1;
    if(bot-top < h*0.08) return null;
    const yA=top+(bot-top)*0.20, yB=top+(bot-top)*0.60;   // above the hooves, below the belly
    const rA=runsAt(yA), rB=runsAt(yB);
    if(rB.length<2) return null;
    const pad=Math.max(2,Math.round(w*0.018));
    let legs=rB.map(function(rb){
      const cb=(rb[0]+rb[1])/2;
      let best=null, bd=1e9;
      rA.forEach(function(ra){ const d=Math.abs((ra[0]+ra[1])/2-cb); if(d<bd){bd=d;best=ra;} });
      // A run more than a fifth of the sprite away is some other part of the
      // drawing, not this leg higher up: fall back to a vertical leg.
      const useA = best && bd < w*0.20;
      const ca = useA ? (best[0]+best[1])/2 : cb;
      const m  = useA ? (cb-ca)/(yB-yA) : 0;
      const wid= Math.max(rb[1]-rb[0], useA?best[1]-best[0]:0)/2 + pad;
      return {x:ca-m*(yA-top), m:m, wid:wid};
    });
    legs.sort(function(a,b){ return a.x-b.x; });
    legs=legs.filter(function(g,i){ return i===0 || g.x-legs[i-1].x > w*0.03; }).slice(0,4);
    if(legs.length<2) return null;
    return {top:top, bot:bot, legs:legs};
  }catch(e){ return null; }
}
function loadSprite(src,flip,onFail,opt,legcfg){
  const S={ready:false, cv:null, img:null, flip:!!flip};
  const im=new Image();
  im.onload=function(){
    S.img=im;
    try{ const c=spriteBuild(im,flip,opt); if(c){ S.cv=c; S.ready=true; S.legs=legcfg?spriteLegs(c,legcfg):null; return; } }
    catch(e){ S.ready=true; return; }   // tainted: keep S.img, draw it multiplied
    if(onFail) onFail(S);
  };
  im.onerror=function(){ if(onFail) onFail(S); };
  im.src=src;
  return S;
}
/* Draw a sprite standing on the current origin, w x h, bottom-centred. */
function drawSprite(S,w,h){
  if(S.cv){ ctx.drawImage(S.cv,-w/2,-h,w,h); return true; }
  if(S.img){
    ctx.save();
    ctx.globalCompositeOperation="multiply";       // white paper multiplies away
    if(S.flip){ ctx.scale(-1,1); }
    ctx.drawImage(S.img,-w/2,-h,w,h);
    ctx.restore(); return true;
  }
  return false;
}

const HAT={ready:false, cv:null, img:null};
(function(){
  const fromInline=function(){
    const im=new Image();
    im.onload=function(){ try{ const c=spriteBuild(im,false); if(c){HAT.cv=c; HAT.ready=true;} }catch(e){} };
    im.src=HAT_PNG;
  };
  const S=loadSprite("hat.png",false,fromInline);
  // hat.png is small enough to carry inline, so it never needs the multiply
  // path — if the pixels cannot be read, swap straight to the embedded copy.
  const poll=setInterval(function(){
    if(S.ready){ clearInterval(poll);
      if(S.cv){ HAT.cv=S.cv; HAT.ready=true; } else fromInline(); }
  },60);
  setTimeout(function(){ clearInterval(poll); if(!HAT.ready) fromInline(); },4000);
})();

// The herd. Missing file -> the drawn version below is used instead, so
// dropping a cow.png in beside the others is all it takes to swap the cow too.
const INK_ART={maxW:360, weight:2.2, dilate:1, tint:"#241c14"};
// Where the body stops and the legs start, as a fraction of the sprite height.

const K={left:false,right:false,jump:false,jumpPressed:false,lasso:false,lassoPressed:false};
const keymap={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",
              ArrowUp:"jump",KeyW:"jump",Space:"lasso",KeyJ:"lasso"};
addEventListener("keydown",e=>{
  const k=keymap[e.code];
  if(k){
    if(k==="jump"&&!K.jump)K.jumpPressed=true;
    if(k==="lasso"&&!K.lasso)K.lassoPressed=true;
    K[k]=true; e.preventDefault();
  }
  if(e.code==="Escape" && !ov.classList.contains("on")){ askExit(); return; }
  if(e.code==="Enter"||e.code==="Escape"){
    if(!ov.classList.contains("on")) return;
    // On the leave-the-county card the two keys mean opposite things: Escape
    // backs out, Enter goes through with it. Everywhere else both just continue.
    const bs=card.querySelectorAll(".btn");
    if(exitPend && bs.length>1){ (e.code==="Escape"?bs[0]:bs[1]).click(); return; }
    if(bs[0]) bs[0].click();
  }
});
addEventListener("keyup",e=>{const k=keymap[e.code]; if(k){K[k]=false; e.preventDefault();}});
function bindPad(id,key){
  const b=el(id);
  const on=e=>{e.preventDefault();
    if(key==="jump"&&!K.jump)K.jumpPressed=true;
    if(key==="lasso"&&!K.lasso)K.lassoPressed=true;
    K[key]=true; b.classList.add("hit");};
  const off=e=>{e.preventDefault(); K[key]=false; b.classList.remove("hit");};
  b.addEventListener("touchstart",on,{passive:false}); b.addEventListener("touchend",off,{passive:false});
  b.addEventListener("touchcancel",off,{passive:false});
  b.addEventListener("mousedown",on); addEventListener("mouseup",off);
}
bindPad("pleft","left"); bindPad("pright","right"); bindPad("pjump","jump"); bindPad("plasso","lasso");

/* ================================================================== drawing */
function L(a,b,c,d,w){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineWidth=w||2.4;ctx.stroke();}
function setInk(c,w){ctx.strokeStyle=c||"#241c14";ctx.lineWidth=w||2.4;ctx.lineCap="round";ctx.lineJoin="round";}

/* --- D! : circle head w/ face, rust hand-drawn hat, swinging arms + legs --- */
function drawD(x,y,phase,onGround,vy,face,ghost,armPose,netFace,seat){
  ctx.save(); ctx.translate(x,y); ctx.scale(face,1);
  if(ghost)ctx.globalAlpha=.45;
  setInk("#241c14",2.5);
  const HEAD_R=5.6, headY=-23.4, hip=-10.4, legLen=11.0, sh=-15.6, armLen=8.4;
  // Rest angles, measured from straight-down. Without these the limbs hang
  // vertically and the figure reads as a post; the reference has arms and legs
  // splayed into a shallow V.
  const REST_LEG=0.34, REST_ARM=1.02;

  let la,lb,aa,ab;
  if(!onGround){
    if(vy<0){ la=-0.50; lb= 0.44; aa=-0.72; ab=-0.52; }   // rising: knees up, arms raised
    else    { la= 0.30; lb=-0.30; aa= 0.28; ab= 0.14; }   // falling: legs reach for ground
  }else{
    const sp=Math.sin(phase);
    la= sp*0.62; lb=-sp*0.62;      // legs alternate
    aa=-sp*0.50; ab= sp*0.50;      // arms counter-swing against the legs
  }
  // throwing arm overrides the run swing: 1 = winding overhead, 2 = released
  if(armPose===1) aa=1.38;
  else if(armPose===2) aa=0.88;
  // legs -------------------------------------------------------------------
  let l1=REST_LEG+la, l2=-REST_LEG+lb;
  let a1=REST_ARM+aa, a2=-REST_ARM+ab;
  // In the saddle the legs stop walking and hang forward over the flank, and
  // the free hand comes down to the reins. A rider running on the spot above a
  // horse was the tell that these two poses were sharing one animation.
  if(seat){
    // Near leg well forward over the shoulder, far leg tucked down behind the
    // barrel. Both at the same angle turns the whole rider into one black wedge
    // at this stroke width — the spread is what makes him read as sitting.
    l1=1.20; l2=0.30;
    if(!armPose){ a1=0.80; a2=0.30; }
  }
  L(0,hip, Math.sin(l1)*legLen, hip+Math.cos(l1)*legLen);
  L(0,hip, Math.sin(l2)*legLen, hip+Math.cos(l2)*legLen);
  // torso ------------------------------------------------------------------
  L(0,hip,0,headY+HEAD_R-0.4);
  // arms -------------------------------------------------------------------
  L(0,sh, Math.sin(a1)*armLen, sh+Math.cos(a1)*armLen*0.80);
  L(0,sh, Math.sin(a2)*armLen, sh+Math.cos(a2)*armLen*0.80);
  // head -------------------------------------------------------------------
  ctx.beginPath(); ctx.arc(0,headY,HEAD_R,0,7); ctx.fillStyle="#f3ead6"; ctx.fill(); ctx.stroke();
  // No face. D! is read by his hat, his stance and his rope — a blank head
  // keeps him a stick figure you project onto rather than a cartoon.
  // hat: D!'s own — upswept brim, tapered crown, "D!" on the front.
  drawHat(0, headY-HEAD_R-2.0, netFace===undefined?face:netFace);
  ctx.restore();
}

/* --- D!'s hat ------------------------------------------------------------ */
function drawHat(hx,hy,face){
  ctx.save(); ctx.translate(hx,hy);
  if(HAT.ready && HAT.cv){
    ctx.save(); ctx.scale(face,1);          // cancel the body mirror so "D!" reads
    // The sprite's brim underside sits at ~0.71 of its height, not at the bottom
    // edge (the side flaps hang lower). Seat by that line, not by the image box,
    // or the hat floats above the skull.
    const W=18.0, H=W*HAT.cv.height/HAT.cv.width;
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(HAT.cv, -W/2+0.5, 9.1-H, W, H);   // brim dips onto the skull
    ctx.restore(); ctx.restore(); return;
  }
  // The caller is already mirrored by `face`; scaling by it again cancels that
  // out, so the "D!" on the crown never comes out backwards.
  ctx.scale(face,1);
  setInk("#c4552a",2.2);
  ctx.beginPath();                                   // brim, outer sweep
  ctx.moveTo(-10.6,-2.4);
  ctx.quadraticCurveTo(-10.8,2.7, 0,4.1);
  ctx.quadraticCurveTo(10.8,2.7, 10.6,-2.4);
  ctx.stroke();
  ctx.beginPath();                                   // brim, inner sweep
  ctx.moveTo(-10.6,-2.4);
  ctx.quadraticCurveTo(-6.2,0.5, 0,1.1);
  ctx.quadraticCurveTo(6.2,0.5, 10.6,-2.4);
  ctx.stroke();
  ctx.beginPath();                                   // crown, tapering upward
  ctx.moveTo(-4.8,0.8); ctx.lineTo(-3.4,-7.1);
  ctx.moveTo(4.8,0.8);  ctx.lineTo(3.4,-7.1);
  ctx.stroke();
  ctx.beginPath();                                   // top of the crown
  ctx.ellipse(0,-7.3,3.4,1.3,0,0,7); ctx.stroke();
  setInk("#c4552a",1.3);
  ctx.beginPath();                                   // band
  ctx.moveTo(-4.6,-0.3); ctx.quadraticCurveTo(0,0.6,4.6,-0.3); ctx.stroke();
  ctx.fillStyle="#241c14";                           // the signature
  ctx.font="5.6px "+UIF;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("D!",0,-3.5);
  ctx.restore();
}

/* --- demons -------------------------------------------------------------- */
function drawFoe(f){
  const x=f.x, y=f.y, s=f.small?0.72:1, wob=Math.sin(G.t*8+f.seed)*1.6;
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  setInk("#a5321f",2.3);
  if(f.kind==="anx"){
    ctx.save(); ctx.translate(wob*0.6,-wob*0.5);
    ctx.beginPath();
    ctx.moveTo(-9,0); ctx.quadraticCurveTo(-11,-14,-6,-18);
    ctx.quadraticCurveTo(0,-22,6,-18); ctx.quadraticCurveTo(11,-14,9,0);
    ctx.closePath(); ctx.fillStyle="rgba(165,50,31,.13)"; ctx.fill(); ctx.stroke();
    setInk("#a5321f",1.7);
    L(-5,-13,-1.6,-10.4); L(5,-13,1.6,-10.4);
    ctx.beginPath(); ctx.arc(0,-4.5,3.1,Math.PI+0.3,-0.3); ctx.stroke();
    L(-11,-19,-15,-23); L(11,-19,15,-23); L(0,-22,0,-27);
    ctx.restore();
  }else if(f.kind==="dbt"){
    ctx.globalAlpha=.75;
    ctx.beginPath(); ctx.arc(0,-15,5.6,0,7); ctx.fillStyle="rgba(165,50,31,.10)"; ctx.fill(); ctx.stroke();
    L(0,-9.4,0,-3); L(0,-3,-4.5,3); L(0,-3,4.5,3); L(0,-7.5,-5,-4.5); L(0,-7.5,5,-4.5);
    setInk("#a5321f",1.6);
    L(-2.4,-16.4,-0.8,-15.2); L(2.4,-16.4,0.8,-15.2);
    ctx.beginPath(); ctx.arc(0,-12.4,2.2,Math.PI+0.35,-0.35); ctx.stroke();
    ctx.globalAlpha=1; ctx.fillStyle="#a5321f"; ctx.font="10px "+UIF;
    ctx.textAlign="center"; ctx.fillText("?",0,-23+wob*0.4);
  }else{
    ctx.beginPath(); ctx.ellipse(1,1,11,2.6,0,0,7); ctx.fillStyle="rgba(165,50,31,.20)"; ctx.fill();
    ctx.beginPath(); ctx.arc(0,-13,4.8,0,7); ctx.fillStyle="rgba(165,50,31,.10)"; ctx.fill(); ctx.stroke();
    L(0,-8.2,0,-3); L(0,-3,-3.6,2.4); L(0,-3,3.6,2.4);
    L(0,-6.8,-4.2,-3.4); L(0,-6.8,4.2,-3.4);
    setInk("#a5321f",1.5);
    ctx.beginPath(); ctx.arc(0,-11.2,2.4,0.35,Math.PI-0.35); ctx.stroke();   // frown
    L(-2.0,-14.6,-0.7,-13.6); L(2.0,-14.6,0.7,-13.6);
  }
  ctx.restore();
}

/* --- the herd: horse, bull, cow ----------------------------------------- */
function legSwing(a,i){ return a.moving ? Math.sin(G.t*7+a.seed+i*1.6)*0.45 : 0; }
function quadLegs(a,y,pairs,len){
  pairs.forEach((lx,i)=>{ const k=legSwing(a,i);
    L(lx,y, lx+Math.sin(k)*len*0.5, y+Math.cos(k)*len); });
}
function drawHorseVec(a){
  ctx.save(); ctx.translate(a.x,a.y); ctx.scale(a.dir,1);
  setInk("#4a3520",2.4);
  L(-17,-25,13,-26);                              // back
  quadLegs(a,-25,[-14,-9,7,12],25);
  L(13,-26,21,-37);                               // neck
  ctx.beginPath(); ctx.moveTo(21,-37);            // head + muzzle
  ctx.quadraticCurveTo(29,-40,30,-33);
  ctx.quadraticCurveTo(26,-31,21,-33); ctx.closePath(); ctx.stroke();
  setInk("#4a3520",1.6);
  L(21,-40,19,-45); L(25,-40,26,-45);             // ears
  ctx.beginPath(); ctx.arc(27,-36,0.9,0,7); ctx.fillStyle="#4a3520"; ctx.fill();
  setInk("#8a6a2f",2);
  ctx.beginPath(); ctx.moveTo(12,-28);            // mane
  ctx.quadraticCurveTo(18,-34,20,-42); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-17,-25);           // tail
  ctx.quadraticCurveTo(-25,-22,-24,-9); ctx.stroke();
  ctx.restore();
}
function drawBullVec(a){
  ctx.save(); ctx.translate(a.x,a.y); ctx.scale(a.dir,1);
  setInk("#2f2418",2.9);
  ctx.beginPath();                                 // back, with a shoulder hump
  ctx.moveTo(-19,-21); ctx.lineTo(-5,-23);
  ctx.quadraticCurveTo(4,-31,13,-25); ctx.stroke();
  quadLegs(a,-22,[-15,-10,7,12],22);
  ctx.beginPath();                                 // blunt lowered head
  ctx.moveTo(13,-25); ctx.lineTo(23,-19);
  ctx.lineTo(24,-11); ctx.lineTo(15,-13);
  ctx.closePath(); ctx.stroke();
  setInk("#2f2418",2.4);
  ctx.beginPath(); ctx.moveTo(14,-24);             // near horn
  ctx.quadraticCurveTo(8,-31,15,-33); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(21,-22);             // far horn
  ctx.quadraticCurveTo(28,-30,30,-22); ctx.stroke();
  ctx.fillStyle="#2f2418"; ctx.beginPath(); ctx.arc(19,-17,1.1,0,7); ctx.fill();
  setInk("#2f2418",2);
  ctx.beginPath(); ctx.moveTo(-19,-21);            // tail

}
/* Sprite versions. The footprints match the drawn animals they replace, so no
   level geometry, rope reach or riding offset has to move. A still photograph
   cannot swing its legs, so a walking animal gets a small bob and rock instead —
   enough to stop it reading as a sticker. */
/* Standing still: one flat drawImage. Walking: the body above the belly line,
   then each leg redrawn from its own clip, rotated about the pivot where it
   meets the body. The pivot sits exactly on the clip edge, so the top of a leg
   never moves and no seam opens up. */
function drawWalking(S,w,h,ph){
  const L=S.legs, C=S.cv, W=C.width, H=C.height;
  const sx=w/W, sy=h/H;                      // sprite pixels -> world units
  const X=px=>-w/2+px*sx, Y=py=>-h+py*sy;
  const topY=Y(L.top), botY=Y(L.bot)+3;
  ctx.save();                                 // body: everything above the belly
  ctx.beginPath(); ctx.rect(-w/2-2,-h-2,w+4,(topY+1)-(-h-2)); ctx.clip();
  ctx.drawImage(C,-w/2,-h,w,h);
  ctx.restore();
  L.legs.forEach(function(g,i){
    const ang=Math.sin(ph+i*Math.PI/2)*0.17;  // a quarter cycle apart: a walk
    const xb=g.x+g.m*(L.bot+3-L.top);
    ctx.save();
    ctx.translate(X(g.x),topY); ctx.rotate(ang); ctx.translate(-X(g.x),-topY);
    ctx.beginPath();
    // reach a little above the belly line so the join never opens a seam
    ctx.moveTo(X(g.x-g.wid),topY-3); ctx.lineTo(X(g.x+g.wid),topY-3);
    ctx.lineTo(X(xb+g.wid),botY);   ctx.lineTo(X(xb-g.wid),botY);
    ctx.closePath(); ctx.clip();
    ctx.drawImage(C,-w/2,-h,w,h);
    ctx.restore();
  });
}
function drawBeast(a,S,w,h,vec){
  if(!(S.cv||S.img)) return vec(a);
  const ph   = G.t*7+a.seed;
  const bob  = a.moving ? Math.abs(Math.sin(ph*2))*1.3 : 0;
  const rock = a.moving ? Math.sin(ph)*0.035 : 0;
  ctx.save(); ctx.translate(a.x,a.y); ctx.scale(a.dir,1);
  ctx.rotate(rock); ctx.translate(0,-bob);
  if(a.moving && S.cv && S.legs) drawWalking(S,w,h,ph);
  else drawSprite(S,w,h);
  ctx.restore();
}
function drawHorse(a){ drawBeast(a,HORSE,50,46,drawHorseVec); }
function drawBull (a){ drawBeast(a,BULL, 61,36,drawBullVec ); }
function drawCow  (a){ drawBeast(a,COW,  51,38,drawCowVec  ); }

function drawPal(a){
  if(a.gone) return;
  if(a.kind==="horse") drawHorse(a); else if(a.kind==="bull") drawBull(a); else drawCow(a);
  if(!a.used){                                    // little "rope me" marker
    const b=Math.sin(G.t*3+a.seed)*1.6;
    setInk("#8a6a2f",1.8);
    ctx.save(); ctx.translate(a.x,a.y-46+b); ctx.rotate(G.t*3);
    ctx.beginPath(); ctx.ellipse(0,0,5.4,2.2,0,0,7); ctx.stroke(); ctx.restore();
  }
}
/* --- D! up on the horse -------------------------------------------------- */
function drawRider(x,y,face){
  const a={x:0,y:0,dir:1,moving:Math.abs(P.vx)>20,seed:0};
  ctx.save(); ctx.translate(x,y); ctx.scale(face,1);
  drawHorse(a);
  // Seat measured off the sprite: the back line sits ~48% down the image and
  // just behind its middle. HORSE.cv missing -> the drawn horse, whose back
  // is at -26, so the offset shifts with it.
  ctx.save(); HORSE.cv ? ctx.translate(-11,-25) : ctx.translate(-1,-26); ctx.scale(0.82,0.82);
  drawD(0,0,0,true,0,1,false,P.la.st===1?1:(P.la.st>1?2:0),face,true);
  ctx.restore();
  ctx.restore();
}

/* --- scenery ------------------------------------------------------------- */
function drawDeco(kind,x,gy){
  ctx.save(); ctx.translate(x,gy); setInk("#6b5843",2.2);
  if(kind==="cactus"){ L(0,0,0,-26); L(0,-16,-7,-16); L(-7,-16,-7,-21); L(0,-20,6,-20); L(6,-20,6,-25); }
  if(kind==="skull"){ ctx.beginPath();ctx.arc(0,-6,5,0,7);ctx.stroke();
    ctx.fillStyle="#6b5843";ctx.beginPath();ctx.arc(-1.9,-6.6,1.1,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(1.9,-6.6,1.1,0,7);ctx.fill(); L(-6,-9,-10,-13); L(6,-9,10,-13); }
  if(kind==="tree"){ L(0,0,0,-16); L(0,-10,-6,-17); L(0,-12,6,-19); L(0,-6,-5,-11); }
  if(kind==="bed"){ L(-11,0,-11,-8); L(11,0,11,-6); L(-11,-8,11,-8); L(-11,-4,11,-4); }
  if(kind==="scope"){ ctx.strokeRect(-9,-14,18,13);
    setInk("#a5321f",1.6); ctx.beginPath(); ctx.moveTo(-6,-7);
    for(let i=-6;i<=6;i+=1.5)ctx.lineTo(i,-7-Math.sin(i*1.1)*3.4); ctx.stroke(); }
  ctx.restore();
}
function drawBack(kind,cam){
  const h=VH;
  ctx.save();
  // sun
  setInk("#c4552a",2); ctx.beginPath(); ctx.arc(VW-64,44,17,0,7); ctx.stroke();
  // parallax hills
  const off=-cam*0.25;
  setInk("#c9b894",2.2);
  ctx.beginPath(); ctx.moveTo(-20,190);
  for(let i=0;i<9;i++){ const bx=off%320+i*140-160; ctx.lineTo(bx+70, 150-(i%3)*16); ctx.lineTo(bx+140,190); }
  ctx.stroke();
  if(kind==="town"||kind==="lab"){
    const o2=-cam*0.45; setInk("#bfae8a",2);
    for(let i=0;i<8;i++){ const bx=(o2%420)+i*150-200, bh=44+(i%3)*16;
      ctx.strokeRect(bx,190-bh,74,bh); L(bx-5,190-bh,bx+37,190-bh-14); L(bx+37,190-bh-14,bx+79,190-bh); }
  }
  if(kind==="ridge"){ const o3=-cam*0.35; setInk("#c0ac86",2.4);
    ctx.beginPath(); ctx.moveTo(-40,196);
    for(let i=0;i<7;i++){const bx=(o3%460)+i*200-220; ctx.lineTo(bx+95,110+(i%2)*22); ctx.lineTo(bx+200,196);} ctx.stroke(); }
  ctx.restore();
}

/* ==================================================================== level */
function loadLevel(i){
  G.li=i; const L0=LEVELS[i]; G.lvl=L0; G.goalHit=false; G.cam=0; G.boss=null;
  P.x=L0.spawn[0]; P.y=L0.spawn[1]; P.safeX=L0.spawn[0]; P.safeY=L0.spawn[1]; P.vx=0; P.vy=0; P.alive=true; P.hurt=0; P.phase=0; P.face=1;
  G.foes=(L0.foes||[]).map((f,n)=>({x:f[0],y:f[1],kind:f[2],home:f[0],range:f[3],dir:n%2?1:-1,
                                    dead:0,seed:n*1.7,small:false,vy:0}));
  G.gems=(L0.gems||[]).map(g=>({x:g[0],y:g[1],ci:g[2],got:false}));
  G.signs=(L0.signs||[]).map(s=>({x:s[0],y:s[1],t:s[2]}));
  // movs: [x,y,w,h,axisX,axisY,range,speed] — oscillate and carry the player
  G.movs=(L0.movs||[]).map((m,i)=>({hx:m[0],hy:m[1],w:m[2],h:m[3],ax:m[4],ay:m[5],
                                    range:m[6],sp:m[7]||1,t:i*1.3,x:m[0],y:m[1],px:m[0],py:m[1]}));
  G.plats=(L0.plats||[]).slice();
  // pals: [x,kind] — the herd. Rope them to put them to work.
  G.pals=(L0.pals||[]).map((a,i)=>({x:a[0],y:GROUND_Y,kind:a[1],dir:-1,seed:i*2.1,
                                    moving:false,used:false,gone:false}));
  G.charge=null; P.ride=null; G.foeTotal=G.foes.length;
  el("lvl").textContent=L0.name;
  if(L0.boss) G.boss={stage:0,foes:[],cur:null,gap:0,done:false,started:false};
  showCard(L0.name,L0.sub,L0.intro+(L0.mission?"\n<b>Mission: "+L0.mission.hint+"</b>":""),
           "Ride",()=>{G.mode="play";});
}
function levelGoalX(){return G.lvl.goal;}
/* A level is not finished by walking right. Each one sets a job. */
function misState(){
  const m=G.lvl.mission;
  if(!m) return {done:true,label:"—"};
  if(m.type==="clear"){
    const left=G.foes.filter(f=>!f.dead).length, got=G.foeTotal-left;
    return {done:left===0,label:`ROPE ${got}/${G.foeTotal}`};
  }
  if(m.type==="codes"){
    const got=G.gems.filter(g=>g.got).length;
    return {done:got===G.gems.length,label:`CARDS ${got}/${G.gems.length}`};
  }
  if(m.type==="both"){
    const left=G.foes.filter(f=>!f.dead).length, got=G.foeTotal-left;
    const c=G.gems.filter(g=>g.got).length;
    return {done:left===0&&c===G.gems.length,label:`${got}/${G.foeTotal} + ${c}/${G.gems.length}`};
  }
  if(m.type==="boss") return {done:!!(G.boss&&G.boss.done),label:"THE LAST RIDE"};
  return {done:true,label:"—"};
}

/* ================================================================ overlays */
function showCard(title,sub,body,btn,fn,btn2,fn2,keys){
  G.mode="card";
  card.innerHTML=`<h2>${title}</h2><div class="sub">${sub}</div>`+
    body.split("\n").map(p=>`<p>${p}</p>`).join("")+
    `<div class="keys">${keys!==undefined?keys:(isTouch?"◀ ▶ move · ▲ jump · ➰ lasso":"← → move · ↑ / W jump · SPACE throw the lasso · Enter to continue")}</div>`;
  const b=document.createElement("button"); b.className="btn go"; b.textContent=btn;
  b.onclick=()=>{ov.classList.remove("on"); fn&&fn();}; card.appendChild(b);
  if(btn2){const b2=document.createElement("button");b2.className="btn";b2.textContent=btn2;
    b2.onclick=()=>{ov.classList.remove("on"); fn2&&fn2();}; card.appendChild(b2);}
  ov.classList.add("on");
}
/* Leaving the game. Asked, never assumed — a stray tap on the HUD should not
   throw away a run. The card pauses the game the same way every other card
   does, and answering "Stay" puts the player back exactly where they were. */
let exitPend=false;
function askExit(){
  if(exitPend || ov.classList.contains("on")) return;   // a card is already up
  const back = G.mode;
  exitPend=true;
  showCard("Ride out of Adàwe?","Back to wantedbull.com",
    "The trail out leads to the front page.\nNothing is saved — come back and you start again in the salt desert.",
    "Stay", ()=>{ exitPend=false; G.mode=back; },
    "Ride out", ()=>{ location.href="/"; },
    isTouch ? "tap Stay to carry on" : "Esc to stay · Enter to ride out");
}
el("exit").addEventListener("click",askExit);
el("exit").addEventListener("keydown",e=>{ if(e.code==="Enter"||e.code==="Space"){e.preventDefault();askExit();} });

let toastT=0;
// A fixed hold was fine for "hog-tied." and far too short for a full Code of
// the West line, which is the one thing in here worth reading. Length sets the
// time: roughly a slow reading pace, floored so short lines still register.
function toast(head,body,secs){
  toastEl.innerHTML=`<b>${head}</b>${body}`; toastEl.classList.add("on");
  toastT = secs || Math.min(9, 3.2 + String(body).length/18);
}

/* ===================================================================== dust */
/* The same ringed puffs D! kicks up walking out of the ranch on page 3 of the
   flip-book, made live: thrown backwards off the heel or the hoof, drifting up
   and outwards, thinning as they go. Capped, because a bull at full charge
   would otherwise emit for as long as it runs. */
const DUST_MAX=80;
function puff(x,y,dir,power){
  if(G.dust.length>=DUST_MAX) return;
  G.dust.push({ x:x+(Math.random()-0.5)*5, y:y-Math.random()*4,
                r:1.1+Math.random()*1.6, t:0, life:0.34+Math.random()*0.30,
                vx:-dir*(14+Math.random()*30)*power,
                // Rising matters more than trailing: without it the puffs line
                // up along the ground and read as a row of circles, not a cloud.
                vy:-(22+Math.random()*30)*power });
}
function burst(x,y,n,power){ for(let i=0;i<n;i++) puff(x,y,i%2?1:-1,power); }
/* Rate-limited emitter. The accumulator lives on the thing kicking the dust up,
   so each animal keeps its own cadence rather than sharing one global timer. */
function kick(o,dt,x,y,dir,power,rate){
  o._d=(o._d||0)+dt;
  const iv=1/rate;
  let guard=6;
  while(o._d>=iv && guard-->0){ o._d-=iv; puff(x,y,dir,power); }
  if(o._d>iv) o._d=0;
}
function dustStep(dt){
  for(let i=G.dust.length-1;i>=0;i--){
    const d=G.dust[i]; d.t+=dt;
    if(d.t>=d.life){ G.dust.splice(i,1); continue; }
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vx*=0.93; d.vy*=0.90; d.r+=dt*9;
  }
}
function drawDust(){
  if(!G.dust.length) return;
  ctx.save(); setInk("#b9a47c",1.4);
  G.dust.forEach(d=>{
    ctx.globalAlpha=Math.max(0,(1-d.t/d.life)*0.85);
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.stroke();
  });
  ctx.restore();
}

/* ================================================================== physics */
const GRAV=1750, RUN=205, AIR=0.86, JUMP=-530, MAXFALL=520;
// --- lasso ---------------------------------------------------------------
const LAS_MAX=96, LAS_SPEED=560, LAS_WIND=0.12, LAS_REEL=0.20, LAS_COOL=0.26;
// airtime 2*530/1750 = 0.606s -> max jump span ~124 world units.
// Every gap below is 60, so a mistimed jump still clears.
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function step(dt){
  const Lv=G.lvl;
  // ---- moving platforms: advance, then carry anything standing on them ----
  if(G.movs&&G.movs.length){
    G.movs.forEach(m=>{
      m.px=m.x; m.py=m.y; m.t+=dt;
      const o=Math.sin(m.t*m.sp)*m.range;
      m.x=m.hx+m.ax*o; m.y=m.hy+m.ay*o;
      const onIt = P.onGround && P.x+P.w>m.px+2 && P.x<m.px+m.w-2 &&
                   Math.abs((P.y+P.h)-m.py)<4;
      if(onIt){ P.x+=m.x-m.px; P.y+=m.y-m.py; }
    });
    G.plats=(Lv.plats||[]).concat(G.movs.map(m=>[m.x,m.y,m.w,m.h]));
  }else G.plats=(Lv.plats||[]).slice();
  // ---- horizontal ----
  const dir=(K.right?1:0)-(K.left?1:0);
  if(dir) P.face=dir;
  const RUN_NOW = P.ride?300:RUN;
  P.vx += (dir*RUN_NOW - P.vx) * (P.onGround?0.30:0.12);
  if(!dir) P.vx *= P.onGround?0.72:AIR;
  P.x += P.vx*dt;
  // Keep the player inside the level. Without this you can sprint past the boss
  // arena and off the right-hand end of the world, falling forever.
  if(P.x<0){P.x=0;P.vx=0;}
  if(P.x>Lv.len-P.w){P.x=Lv.len-P.w;P.vx=0;}
  collide(0);
  // ---- vertical ----
  const prevBottom = P.y + P.h;          // needed for one-way platform logic
  const onBefore=P.onGround, vyBefore=P.vy;
  P.vy=Math.min(MAXFALL,P.vy+GRAV*dt);
  P.y += P.vy*dt;
  P.onGround=false;
  collide(1,prevBottom);
  // dust: kicked off the heel while running, off the hooves while riding, and
  // thrown out in a ring on a heavy landing
  if(P.onGround && Math.abs(P.vx)>70)
    kick(P,dt, P.x+P.w/2-P.face*(P.ride?13:5), P.y+P.h-1, P.face,
         P.ride?1.30:0.90, P.ride?16:11);
  else P._d=0;
  if(P.onGround && !onBefore && vyBefore>260) burst(P.x+P.w/2,P.y+P.h-1,6,0.9);
  // ---- jump w/ coyote + buffer ----
  P.coyote = P.onGround?0.09:Math.max(0,P.coyote-dt);
  if(K.jumpPressed){P.buffer=0.13; K.jumpPressed=false;}
  P.buffer=Math.max(0,P.buffer-dt);
  if(P.buffer>0 && P.coyote>0){ P.vy=P.ride?-625:JUMP; P.buffer=0; P.coyote=0; P.onGround=false; }
  if(!K.jump && P.vy<-150) P.vy=-150;          // variable jump height
  // ---- animation phase ----
  if(P.onGround && Math.abs(P.vx)>14) P.phase += Math.abs(P.vx)*dt*0.10;
  else if(P.onGround) P.phase += (0 - (P.phase%(Math.PI*2)))*0.0;
  // ---- fell off the world ----
  if(P.y>DEATH_Y) hurt(true);
  // ---- the herd ----
  G.pals.forEach(a=>{ a.moving=false; });
  if(G.charge){
    const c=G.charge;
    c.x += c.dir*430*dt; c.life-=dt;
    G.foes.forEach(f=>{ if(!f.dead && Math.abs(f.x-c.x)<22 && Math.abs(f.y-c.y)<34){
      f.dead=0.001; G.shake=.25; toast(foeName(f),"flattened by half a tonne of friend."); } });
    if(G.boss&&G.boss.started&&G.boss.cur){ const f=G.boss.cur;
      if(Math.abs(f.x-c.x)<22 && f.hp>0){ f.hp--; f.small=true; f.stun=0.9;
        toast(foeName(f), f.hp<=0?"trampled. Next.":"knocked back by the bull."); } }
    kick(c,dt, c.x-c.dir*18, GROUND_Y-1, c.dir, 1.8, 20);
    if(c.life<=0 || c.x<G.cam-120 || c.x>G.cam+VW+160) G.charge=null;
  }
  // ---- lasso ----
  lassoStep(dt);
  // ---- foes ----
  G.foes.forEach(f=>{
    if(f.dead){ f.dead+=dt; return; }
    if(f.kind==="anx"){ f.x += f.dir*38*dt; f.y = 196 + Math.sin(G.t*3+f.seed)*13; }
    else f.x += f.dir*(f.kind==="dbt"?44:30)*dt;
    if(Math.abs(f.x-f.home)>f.range) f.dir*=-1;
    const fb={x:f.x-9,y:f.y-20,w:18,h:20}, pb=pbox();
    if(rectHit(pb,fb)){
      if(P.ride){                       // mounted: ride straight through them
        f.dead=0.001; G.shake=.2; toast(foeName(f),"ridden down.");
        return;
      }
      const above = P.vy>60 && P.y+P.h < f.y-6;
      // Anxiety hovers out of reach and Insecurity is all shadow and edges —
      // neither can be stomped. The rope is the only answer for those two.
      if(above && f.kind==="dbt"){
        f.dead=0.001; P.vy=-300; G.shake=0.18;
        toast(foeName(f),"stomped. Quieter now.");
      } else if(above){
        P.vy=-260; hurt(false);
        toast(foeName(f),"cannot be stomped. Use the rope.");
      } else hurt(false);
    }
  });
  G.foes=G.foes.filter(f=>f.dead<0.5);
  // ---- gems ----
  G.gems.forEach(g=>{
    if(g.got)return;
    if(rectHit(pbox(),{x:g.x-10,y:g.y-11,w:20,h:22})){
      g.got=true;
      if(!G.codes.includes(g.ci)){G.codes.push(g.ci); el("hcode").textContent=G.codes.length;}
      toast("Code of the West · "+CODES[g.ci][0], CODES[g.ci][1], 9);
    }
  });
  // ---- signs ----
  let near=null;
  G.signs.forEach(s=>{ if(Math.abs(s.x-(P.x+P.w/2))<58) near=s; });
  if(near){ bub.textContent=near.t; bub.classList.add("on");
    const r=cv.getBoundingClientRect(), sx=(near.x-G.cam)*(r.width/VW), sy=(near.y-34)*(r.height/VH);
    bub.style.left=Math.max(90,Math.min(r.width-90,sx))+"px"; bub.style.top=Math.max(40,sy)+"px";
  } else bub.classList.remove("on");
  // ---- boss ----
  if(Lv.boss) bossStep(dt);
  // ---- goal ----
  const ms=misState();
  el("mis").textContent=ms.label;
  if(!G.goalHit && P.x>levelGoalX()){
    if(ms.done) finishLevel();
    else if(toastT<=0) toast("Not finished", G.lvl.mission.hint);
  }
  // ---- camera ----
  const want=Math.max(0,Math.min(Lv.len-VW, P.x-VW*0.40));
  G.cam += (want-G.cam)*Math.min(1,dt*7);
  dustStep(dt);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
  if(toastT>0){toastT-=dt; if(toastT<=0)toastEl.classList.remove("on");}
}
function pbox(){return {x:P.x,y:P.y,w:P.w,h:P.h};}
function handPos(){ return {x:P.x+P.w/2+P.face*6.5, y:P.y+P.h-14}; }
function ropeTip(){
  const h=handPos(), L0=P.la.len;
  return {x:h.x+P.face*L0, y:h.y-3-Math.sin(Math.min(1,L0/LAS_MAX)*Math.PI)*6};
}
function liveFoes(){
  const a=G.foes.filter(f=>!f.dead);
  if(G.boss&&G.boss.started) a.push(...G.boss.foes.filter(f=>f.hp>0));
  return a;
}
function ropeCatch(f){
  // Boss demons take two ropings; ordinary ones go down in one.
  if(f.hp!==undefined){
    f.hp--; f.small=true;
    toast(foeName(f), f.hp<=0?"roped, and sits down a respectful distance back."
                            :"roped once. Still standing. Go again.");
    if(f.hp>0){
      // Knock it back and stagger it. Without this the boss is a grind: it
      // walks straight back into you while the rope is still on cooldown.
      f.stun=0.9; f.x += (f.x>P.x?1:-1)*34;
      P.la.st=0; P.la.cool=LAS_COOL; P.la.tgt=null; return;
    }
  }else{
    f.dead=0.001;
    toast(foeName(f),"hog-tied.");
  }
  G.roped=(G.roped||0)+1;
}
function palCatch(a){
  a.used=true;
  if(a.kind==="horse"){
    a.gone=true; P.ride={t:0};
    toast("Horse","Up you get. Faster, higher, and demons bounce off.");
  }else if(a.kind==="bull"){
    a.gone=true;
    // The bull charges the way D! is facing and flattens whatever it meets.
    G.charge={x:a.x, y:GROUND_Y, dir:P.face, life:3.2, seed:9, moving:true, kind:"bull"};
    toast("Bull","Stand back. He does not stop for anybody.");
  }else{
    a.gone=true;
    G.lives=Math.min(5,G.lives+1); el("hlife").textContent=G.lives;
    toast("Cow","Grit restored. She was never in a hurry about it.");
  }
}
function foeName(f){return f.kind==="anx"?"Anxiety":f.kind==="dbt"?"Self-Doubt":"Insecurity";}
function lassoStep(dt){
  const A=P.la;
  if(A.cool>0) A.cool-=dt;
  if(A.st===0){
    if(K.lassoPressed && A.cool<=0){ A.st=1; A.t=0; A.len=0; A.tgt=null; }
    K.lassoPressed=false; return;
  }
  K.lassoPressed=false;
  A.t+=dt;
  if(A.st===1){                                  // wind-up: loop spins overhead
    if(A.t>=LAS_WIND){ A.st=2; A.t=0; A.len=0; }
    return;
  }
  if(A.st===2){                                  // rope flying out
    A.len+=LAS_SPEED*dt;
    const tip=ropeTip();
    const pal=G.pals.find(a=>!a.used && !a.gone &&
        Math.abs(a.x-tip.x)<20 && Math.abs((a.y-22)-tip.y)<34);
    if(pal){ A.st=0; A.len=0; A.cool=LAS_COOL; palCatch(pal); G.shake=.16; return; }
    const hit=liveFoes().find(f=>Math.abs(f.x-tip.x)<16 && Math.abs((f.y-10)-tip.y)<34);
    if(hit){ A.st=3; A.t=0; A.tgt=hit; ropeCatch(hit); G.shake=.18; return; }
    if(A.len>=LAS_MAX){ A.st=4; A.t=0; }
    return;
  }
  if(A.st===3){                                  // reeling the catch in
    if(A.tgt){ A.tgt.x += ((P.x+P.w/2)-A.tgt.x)*Math.min(1,dt*7); }
    if(A.t>=LAS_REEL){ A.st=0; A.tgt=null; A.cool=LAS_COOL; }
    return;
  }
  if(A.st===4){                                  // missed: reel the rope back
    A.len-=LAS_SPEED*1.5*dt;
    if(A.len<=0){ A.st=0; A.len=0; A.cool=LAS_COOL; }
  }
}
function collide(axis,prevBottom){
  const ps=G.plats||G.lvl.plats;
  for(let i=0;i<ps.length;i++){
    const p={x:ps[i][0],y:ps[i][1],w:ps[i][2],h:ps[i][3]};
    // Thin ledges are one-way: you rise through them and land on top. Solid
    // ground (h=40) blocks from every side. Without this, a ledge hanging over
    // a pit lets you crack your head on its underside mid-jump, which kills all
    // upward momentum and drops you straight down the hole.
    const oneWay = p.h<=14;
    if(axis===0 && oneWay) continue;              // never block sideways
    if(!rectHit(pbox(),p)) continue;
    if(axis===0){ P.x = P.vx>0 ? p.x-P.w : p.x+p.w; P.vx=0; }
    else if(oneWay){
      if(P.vy<=0) continue;                       // rising: pass straight through
      if(prevBottom>p.y+2) continue;              // already level with or below it
      P.y=p.y-P.h; P.onGround=true; P.vy=0;
    }else{
      if(P.vy>0){ P.y=p.y-P.h; P.onGround=true; P.safeX=P.x; P.safeY=p.y-P.h-2; }
      else { P.y=p.y+p.h; }
      P.vy=0;
    }
  }
}
function hurt(fell){
  if(P.hurt>0 && !fell) return;
  if(P.ride && !fell){
    // The horse takes the hit and bolts. Costs you the mount, not a life.
    P.ride=null; P.hurt=1.2; P.vy=-220; G.shake=.3;
    toast("Horse","took that one for you and bolted.");
    return;
  }
  P.ride=null;
  G.lives--; el("hlife").textContent=Math.max(0,G.lives); G.shake=0.3; P.hurt=1.2;
  if(G.lives<=0){ G.mode="card";
    showCard("Winded","You get put down in the dirt","It happens. It is not a moral event, though they will try to bill it as one.\nYour health matters more than your beliefs. Rest is a legal move.",
      "Get up",()=>{G.lives=3;el("hlife").textContent=3;loadLevel(G.li);});
    return;
  }
  if(fell){
    // Falling used to nudge you back 46px — often still over the same pit, which
    // drained all three lives in one go. Put the player back on the last tile
    // they actually stood on instead.
    P.x=P.safeX; P.y=P.safeY;
  }else{
    // Deliberately NO horizontal knockback. Pushing the player back on a hit
    // could drop them straight into the pit they had just cleared, costing
    // every remaining life in about two seconds. A small hop plus the 1.2s of
    // invulnerability above is enough to break contact.
    P.y-=8;
  }
  P.vy=-190; P.vx=0;
}
/* --------------------------------------------------------------- boss ----- */
// Three rounds, one demon at a time. All three at once was unreadable noise —
// you could not tell what had hit you, and the fight taught you nothing.
const BOSS_ORDER=[
  {kind:"dbt",hp:2,x:1740,range:150,sp:54,line:"Name one thing you actually finished."},
  {kind:"ins",hp:2,x:1800,range:170,sp:46,line:"You do not belong up on this ridge."},
  {kind:"anx",hp:3,x:1780,range:190,sp:64,line:"What if it goes wrong. What if it already has."},
];
function spawnBoss(){
  const B=G.boss, d=BOSS_ORDER[B.stage];
  const f={kind:d.kind,x:d.x,y:d.kind==="anx"?196:210,dir:1,seed:B.stage+1,
           hp:d.hp,small:false,dead:0,home:d.x,range:d.range,sp:d.sp};
  B.cur=f; B.foes.push(f);
  toast(foeName(f)+" · round "+(B.stage+1)+" of 3", d.line);
}
function bossStep(dt){
  const B=G.boss;
  if(B.done) return;
  if(!B.started){ if(P.x>1480){ B.started=true; B.stage=0; spawnBoss(); } return; }
  if(B.gap>0){                                  // breather between rounds
    B.gap-=dt;
    if(B.gap<=0){
      B.stage++;
      if(B.stage>=BOSS_ORDER.length){ B.done=true;
        toast("Eight seconds","All three ride behind you now. Head for the flag."); }
      else spawnBoss();
    }
    return;
  }
  const f=B.cur; if(!f) return;
  if(f.stun>0){ f.stun-=dt; }          // staggered: no move, no contact damage
  else {
    f.x += f.dir*f.sp*dt;
    if(Math.abs(f.x-f.home)>f.range) f.dir*=-1;
  }
  if(f.kind==="anx") f.y=194+Math.sin(G.t*3.4+f.seed)*16;
  const fb={x:f.x-9,y:f.y-20,w:18,h:20};
  if(f.stun<=0 && rectHit(pbox(),fb)){
    const above=P.vy>60 && P.y+P.h<f.y-6;
    if(above && f.kind==="dbt"){ f.hp--; P.vy=-320; G.shake=.22; f.small=true;
      toast(foeName(f), f.hp<=0?"down. Next one.":"smaller. Not gone. Again."); }
    else if(above){ P.vy=-260; hurt(false); toast(foeName(f),"cannot be stomped. Use the rope."); }
    else hurt(false);
  }
  if(f.hp<=0 && B.cur===f){ B.cur=null; B.gap=0.9; }
}
function finishLevel(){
  G.goalHit=true; G.mode="card";
  const last = G.li>=LEVELS.length-1;
  if(last){
    const pct=Math.round(G.codes.length/CODES.length*100);
    showCard("Eight Seconds","Case GJ-17 · closed, pending revision",
      `They are still here. Smaller. Quieter. Riding behind you instead of in front.\nNobody kills Anxiety. Nobody retires Self-Doubt. You just get far enough ahead.\nCode of the West recovered: ${G.codes.length} of ${CODES.length} (${pct}%).`,
      "Ride again",()=>{G.lives=3;G.codes=[];el("hcode").textContent=0;el("hlife").textContent=3;loadLevel(0);},
      "The full case file",()=>{location.href="../digital/";});
  }else{
    showCard("Cleared","“"+G.lvl.name+"”",
      "That one is squared away. The road keeps going.",
      "Next",()=>loadLevel(G.li+1));
  }
}

  // deco

  // signs (posts)
  G.signs.forEach(s=>{ if(s.x<G.cam-40||s.x>G.cam+VW+40)return;

  // foes

  G.pals.forEach(a=>{ if(a.gone||a.x<G.cam-80||a.x>G.cam+VW+80)return; drawPal(a); });
  if(G.charge){ const c=G.charge; c.moving=true; drawBull(c); }
  drawDust();
  // moving platform bolts, so they read as machinery rather than scenery
  (G.movs||[]).forEach(m=>{ if(m.x+m.w<G.cam-40||m.x>G.cam+VW+40)return;
    setInk("#c4552a",1.8);
    ctx.beginPath(); ctx.arc(m.x+6,m.y+5,2,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x+m.w-6,m.y+5,2,0,7); ctx.stroke(); });
  G.foes.forEach(f=>{ if(f.dead){ctx.save();ctx.globalAlpha=Math.max(0,1-f.dead*2.4);
      ctx.translate(0,-f.dead*40);drawFoe(f);ctx.restore();} else drawFoe(f); });
  if(G.boss&&G.boss.started) G.boss.foes.forEach(f=>{ if(f.hp>0){
      if(f.stun>0 && Math.floor(G.t*14)%2){ /* blink while staggered */ } else drawFoe(f); }
    else { ctx.save(); ctx.globalAlpha=.4; f.small=true; drawFoe(f); ctx.restore(); } });
  // goal flag
  const gx=levelGoalX();
  if(gx>G.cam-40&&gx<G.cam+VW+40){

function drawLasso(){
  const A=P.la; if(A.st===0) return;
  const h=handPos();
  setInk("#8a6a2f",2.1);
  if(A.st===1){                                  // winding: loop spins overhead
    const cx=P.x+P.w/2+P.face*4, cy=P.y+P.h-40;
    L(h.x,h.y,cx,cy+3);
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(G.t*16);
    ctx.beginPath(); ctx.ellipse(0,0,9.5,3.6,0,0,7); ctx.stroke(); ctx.restore();
    return;
  }
  const tip = (A.st===3&&A.tgt) ? {x:A.tgt.x,y:A.tgt.y-10} : ropeTip();
  ctx.beginPath(); ctx.moveTo(h.x,h.y);
  ctx.quadraticCurveTo((h.x+tip.x)/2, Math.min(h.y,tip.y)-13, tip.x,tip.y);
  ctx.stroke();
  ctx.save(); ctx.translate(tip.x,tip.y); ctx.rotate(G.t*12);
  ctx.beginPath(); ctx.ellipse(0,0,8.2,3.4,0,0,7); ctx.stroke();
  ctx.restore();
}

/* ================================================================ flip-book */
/* The intro is a hand-flipped sketchbook: one drawing per page, held for a
   beat, then peeled over from the binding. Two deliberate choices make it read
   as paper rather than as computer animation:
     · everything inside a page moves on a 12 fps clock, not the 60 fps frame
     · each drawn frame gets up to half a unit of registration wobble, the way
       hand-inked cels never land in quite the same place twice
   Any key or any tap skips straight to the title card. */
const PW=300, PH=200, PGY=150;          // page box, and the ground line on it
const FLIP={on:false,i:0,t:0,turning:false};
const F_HOLD=3.5, F_TURN=0.46;

function fTxt(t,x,y,px,col,fam,al,it){
  ctx.fillStyle=col||"#241c14";
  ctx.font=(it?"italic ":"")+px+"px "+(fam||UIF);
  ctx.textAlign=al||"center"; ctx.fillText(t,x,y);
}
function beat(){ return Math.floor(G.t*12); }                 // the 12 fps clock
function fWob(k){ ctx.translate(((k*37)%3-1)*0.55, ((k*53)%3-1)*0.55); }
function fGround(x0,x1,y){
  setInk("#241c14",2.4); L(x0,y,x1,y);
  setInk("#b9a47c",1.4); for(let i=x0+10;i<x1;i+=18) L(i,y+3,i-4,y+10);
}

/* --- page chrome and the turn -------------------------------------------- */
function fPaper(n){
  ctx.fillStyle="#f2e8d2"; ctx.fillRect(0,0,PW,PH);
  ctx.fillStyle="rgba(120,100,70,.14)";                 // grain, fixed per page
  let s=(n+1)*7919;
  for(let i=0;i<80;i++){
    s=(s*9301+49297)%233280; const gx=(s/233280)*PW;
    s=(s*9301+49297)%233280; const gy=(s/233280)*PH;
    ctx.fillRect(gx,gy,1,1);
  }
  setInk("#241c14",2.6); ctx.strokeRect(1.5,1.5,PW-3,PH-3);
  setInk("#8a6a2f",1.8);                                // spiral binding
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(7,24+i*38,3.4,0,7); ctx.stroke(); }
}
function fDrawPage(i,u){
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,PW,PH); ctx.clip();
  fPaper(i);
  const pg=PAGES[i];
  ctx.save();
  if(!pg.raw){ const z=pg.z||1.7;
    ctx.translate(PW/2,130); ctx.scale(z,z); ctx.translate(-PW/2,-PGY); }
  pg.art(u);
  ctx.restore();
  const cap=pg.cap;
  if(cap){ const lines=cap.split("\n"), base=PH-22-(lines.length-1)*15.5;
    lines.forEach((ln,j)=>fTxt(ln,PW/2,base+j*15.5,14,"#3a2b1c",null,null,true)); }
  fTxt((i+1)+"/"+PAGES.length,PW-10,PH-6,9.5,"#9c8b6c",UIF,"right");
  ctx.restore();
}
function fRender(){
  ctx.setTransform(1,0,0,1,0,0);
  const W=cv.width, H=cv.height;
  ctx.fillStyle="#191309"; ctx.fillRect(0,0,W,H);
  const sc=Math.min(W/(PW+30), H/(PH+56));
  ctx.save();
  ctx.translate((W-PW*sc)/2,(H-PH*sc)/2-3*sc); ctx.scale(sc,sc);
  ctx.fillStyle="#c7b691";                              // the rest of the pad
  for(let i=3;i>=1;i--) ctx.fillRect(i*1.7,i*1.7,PW,PH);
  const i=FLIP.i;
  if(FLIP.turning){
    const tt=Math.min(1,FLIP.t/F_TURN), sx=Math.cos(tt*Math.PI);
    if(i+1<PAGES.length) fDrawPage(i+1,0);
    else { fPaper(i+1); }
    // Shadow cast by the lifted page: strongest at the binding, gone by the
    // point the page no longer covers. A flat dim over the whole page reads as
    // a screen fade, not as paper.
    const dark=(0.34*Math.sin(tt*Math.PI)).toFixed(3);
    const cov=Math.min(PW, Math.max(46, PW*Math.max(0,sx)+34));
    const gr=ctx.createLinearGradient(0,0,cov,0);
    gr.addColorStop(0,"rgba(30,20,8,"+dark+")"); gr.addColorStop(1,"rgba(30,20,8,0)");
    ctx.fillStyle=gr; ctx.fillRect(0,0,cov,PH);
    ctx.save(); ctx.transform(sx,0,0,1,0,0);
    if(sx>0) fDrawPage(i,1);
    else { fPaper(i); ctx.fillStyle="rgba(120,96,58,.16)"; ctx.fillRect(0,0,PW,PH); }
    setInk("rgba(60,45,25,.55)",1.6/Math.max(0.12,Math.abs(sx)));   // the fold edge
    L(PW,0,PW,PH);
    ctx.restore();
  }else{
    fDrawPage(i,Math.min(1,FLIP.t/F_HOLD));
  }
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="rgba(233,221,194,.5)"; ctx.textAlign="center";
  ctx.font=Math.max(11,Math.round(8*sc))+"px "+UIF;
  ctx.fillText(isTouch?"TAP TO SKIP":"PRESS ANY KEY TO SKIP", W/2, H-Math.round(9*sc));
}
function fStep(dt){
  FLIP.t+=dt;
  if(!FLIP.turning){ if(FLIP.t>=F_HOLD){ FLIP.turning=true; FLIP.t=0; } }
  else if(FLIP.t>=F_TURN){
    FLIP.turning=false; FLIP.t=0; FLIP.i++;
    if(FLIP.i>=PAGES.length) endFlip();
  }
}
function endFlip(){ if(!FLIP.on)return; FLIP.on=false; el("hud").style.display=""; title(); }
// Capture phase + stopPropagation, so the key that skips the intro cannot also
// reach the card handler below and start the game in the same press.
addEventListener("keydown",e=>{ if(FLIP.on){ e.preventDefault(); e.stopPropagation(); endFlip(); } },true);
addEventListener("pointerdown",e=>{ if(FLIP.on){ e.stopPropagation(); endFlip(); } },true);

/* ===================================================================== loop */
let last=0;
function frame(ts){
  if(!last)last=ts;
  let dt=(ts-last)/1000; last=ts; dt=Math.min(dt,1/30);
  G.t+=dt;
  // A throw inside step/render would otherwise stop rAF being re-scheduled and
  // freeze the whole game on a silent error. Never let one bad frame do that.
  try{
    if(FLIP.on){ fStep(dt); if(FLIP.on) fRender(); }
    else{
      if(G.mode==="play"){ step(dt); if(P.hurt>0)P.hurt-=dt; }
      if(G.lvl) render();
    }
  }catch(err){ if(window.console)console.error("frame error",err); }
  requestAnimationFrame(frame);
}

/* ===================================================================== boot */
function title(){
  G.lvl=LEVELS[0]; G.mode="card"; resize();
  showCard("The Bullrider's<br>Last Ride","A stick-figure western · Case GJ-17",
    "D! is a seventh-generation cowboy and the last one in his family. He left home at twelve.\nThree demons rode out with him. You cannot kill them — but you can get far enough ahead that they ride behind.",
    "Start",()=>loadLevel(0));
}
function startFlip(){
  G.lvl=LEVELS[0]; G.mode="card";      // a level must exist before any render()
  FLIP.on=true; FLIP.i=0; FLIP.t=0; FLIP.turning=false;
  el("hud").style.display="none";   // the book is the whole screen
  resize();
}
resize(); startFlip(); requestAnimationFrame(frame);
</script>
</body>
