// Glyph ramp used for luminance quantisation, dark -> bright.
AC.RAMP_ASCII = ' .\'`^",:;!~+_-?][}{)(|/\\tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
AC.RAMP_BLOCK = ' ·▫.:░-=+▒*#▓%@█';


/* ===== src/01_rng.js ================================================= */
// ---------------------------------------------------------------------------
// rng.js — the only source of randomness in the project.
//
// Constraint 1.4: Math.random() must never be called in generation or
// simulation. Every stochastic decision routes through a mulberry32 stream
// created from an explicit integer seed, so a given seed reproduces the world
// and the first N simulation steps bit-for-bit.
// ---------------------------------------------------------------------------

AC.Rng = class Rng {
  constructor(seed) {
    this.s = (seed >>> 0) || 1;
    this._seed0 = this.s;
  }

  /** Uniform [0,1). mulberry32. */
  next() {
    let t = (this.s += 0x6D2B79F5) >>> 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  /** Uniform in [a,b). */
  range(a, b) { return a + (b - a) * this.next(); }

  /** Integer in [a,b] inclusive. */
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }

  /** True with probability p. */
  chance(p) { return this.next() < p; }

  /** Uniform element of arr. */
  pick(arr) { return arr[Math.floor(this.next() * arr.length) % arr.length]; }

  /** In-place Fisher-Yates using this stream. */
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /** A derived, independent stream. Used so adding a generation pass does not
   *  shift the numbers consumed by unrelated passes. */
  fork(tag) {
    let h = 0x811C9DC5 >>> 0;
    const s = String(tag);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return new Rng((this._seed0 ^ h) >>> 0);
  }

  reset() { this.s = this._seed0; }
};

/** Stateless integer hash — for "random but stable" per-cell decisions that
 *  must not depend on iteration order (facade patterns, window lighting). */
AC.hash2 = function (x, y, salt) {
  let h = (Math.imul(x | 0, 0x27D4EB2D) ^ Math.imul(y | 0, 0x165667B1) ^ (salt | 0)) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 0x2545F491) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 0x27D4EB2D) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
};

/** hash2 mapped to [0,1). */
AC.hash2f = function (x, y, salt) { return AC.hash2(x, y, salt) / 4294967296; };

/** Wall-clock milliseconds. Presentation and input only — never the sim, which
 *  runs on the fixed dt so that it stays reproducible. */
AC.now = function () {
  return (typeof performance !== 'undefined' && performance.now)
    ? performance.now() : Date.now();
};

/** The cheat codes, in one place: Game runs them and the acceptance harness

AC.CHEATS = ['car', 'panzer'];


/* ===== src/02_glyph.js =============================================== */
// ---------------------------------------------------------------------------
// glyph.js — palette + procedural glyph atlas.
//
// Constraint 1.3: everything on screen is a text glyph. We rasterise the ASCII
// range once at start-up into a coverage mask, then synthesise opaque coloured
// tiles from that mask on demand. No image assets, no fonts fetched from the
// network — the browser's own monospace face is used.
//
// Palette layout: index = base*SHADES + shade, shade 0 darkest .. SHADES-1
// brightest. Keeping it index-based means the cell buffer is two Uint8Arrays,
// which is what makes the per-frame diff cheap.
// ---------------------------------------------------------------------------

AC.SHADES = 8;

// Base material colours at full brightness.
AC.PALETTE_BASE = [
  [0x0d, 0x14, 0x2b], // 0  sky deep
  [0x2a, 0x4a, 0x6e], // 1  haze
  [0x8a, 0x92, 0x9e], // 2  concrete cool
  [0x9c, 0x8e, 0x7c], // 3  concrete warm
  [0x4f, 0xd4, 0xe0], // 4  glass cyan
  [0xd0, 0x6c, 0xe8], // 5  glass magenta
  [0xff, 0x2f, 0xd0], // 6  neon magenta
  [0x1e, 0xf7, 0xff], // 7  neon cyan
  [0xff, 0xb3, 0x2b], // 8  neon amber
  [0x53, 0xff, 0x8a], // 9  neon green
  [0xff, 0x3b, 0x4d], // 10 neon red
  [0x3a, 0x3f, 0x4a], // 11 asphalt
  [0xe8, 0xd2, 0x5a], // 12 lane marking
  [0x6b, 0x74, 0x88], // 13 sidewalk
  [0xe0, 0x45, 0x45], // 14 car red
  [0x4d, 0x8b, 0xff], // 15 car blue
  [0xdf, 0xe6, 0xf0], // 16 car white
  [0x3f, 0xc4, 0x7a], // 17 car green
  [0xff, 0xf4, 0xc9], // 18 headlight
  [0xff, 0x24, 0x24], // 19 taillight
  [0xc8, 0xb8, 0xd8], // 20 pedestrian
  [0x35, 0x9c, 0x5e], // 21 foliage
  [0x6f, 0xf2, 0xe8], // 22 hud cyan
  [0xff, 0xc9, 0x5e], // 23 hud amber
  [0xff, 0xff, 0xff], // 24 specular white — the intro glint highlight
  [0x9e, 0x12, 0x20], // 25 blood
  [0xff, 0x8c, 0x22], // 26 fire
  // --- sky, sea and shore. The sky is four stops the renderer dithers between
  // rather than interpolating: the atlas caches an opaque tile per
  // (glyph, colour), so a palette whose RGB moved with the clock would throw
  // that cache away every frame.
  [0x10, 0x1b, 0x36], // 27 night zenith — nearly black, on purpose
  [0x5e, 0x9a, 0xd6], // 28 day sky, horizon
  [0x1c, 0x4e, 0xa8], // 29 day sky, zenith
  [0xff, 0x74, 0x2c], // 30 dusk, horizon
  [0x9a, 0x3f, 0x8e], // 31 dusk, upper
  [0xff, 0xe2, 0x8c], // 32 sun
  [0x17, 0x5c, 0x8c], // 33 deep water
  [0x3a, 0xb4, 0xbe], // 34 shallow water
  [0xe6, 0xf6, 0xfa], // 35 foam
  [0xdb, 0xc2, 0x8b], // 36 sand
  [0x96, 0x6c, 0x40], // 37 timber, for the pier and the coaster
  [0xc8, 0xcf, 0xd8], // 38 cloud
];

AC.PAL = {
  SKY: 0, HAZE: 1, CONCRETE: 2, CONCRETE_W: 3, GLASS_C: 4, GLASS_M: 5,
  NEON_M: 6, NEON_C: 7, NEON_A: 8, NEON_G: 9, NEON_R: 10, ASPHALT: 11,
  MARKING: 12, SIDEWALK: 13, CAR_R: 14, CAR_B: 15, CAR_W: 16, CAR_G: 17,
  HEADLIGHT: 18, TAILLIGHT: 19, PED: 20, FOLIAGE: 21, HUD_C: 22, HUD_A: 23,
  HOT: 24, BLOOD: 25, FIRE: 26,
  NIGHT_HI: 27, DAY_LO: 28, DAY_HI: 29, DUSK_LO: 30, DUSK_HI: 31, SUN: 32,
  WATER_D: 33, WATER_S: 34, FOAM: 35, SAND: 36, TIMBER: 37, CLOUD: 38,
};

/** Dither between two palette bases.
 *
 *  There is no interpolation available: colours are palette indices, and the
 *  glyph atlas caches an opaque tile per (glyph, colour). Moving the RGB with
 *  the clock would invalidate that cache every frame, so a blend is done by
 *  choosing one base or the other per cell against a hash — the eye does the
 *  mixing, which is exactly how this renderer already shades everything else. */
AC.mixBase = function (a, b, t, h) {
  if (t <= 0) return a;
  if (t >= 1) return b;
  return ((h >>> 8) & 1023) < t * 1024 ? b : a;
};

// Ordered 4x4 Bayer threshold. A hash-driven dither is white noise, and across
// a whole sky at full palette contrast that reads as television static rather
// than as a gradient. An ordered matrix gives a regular weave the eye resolves
// into a smooth blend at any distance.
AC.BAYER8 = (function () {
  // Recursive Bayer construction: M(2n) = [4M, 4M+2; 4M+3, 4M+1].
  let m = [[0, 2], [3, 1]];
  for (let n = 2; n < 8; n *= 2) {
    const o = [];
    for (let y = 0; y < n * 2; y++) o.push(new Array(n * 2));
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        const v = m[y][x] * 4;
        o[y][x] = v; o[y][x + n] = v + 2;
        o[y + n][x] = v + 3; o[y + n][x + n] = v + 1;
      }
    }
    m = o;
  }
  const f = new Float32Array(64);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) f[y * 8 + x] = (m[y][x] + 0.5) / 64;
  return f;
})();

/** Ordered dither between two palette bases at screen cell (x, y). */
AC.mixOrd = function (a, b, t, x, y) {
  if (t <= 0) return a;
  if (t >= 1) return b;
  // Ordered threshold, sheared per row and softened with a little per-cell
  // noise. Pure Bayer over a large luminance gap reads as corduroy — stripes
  // one way or the other depending on how the gradient runs. The noise term
  // keeps the even spacing that makes ordered dithering look smooth while
  // breaking up the regularity that makes it look like a pattern.
  const th = AC.BAYER8[((y & 7) << 3) | ((x + y * 3) & 7)] * 0.78
    + AC.hash2f(x, y, 0x51D3) * 0.22;
  return t > th ? b : a;
};

/** Palette index from base id + shade 0..SHADES-1 (clamped). */
AC.pal = function (base, shade) {
  const s = shade < 0 ? 0 : (shade > AC.SHADES - 1 ? AC.SHADES - 1 : shade | 0);
  return base * AC.SHADES + s;
};

/** Palette index from base id + continuous brightness 0..1. */
AC.palf = function (base, t) {
  let s = (t * AC.SHADES) | 0;
  if (s < 0) s = 0; else if (s > AC.SHADES - 1) s = AC.SHADES - 1;
  return base * AC.SHADES + s;
};

AC.GlyphAtlas = class GlyphAtlas {
  constructor(cfg) {
    this.cellW = cfg.cellW;
    this.cellH = cfg.cellH;

    // --- glyph table -------------------------------------------------------
    let chars = '';
    for (let c = 32; c <= 126; c++) chars += String.fromCharCode(c);
    this.asciiCount = chars.length;                 // 95
    if (cfg.useExtendedGlyphs) chars += cfg.extendedGlyphs;
    this.chars = chars;
    this.count = chars.length;

    // charCode -> glyph index, for fast string -> cell writes
    this.indexOf = new Int16Array(65536).fill(-1);
    for (let i = 0; i < chars.length; i++) this.indexOf[chars.charCodeAt(i)] = i;

    // --- luminance ramps ---------------------------------------------------
    this.rampAscii = AC.RAMP_ASCII.split('').map((c) => this.indexOf[c.charCodeAt(0)]);
    const blockSrc = cfg.useExtendedGlyphs ? AC.RAMP_BLOCK : AC.RAMP_ASCII;
    this.rampBlock = blockSrc.split('')
      .map((c) => this.indexOf[c.charCodeAt(0)])
      .filter((i) => i >= 0);

    this._buildMask(cfg);
    this._buildPaletteRgb();

    // Lazily synthesised opaque tiles: key = glyph*4096 + colour.
    this.tiles = new Map();
  }

  /** Rasterise every glyph once, white on black, and keep the coverage. */
  _buildMask(cfg) {
    const w = this.cellW * this.count;
    const h = this.cellH;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#000';
    g.fillRect(0, 0, w, h);
    g.font = cfg.fontPx + 'px ' + cfg.fontFamily;
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#fff';
    // Baseline placement: a hair below centre reads best for a 8x14 cell.
    const baseline = Math.round(this.cellH * 0.76);
    for (let i = 0; i < this.count; i++) {
      g.fillText(this.chars[i], i * this.cellW + this.cellW / 2, baseline);
    }
    const px = g.getImageData(0, 0, w, h).data;
    const cov = new Uint8Array(this.count * this.cellW * this.cellH);
    for (let i = 0; i < this.count; i++) {
      const ox = i * this.cellW;
      for (let y = 0; y < this.cellH; y++) {
        for (let x = 0; x < this.cellW; x++) {
          // Green channel is a fine proxy for coverage on a white-on-black draw.
          cov[(i * this.cellH + y) * this.cellW + x] = px[((y * w) + ox + x) * 4 + 1];
        }
      }
    }
    this.cov = cov;
    this.maskCanvas = cv;
  }

  /** Expand PALETTE_BASE into SHADES steps and pre-pack ABGR words. */
  _buildPaletteRgb() {
    const n = AC.PALETTE_BASE.length * AC.SHADES;
    this.palR = new Uint8Array(n);
    this.palG = new Uint8Array(n);
    this.palB = new Uint8Array(n);
    this.palCss = new Array(n);
    for (let b = 0; b < AC.PALETTE_BASE.length; b++) {
      const [r, g, bl] = AC.PALETTE_BASE[b];
      for (let s = 0; s < AC.SHADES; s++) {
        // Perceptual curve with a lifted floor. A pure power curve crushes the
        // low shades to near-black on an unlit street, which is exactly where
        // most of the frame lives; the 0.17 pedestal keeps distant geometry
        // readable without washing out the neon at the top end.
        const t = 0.17 + 0.83 * Math.pow((s + 1) / AC.SHADES, 1.22);
        const i = b * AC.SHADES + s;
        this.palR[i] = Math.round(r * t);
        this.palG[i] = Math.round(g * t);
        this.palB[i] = Math.round(bl * t);
        this.palCss[i] = 'rgb(' + this.palR[i] + ',' + this.palG[i] + ',' + this.palB[i] + ')';
      }
    }
    this.paletteCount = n;
  }

  setBackground(css) {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(css.trim());
    this.bgR = m ? parseInt(m[1], 16) : 0;
    this.bgG = m ? parseInt(m[2], 16) : 0;
    this.bgB = m ? parseInt(m[3], 16) : 0;
    this.tiles.clear();
  }

  /** Opaque cellW*cellH ABGR tile for (glyph, colour), built on first use. */
  tile(glyph, colour) {
    const key = glyph * 4096 + colour;
    let t = this.tiles.get(key);
    if (t !== undefined) return t;
    const w = this.cellW, h = this.cellH;
    t = new Uint32Array(w * h);
    const cov = this.cov;
    const off = glyph * w * h;
    const r = this.palR[colour], g = this.palG[colour], b = this.palB[colour];
    const br = this.bgR, bg = this.bgG, bb = this.bgB;
    for (let i = 0; i < w * h; i++) {
      const a = cov[off + i];
      if (a === 0) {
        t[i] = (255 << 24) | (bb << 16) | (bg << 8) | br;
      } else if (a === 255) {
        t[i] = (255 << 24) | (b << 16) | (g << 8) | r;
      } else {
        const ia = 255 - a;
        const rr = (r * a + br * ia) / 255;
        const gg = (g * a + bg * ia) / 255;
        const bbv = (b * a + bb * ia) / 255;
        t[i] = (255 << 24) | ((bbv | 0) << 16) | ((gg | 0) << 8) | (rr | 0);
      }
    }
    this.tiles.set(key, t);
    return t;
  }

  /** Glyph index for a luminance 0..1 on the ASCII ramp. */
  rampAt(t) {
    const r = this.rampAscii;
    let i = (t * r.length) | 0;
    if (i < 0) i = 0; else if (i >= r.length) i = r.length - 1;
    return r[i];
  }

  /** Glyph index for a luminance 0..1 on the block ramp (solid surfaces). */
  rampBlockAt(t) {
    const r = this.rampBlock;
    let i = (t * r.length) | 0;
    if (i < 0) i = 0; else if (i >= r.length) i = r.length - 1;
    return r[i];
  }
};


/* ===== src/03_raster.js ============================================== */
// ---------------------------------------------------------------------------
// raster.js — the glyph cell buffer and its presentation to the canvas.
//
// The renderer never touches the canvas directly; it writes (glyph, colour)
// pairs into a glyph byte and a 16-bit colour. present() diffs against the
// previous frame, blits only the cells that changed, then uploads one dirty
// rectangle.
//
// This is the whole "presentation" half of the sim/presentation split: nothing
// below this line knows what a building is.
// ---------------------------------------------------------------------------

AC.Screen = class Screen {
  constructor(canvas, atlas, cfg) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.atlas = atlas;
    this.cfg = cfg;
    this.cols = 0; this.rows = 0;
    this.resize(cfg.cols, cfg.rows);
  }

  resize(cols, rows) {
    if (cols === this.cols && rows === this.rows) return;
    this.cols = cols; this.rows = rows;
    const n = cols * rows;
    this.ch = new Uint8Array(n);
    // Colour is 16-bit: index = base*SHADES + shade, and the palette outgrew
    // 256 entries when the island, the water and the sky-at-four-times-of-day
    // arrived. The glyph buffer is still a byte, which is what the per-frame
    // diff mostly touches.
    this.co = new Uint16Array(n);
    this.pch = new Uint8Array(n).fill(255);
    this.pco = new Uint16Array(n).fill(65535);

    const cw = this.atlas.cellW, chh = this.atlas.cellH;
    this.pxW = cols * cw;
    this.pxH = rows * chh;
    this.canvas.width = this.pxW;
    this.canvas.height = this.pxH;
    this.imgData = this.ctx.createImageData(this.pxW, this.pxH);
    this.px = new Uint32Array(this.imgData.data.buffer);
    // Force a full repaint on the next present().
    this.px.fill((255 << 24) | (this.atlas.bgB << 16) | (this.atlas.bgG << 8) | this.atlas.bgR);
    this.firstPresent = true;
    this.ctx.imageSmoothingEnabled = false;
  }

  /** Reset the whole buffer to one glyph/colour. Cheaper than per-cell writes. */
  clear(glyph, colour) {
    this.ch.fill(glyph);
    this.co.fill(colour);
  }

  set(x, y, glyph, colour) {
    if (x < 0 || y < 0 || x >= this.cols || y >= this.rows) return;
    const i = y * this.cols + x;
    this.ch[i] = glyph;
    this.co[i] = colour;
  }

  /** Write a string left-to-right. Characters outside the atlas are skipped. */
  text(x, y, str, colour) {
    if (y < 0 || y >= this.rows) return;
    const idx = this.atlas.indexOf;
    let px = x;
    for (let k = 0; k < str.length; k++, px++) {
      if (px < 0 || px >= this.cols) continue;
      const g = idx[str.charCodeAt(k)];
      if (g < 0) continue;
      const i = y * this.cols + px;
      this.ch[i] = g;
      this.co[i] = colour;
    }
  }

  /** Diff, blit changed cells, upload one dirty rect. Returns cells redrawn. */
  present() {
    if (this.cfg.renderer === 'text') return this._presentText();

    const { ch, co, pch, pco, px, cols, rows } = this;
    const atlas = this.atlas;
    const cw = atlas.cellW, chh = atlas.cellH;
    const pitch = this.pxW;
    const full = this.firstPresent;

    let minX = cols, minY = rows, maxX = -1, maxY = -1, drawn = 0;

    for (let cy = 0; cy < rows; cy++) {
      const rowOff = cy * cols;
      const yPix = cy * chh;
      for (let cx = 0; cx < cols; cx++) {
        const i = rowOff + cx;
        const g = ch[i], c = co[i];
        if (!full && g === pch[i] && c === pco[i]) continue;
        pch[i] = g; pco[i] = c;

        const tile = atlas.tile(g, c);
        let di = yPix * pitch + cx * cw;
        let si = 0;
        if (cw === 8) {
          for (let ry = 0; ry < chh; ry++, di += pitch) {
            px[di    ] = tile[si    ]; px[di + 1] = tile[si + 1];
            px[di + 2] = tile[si + 2]; px[di + 3] = tile[si + 3];
            px[di + 4] = tile[si + 4]; px[di + 5] = tile[si + 5];
            px[di + 6] = tile[si + 6]; px[di + 7] = tile[si + 7];
            si += 8;
          }
        } else {
          for (let ry = 0; ry < chh; ry++, di += pitch) {
            for (let rx = 0; rx < cw; rx++) px[di + rx] = tile[si + rx];
            si += cw;
          }
        }

        drawn++;
        if (cx < minX) minX = cx;
        if (cx > maxX) maxX = cx;
        if (cy < minY) minY = cy;
        if (cy > maxY) maxY = cy;
      }
    }

    if (maxX >= 0) {
      this.ctx.putImageData(
        this.imgData,
        0, 0,
        minX * cw, minY * chh,
        (maxX - minX + 1) * cw, (maxY - minY + 1) * chh
      );
    }
    this.firstPresent = false;
    return drawn;
  }

  /** Reference presentation path (CONFIG.renderer === 'text'). Batches each
   *  row into runs of one colour and draws them with fillText. Kept for
   *  comparison against the atlas blitter; not the default. */
  _presentText() {
    const { ch, co, cols, rows } = this;
    const atlas = this.atlas, g2 = this.ctx;
    const cw = atlas.cellW, chh = atlas.cellH;
    g2.fillStyle = this.cfg.background;
    g2.fillRect(0, 0, this.pxW, this.pxH);
    g2.font = this.cfg.fontPx + 'px ' + this.cfg.fontFamily;
    g2.textAlign = 'left';
    g2.textBaseline = 'alphabetic';
    const baseline = Math.round(chh * 0.76);
    let drawn = 0;
    for (let cy = 0; cy < rows; cy++) {
      const rowOff = cy * cols;
      let runStart = 0, runColour = co[rowOff], run = '';
      for (let cx = 0; cx <= cols; cx++) {
        const c = cx < cols ? co[rowOff + cx] : -1;
        if (c !== runColour || cx === cols) {
          if (run.trim().length) {
            g2.fillStyle = atlas.palCss[runColour];
            g2.fillText(run, runStart * cw, cy * chh + baseline);
            drawn += run.length;
          }
          runStart = cx; runColour = c; run = '';
        }
        if (cx < cols) run += atlas.chars[ch[rowOff + cx]];
      }
    }
    this.firstPresent = true; // atlas path must repaint fully if we switch back
    return drawn;
  }
};


/* ===== src/04_world.js =============================================== */
// ---------------------------------------------------------------------------
// world.js — seeded procedural city.
//
// The city is a uniform grid. One grid cell == one world unit == 3.2 m.
// A cell is either open ground (road / sidewalk / plaza) or solid, and a solid
// cell carries a height in world units. That is deliberately the *only* thing
// the raycaster needs to know, which is what keeps the inner loop tight.
//
// Layout, per axis, with blockPitch P and roadWidth W (P=13, W=3):
//   r = coord % P
//   r <  W        -> carriageway
//   r == W        -> sidewalk (near edge)
//   r == P-1      -> sidewalk (far edge)
//   otherwise     -> block interior, buildable
// A cell is road if EITHER axis is in a carriageway, which makes intersections
// fall out for free.
// ---------------------------------------------------------------------------

AC.KIND = { ROAD: 0, SIDEWALK: 1, BUILDING: 2, PLAZA: 3, PARK: 4,
            RUNWAY: 5, APRON: 6, HELIPAD: 7, SAND: 8, WATER: 9, PIER: 10,
            BRIDGE: 11, FIELD: 12 };
AC.KIND_COUNT = 13;

/** Anything a car can be on. The river split the road graph in two, and the
 *  only thing that puts it back together is a bridge deck — so "is this
 *  drivable" stopped being "is this ROAD" the moment the water arrived. */
AC.isDriveable = function (k) { return k === AC.KIND.ROAD || k === AC.KIND.BRIDGE; };
AC.MAT = { CONCRETE: 0, CONCRETE_W: 1, GLASS_C: 2, GLASS_M: 3, DARK: 4, FOLIAGE: 5 };

AC.SIGN_WORDS = [
  'NOODLE', 'RAMEN', 'CYBER', 'NEON', 'HOTEL', 'PAWN', 'ARCADE', 'SUSHI',
  'CHROME', 'VOLT', 'DATA', 'LOTUS', 'ORBIT', 'GHOST', 'KIOSK', 'AMMO',
  'CLINIC', 'CREDIT', 'RENT', 'BAR', 'DRINK', 'SYNTH', 'TOKYO', 'HAVEN',
  'MOTEL', 'CASH', 'DRONE', 'FUEL', 'NIGHT', 'RELAY', 'VAULT', 'OPEN',
];

/** Avenue names, for turn-by-turn directions. */
AC.AVENUES = [
  'PALM', 'HARBOR', 'LEXING', 'MERIDIAN', 'ORCHID', 'CEDAR', 'VECTOR', 'MARINA',
  'SOLSTICE', 'IRON', 'AMBER', 'KESTREL', 'LANTERN', 'MIRAGE', 'OBSIDIAN', 'QUAY',
];

AC.World = class World {
  constructor(cfg, rng) {
    this.cfg = cfg;
    this.size = cfg.mapSize;
    this.P = cfg.blockPitch;
    this.W = cfg.roadWidth;

    const n = this.size * this.size;
    this.kind = new Uint8Array(n);
    this.solid = new Uint8Array(n);
    this.h = new Float32Array(n);
    this.mat = new Uint8Array(n);
    this.accent = new Uint8Array(n).fill(255); // neon accent base, 255 = none
    // Lot id groups the cells of one building so the renderer can derive
    // facade parameters (window grid, lit ratio, ledges) per BUILDING rather
    // than per cell — without that, every cell rolls its own pattern and a
    // long wall reads as tiled wallpaper.
    this.lot = new Uint16Array(n);
    this.lotCount = 0;

    // Gameplay decals, painted at runtime and deliberately NOT part of
    // World.hash(): they are a consequence of player input, not of generation,
    // and folding them in would break the seed-reproducibility guarantee.
    this.blood = new Uint8Array(n);
    this.scorch = new Uint8Array(n);

    // Ground elevation. Zero almost everywhere — this is a city on a plain —
    // but a bridge deck is not at the same height as the river it crosses, and
    // nothing else in the engine could express that. `h` is how tall a BUILDING
    // is; `gz` is how high the SURFACE you stand on is.
    this.gz = new Float32Array(n);

    // Arterial flag. Only used by the map: at the scale the city map is drawn
    // at, one map cell is wider than a block, so drawing every side street
    // fills the island with tarmac. Real maps draw the arterials and let the
    // side streets go, and this is the layer that says which is which.
    this.major = new Uint8Array(n);

    this.blocksPerSide = Math.floor(this.size / this.P);

    // Corridor nodes the traffic AI must never route into. Only the airport
    // sets these, but keeping it general means anything that carves a hole in
    // the road grid can reuse it.
    const B = Math.floor(this.size / this.P);
    this.blockedNodes = new Uint8Array(B * B);

    this._layout(rng.fork('streets'));
    this._blocks(rng.fork('blocks'));
    this._avenues(rng.fork('avenues'));
    this._airport(rng.fork('airport'));
    this._island();
    this._river(rng.fork('river'));
    this._districts(rng.fork('districts'));
    this._pier(rng.fork('pier'));
    this._blockNodes();
    this._clinics();
  }

  idx(x, y) { return y * this.size + x; }

  /** Is there any raised ground within sight of here?
   *
   *  The height field is zero across almost the whole map, and the ray-ground
   *  solve is only worth running where it is not. Answered from the bridge
   *  list rather than by scanning cells. */
  reliefNear(x, y) {
    const R = this.cfg.maxDepth + this.cfg.bridgeRamp;
    for (const b of (this.bridges || [])) {
      if (Math.abs(y - b.y) < R && x > b.r0 - R && x < b.r1 + R) return true;
    }
    return false;
  }

  /** Height of the ground at a world position, bilinear so a ramp is a slope
   *  rather than a staircase. */
  groundAt(x, y) {
    const S = this.size;
    const fx = x - 0.5, fy = y - 0.5;
    let x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = fx - x0, ty = fy - y0;
    if (x0 < 0) x0 = 0; else if (x0 > S - 2) x0 = S - 2;
    if (y0 < 0) y0 = 0; else if (y0 > S - 2) y0 = S - 2;
    const g = this.gz;
    const i = y0 * S + x0;
    const a = g[i], b = g[i + 1], c = g[i + S], d = g[i + S + 1];
    return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
  }
  inBounds(x, y) { return x >= 0 && y >= 0 && x < this.size && y < this.size; }

  isSolidAt(x, y) {
    // Outside the grid is open ocean. It used to read as wall, which is what
    // the four black slabs around the city were: not scenery, just the edge of
    // the array with a height on it.
    if (!this.inBounds(x, y)) return false;
    return this.solid[y * this.size + x] === 1;
  }

  /** Water at a world cell, including everything off the edge of the grid. */
  isWaterAt(x, y) {
    if (!this.inBounds(x, y)) return true;
    return this.kind[y * this.size + x] === AC.KIND.WATER;
  }

  heightAt(x, y) {
    if (!this.inBounds(x, y)) return 40;
    return this.h[y * this.size + x];
  }

  // --- axis classification --------------------------------------------------
  //
  // Corridor CENTRELINES stay on the regular lattice — every piece of traffic
  // AI, routing and signal timing is indexed by (kx, ky) and derives positions
  // from corridorCentre, so moving the centres would mean rewriting all of it.
  // What varies is each corridor's WIDTH: a two-lane street, a wide avenue, the
  // occasional boulevard. Because the extra width is taken symmetrically about
  // an unchanged centreline, the lane geometry is untouched while the blocks
  // between the streets come out visibly different sizes — which is what makes
  // a grid stop reading as graph paper.
  axisRoadX(c) { return c >= 0 && c < this.size && this.colT[c] === 1; }
  axisRoadY(c) { return c >= 0 && c < this.size && this.rowT[c] === 1; }
  /** Legacy symmetric query, kept for the road-marking pass. */
  axisRoad(c) { return this.axisRoadX(c); }

  /** Centre coordinate of road corridor k on either axis. */
  corridorCentre(k) { return k * this.P + (this.W - 1) / 2 + 0.5; }

  /** Name of a road corridor, for turn-by-turn directions.
   *
   *  Manhattan's convention, because it is the one everybody can read without
   *  being told: the corridors running north-south are named avenues, the ones
   *  running east-west are numbered streets. Pure function of the index, so it
   *  costs nothing to store and never has to be kept in sync with anything. */
  streetName(k, ax) {
    if (ax === 1) {
      const n = k + 1;
      const t = n % 100;
      const suf = (t >= 11 && t <= 13) ? 'TH'
        : ['TH', 'ST', 'ND', 'RD', 'TH', 'TH', 'TH', 'TH', 'TH', 'TH'][n % 10];
      return n + suf + ' ST';
    }
    const w = AC.AVENUES[AC.hash2(k, 0x2F13, 0x77A5) % AC.AVENUES.length];
    return w + ' AVE';
  }

  /** Interior (buildable) extent of block b on either axis, inclusive. */
  blockLo(b, ax) { return (ax ? this.roadEY : this.roadEX)[b] + 2; }
  blockHi(b, ax) { return (ax ? this.roadSY : this.roadSX)[b + 1] - 2; }
  /** Centres of the sidewalk cells ringing block b on either axis. */
  sideLo(b, ax) { return (ax ? this.roadEY : this.roadEX)[b] + 1.5; }
  sideHi(b, ax) { return (ax ? this.roadSY : this.roadSX)[b + 1] - 0.5; }

  /** Road cell extents for one axis, plus the classification table. */
  _axis(rng) {
    const S = this.size, P = this.P, W = this.W;
    const n = Math.floor(S / P) + 2;
    const t = new Uint8Array(S);
    const s = new Int32Array(n), e = new Int32Array(n);
    const big = new Uint8Array(n);
    for (let k = 0; k < n; k++) {
      // Width keeps W's parity so the centreline lands where it always did.
      const r = rng.next();
      const wid = r < 0.03 ? W + 4 : (r < 0.10 ? W + 2 : W);
      const c = k * P + (W - 1) / 2 + 0.5;
      const a = Math.round(c - wid / 2), b = a + wid - 1;
      s[k] = a; e[k] = b;
      for (let x = a; x <= b; x++) if (x >= 0 && x < S) t[x] = 1;
      if (wid > W) big[k] = 1;
    }
    for (let k = 0; k < n; k++) {
      const a = s[k] - 1, b = e[k] + 1;
      if (a >= 0 && a < S && t[a] !== 1) t[a] = 2;
      if (b >= 0 && b < S && t[b] !== 1) t[b] = 2;
    }
    return { t, s, e, big };
  }

  _layout(rng) {
    const S = this.size, K = AC.KIND;
    // Separate draws per axis: a city whose avenues run in matching pairs both
    // ways still looks laid out by a machine.
    const X = this._axis(rng.fork('x')), Y = this._axis(rng.fork('y'));
    this.colT = X.t; this.roadSX = X.s; this.roadEX = X.e;
    this.rowT = Y.t; this.roadSY = Y.s; this.roadEY = Y.e;
    // Which corridors are arterials, by index. The map draws these as lines
    // rather than by sampling cells: at map scale an avenue is a fraction of
    // one map cell wide, and area-sampling smears it across three.
    this.arterialX = []; this.arterialY = [];
    for (let k = 0; k < X.big.length; k++) if (X.big[k]) this.arterialX.push(k);
    for (let k = 0; k < Y.big.length; k++) if (Y.big[k]) this.arterialY.push(k);
    // Column / row is arterial if its corridor came out wider than standard.
    const majX = new Uint8Array(S), majY = new Uint8Array(S);
    for (let k = 0; k < X.big.length; k++) {
      if (X.big[k]) for (let x = X.s[k]; x <= X.e[k]; x++) if (x >= 0 && x < S) majX[x] = 1;
    }
    for (let k = 0; k < Y.big.length; k++) {
      if (Y.big[k]) for (let y = Y.s[k]; y <= Y.e[k]; y++) if (y >= 0 && y < S) majY[y] = 1;
    }
    for (let y = 0; y < S; y++) {
      const ty = this.rowT[y];
      for (let x = 0; x < S; x++) {
        const tx = this.colT[x];
        let k;
        if (tx === 1 || ty === 1) k = K.ROAD;
        else if (tx === 2 || ty === 2) k = K.SIDEWALK;
        else k = K.BUILDING;          // provisional: block interior
        this.kind[y * S + x] = k;
        if (k === K.ROAD && ((majX[x] && tx === 1) || (majY[y] && ty === 1))) {
          this.major[y * S + x] = 1;
        }
      }
    }
  }

  /** Diagonal boulevards, cut through the finished grid.
   *
   *  Every real city has one or two streets that ignore the grid — they were
   *  a road to somewhere before the grid existed. They are what turns square
   *  blocks into wedges and triangles, and they cost nothing in the traffic
   *  model because a diagonal is road surface the player can drive, not a new
   *  kind of node for the AI to reason about. */
  _avenues(rng) {
    const S = this.size, K = AC.KIND;
    const c = (S - 1) / 2;
    const count = 2;
    this.avenues = [];
    for (let a = 0; a < count; a++) {
      // Anchored near the middle so both halves of the island get one, at an
      // angle well away from the grid's own axes.
      const th = rng.range(0.55, 1.05) * (a % 2 ? -1 : 1) + (a * 1.9);
      const px = c + rng.range(-0.22, 0.22) * S;
      const py = c + rng.range(-0.22, 0.22) * S;
      const dx = Math.cos(th), dy = Math.sin(th);
      const half = 2.5, walk = half + 1.2;
      const L = S * 0.9;
      this.avenues.push({ x: px, y: py, dx, dy, half });
      for (let t = -L; t <= L; t += 0.5) {
        const bx = px + dx * t, by = py + dy * t;
        for (let o = -walk; o <= walk; o += 0.5) {
          const x = Math.round(bx - dy * o), y = Math.round(by + dx * o);
          if (x < 1 || y < 1 || x >= S - 1 || y >= S - 1) continue;
          const i = y * S + x;
          if (this.kind[i] === K.PARK || this.kind[i] === K.PLAZA) continue;
          const road = Math.abs(o) <= half;
          this.kind[i] = road ? K.ROAD : K.SIDEWALK;
          if (road) this.major[i] = 1;          // a boulevard is always arterial
          this.solid[i] = 0;
          this.h[i] = 0;
          this.lot[i] = 0;
          this.accent[i] = 255;
        }
      }
    }
  }

  // -------------------------------------------------------------------------
  // the river
  // -------------------------------------------------------------------------

  /** Where the channel's centre line is at a given northing. A pair of
   *  incommensurate sines, so the river wanders without repeating. */
  riverX(y) {
    const c = (this.size - 1) / 2, cfg = this.cfg;
    const A = cfg.riverMeander;
    return c
      + Math.sin(y * (Math.PI * 2 / (this.size * 0.78)) + 0.6) * A
      + Math.sin(y * (Math.PI * 2 / (this.size * 0.29)) - 1.7) * A * 0.42;
  }

  /** Distance from the channel's centre line, in cells. */
  riverDist(x, y) { return Math.abs(x - this.riverX(y)); }

  isRiverAt(x, y) {
    return this.riverDist(x, y) < this.cfg.riverWidth
      && this.shoreDist(x, y) < this.shoreAt(x, y);
  }

  /** Cut the river, then throw bridges across it.
   *
   *  Ordered that way on purpose: the channel is carved first and the decks are
   *  laid over the finished water, so a bridge is always a bridge over a river
   *  rather than a strip the river forgot to erode. */
  _river() {
    const S = this.size, K = AC.KIND, cfg = this.cfg;
    const half = cfg.riverWidth, bank = cfg.riverBank;
    for (let y = 0; y < S; y++) {
      const rx = this.riverX(y);
      const x0 = Math.max(0, Math.floor(rx - half - bank));
      const x1 = Math.min(S - 1, Math.ceil(rx + half + bank));
      for (let x = x0; x <= x1; x++) {
        // Leave the sea alone: out past the shoreline the river simply is
        // the sea, and re-carving it would erase the beach at the mouth.
        if (this.shoreDist(x, y) >= this.shoreAt(x, y) - cfg.beachWidth) continue;
        // And never through the airport: a river across a runway is not a
        // feature, and the two are placed independently.
        const A = this.airport;
        if (A && x >= A.x0 - 4 && x <= A.x1 + 4 && y >= A.y0 - 4 && y <= A.y1 + 4) continue;
        const d = Math.abs(x - rx);
        const j = y * S + x;
        this.solid[j] = 0; this.h[j] = 0; this.lot[j] = 0;
        this.accent[j] = 255; this.mat[j] = AC.MAT.CONCRETE;
        this.kind[j] = d < half ? K.WATER : K.SAND;
      }
    }
    this._bridges();
  }

  _bridges() {
    const S = this.size, K = AC.KIND, cfg = this.cfg;
    const B = this.blocksPerSide;
    this.bridges = [];
    // Spread the crossings over the island's north-south extent, then snap each
    // to the nearest east-west corridor: a bridge that does not line up with a
    // road is a bridge to nowhere.
    const c = (S - 1) / 2, span = this.cfg.islandRadius * 1.5;
    for (let i = 0; i < cfg.bridgeCount; i++) {
      const want = c - span / 2 + (span * (i + 0.5)) / cfg.bridgeCount;
      const ky = Math.max(1, Math.min(B - 2, Math.round((want - (this.W - 1) / 2 - 0.5) / this.P)));
      const cy = this.corridorCentre(ky);
      if (this.shoreDist(this.riverX(cy), cy) >= this.shoreAt(this.riverX(cy), cy) - 2) continue;
      const hw = cfg.bridgeWidth;
      const y0 = Math.max(0, Math.round(cy - hw / 2));
      const y1 = Math.min(S - 1, Math.round(cy + hw / 2));
      const rx = this.riverX(cy);
      const reach = cfg.riverWidth + cfg.riverBank + 4;
      const ramp = cfg.bridgeRamp;
      const x0 = Math.max(0, Math.floor(rx - reach));
      const x1 = Math.min(S - 1, Math.ceil(rx + reach));
      const r0 = Math.max(0, x0 - ramp), r1 = Math.min(S - 1, x1 + ramp);
      const H = cfg.bridgeHeight;

      for (let y = y0; y <= y1; y++) {
        for (let x = r0; x <= r1; x++) {
          const j = y * S + x;
          // Ramps run over ordinary road; the span itself only replaces water,
          // sand and whatever the river left behind.
          const onSpan = x >= x0 && x <= x1;
          if (onSpan && this.kind[j] !== K.WATER && this.kind[j] !== K.SAND) continue;
          if (!onSpan && !AC.isDriveable(this.kind[j])) continue;
          // Smoothstep up the approach, flat across the water, back down.
          let u = 1;
          if (x < x0) u = (x - r0) / Math.max(1, ramp);
          else if (x > x1) u = (r1 - x) / Math.max(1, ramp);
          u = Math.max(0, Math.min(1, u));
          this.solid[j] = 0; this.h[j] = 0;
          this.gz[j] = H * (u * u * (3 - 2 * u));
          this.kind[j] = K.BRIDGE;
          this.mat[j] = AC.MAT.CONCRETE;
        }
      }
      // Parapets: the outer row on each side is solid all the way up from the
      // water, which is both the railing you drive between and, seen from the
      // bank, the side elevation of the bridge. It stops just below eye height
      // so you can still see the river from the deck.
      for (const y of [y0, y1]) {
        for (let x = x0; x <= x1; x++) {
          const j = y * S + x;
          if (this.kind[j] !== K.BRIDGE) continue;
          this.solid[j] = 1;
          this.h[j] = H + cfg.bridgeParapet;
          this.mat[j] = AC.MAT.CONCRETE;
          this.kind[j] = K.BUILDING;
          this.lot[j] = 4;
        }
      }
      this.bridges.push({ y: cy, ky, x0, x1, r0, r1, x: rx, h: H });
    }
  }

  // -------------------------------------------------------------------------
  // districts
  // -------------------------------------------------------------------------

  /** Named places worth going to.
   *
   *  Each one takes over a rectangle of the block grid and gets a fill routine.
   *  They are recorded on `world.districts` so the map can label them and the
   *  navigation can snap a pin to one — a landmark you cannot find on the map
   *  is just a differently textured suburb. */
  _districts(rng) {
    const B = this.blocksPerSide, S = this.size;
    this.districts = [];
    const c = (B - 1) / 2;

    // Angle round the centre, radius in blocks, half-size in blocks, style.
    const plan = [
      { name: 'FOREST PARK', th: -2.30, r: 0.62, w: 5, h: 4, style: 'forest' },
      { name: 'GOLF CLUB', th: -0.55, r: 0.66, w: 5, h: 3, style: 'golf' },
      { name: 'THE FARM', th: 0.55, r: 0.72, w: 6, h: 4, style: 'farm' },
      { name: 'CASINO ROW', th: 2.05, r: 0.40, w: 3, h: 2, style: 'casino' },
      { name: 'STADIUM', th: -1.35, r: 0.44, w: 3, h: 3, style: 'stadium' },
      { name: 'DOCKYARD', th: 1.45, r: 0.74, w: 4, h: 3, style: 'industry' },
      { name: 'OLD TOWN', th: 2.85, r: 0.30, w: 3, h: 3, style: 'oldtown' },
      { name: 'BOTANICAL GARDEN', th: 0.05, r: 0.30, w: 3, h: 2, style: 'park' },
    ];

    for (const d of plan) {
      const bx = Math.round(c + Math.cos(d.th) * c * d.r);
      const by = Math.round(c + Math.sin(d.th) * c * d.r);
      const b0x = Math.max(1, bx - d.w), b1x = Math.min(B - 2, bx + d.w);
      const b0y = Math.max(1, by - d.h), b1y = Math.min(B - 2, by + d.h);
      let placed = 0, sx = 0, sy = 0;
      const spots = [];
      for (let by2 = b0y; by2 <= b1y; by2++) {
        for (let bx2 = b0x; bx2 <= b1x; bx2++) {
          const x0 = this.blockLo(bx2, 0), x1 = this.blockHi(bx2, 0);
          const y0 = this.blockLo(by2, 1), y1 = this.blockHi(by2, 1);
          if (x1 >= S - 2 || y1 >= S - 2) continue;
          // Never build over the water, the shore or the airport.
          if (!this._blockIsBuildable(x0, y0, x1, y1)) continue;
          this._fillDistrict(d.style, x0, y0, x1, y1, rng);
          placed++;
          const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
          sx += mx; sy += my;
          spots.push([mx, my]);
        }
      }
      if (placed < 3) continue;
      // The centre is the BUILT block nearest the centroid, not the centroid
      // itself. Taking the mean directly put the dockyard's marker in the
      // middle of the river it is built along both banks of — and a landmark
      // you navigate to has to be somewhere you can stand.
      const gx = sx / placed, gy = sy / placed;
      let cxb = spots[0][0], cyb = spots[0][1], bd = 1e18;
      for (const sp of spots) {
        const dd = (sp[0] - gx) ** 2 + (sp[1] - gy) ** 2;
        if (dd < bd) { bd = dd; cxb = sp[0]; cyb = sp[1]; }
      }
      this.districts.push({
        name: d.name,
        style: d.style,
        x: cxb, y: cyb,
        r: Math.max(d.w, d.h) * this.P,
      });
    }
  }

  /** True when a whole block is still ordinary city — no sea, sand, river,
   *  bridge or runway anywhere in it. */
  _blockIsBuildable(x0, y0, x1, y1) {
    const S = this.size, K = AC.KIND;
    for (let y = y0; y <= y1; y += 2) {
      for (let x = x0; x <= x1; x += 2) {
        const k = this.kind[y * S + x];
        if (k === K.WATER || k === K.SAND || k === K.BRIDGE || k === K.PIER
          || k === K.RUNWAY || k === K.APRON || k === K.HELIPAD) return false;
      }
    }
    return true;
  }

  _clearBlock(x0, y0, x1, y1, kind) {
    const S = this.size;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * S + x;
        this.kind[i] = kind; this.solid[i] = 0; this.h[i] = 0;
        this.mat[i] = AC.MAT.CONCRETE; this.accent[i] = 255; this.lot[i] = 0;
      }
    }
  }

  _fillDistrict(style, x0, y0, x1, y1, rng) {
    const S = this.size, K = AC.KIND, M = AC.MAT;
    const box = (bx0, by0, bx1, by1, h, mat, accent) => {
      for (let y = by0; y <= by1; y++) {
        for (let x = bx0; x <= bx1; x++) {
          if (x < x0 || x > x1 || y < y0 || y > y1) continue;
          const i = y * S + x;
          this.solid[i] = 1; this.h[i] = h; this.mat[i] = mat;
          this.kind[i] = K.BUILDING;
          this.accent[i] = accent === undefined ? 255 : accent;
          this.lot[i] = ++this.lotCount > 60000 ? 1 : this.lotCount;
        }
      }
    };

    if (style === 'forest' || style === 'park') {
      this._clearBlock(x0, y0, x1, y1, K.PARK);
      const n = style === 'forest' ? Math.round((x1 - x0) * (y1 - y0) * 0.11)
        : Math.round((x1 - x0) * (y1 - y0) * 0.03);
      for (let t = 0; t < n; t++) {
        const x = rng.int(x0, x1), y = rng.int(y0, y1);
        const i = y * S + x;
        this.solid[i] = 1;
        this.h[i] = style === 'forest' ? rng.range(3.2, 6.4) : rng.range(1.8, 3.4);
        this.mat[i] = M.FOLIAGE; this.kind[i] = K.PARK;
      }
      return;
    }

    if (style === 'golf') {
      this._clearBlock(x0, y0, x1, y1, K.PARK);
      // Bunkers, and the odd tree along the fairway.
      for (let b = 0, n = rng.int(2, 5); b < n; b++) {
        const cx = rng.int(x0 + 2, x1 - 2), cy = rng.int(y0 + 2, y1 - 2);
        const r = rng.range(1.5, 3.4);
        for (let y = Math.floor(cy - r); y <= cy + r; y++) {
          for (let x = Math.floor(cx - r); x <= cx + r; x++) {
            if (x < x0 || x > x1 || y < y0 || y > y1) continue;
            if ((x - cx) ** 2 + (y - cy) ** 2 > r * r) continue;
            this.kind[y * S + x] = K.SAND;
          }
        }
      }
      for (let t = 0, n = rng.int(2, 6); t < n; t++) {
        const x = rng.int(x0, x1), y = rng.int(y0, y1);
        const i = y * S + x;
        this.solid[i] = 1; this.h[i] = rng.range(2.4, 4.2);
        this.mat[i] = M.FOLIAGE; this.kind[i] = K.PARK;
      }
      if (rng.next() < 0.45) box(x0 + 1, y0 + 1, x0 + 5, y0 + 3, 2.6, M.CONCRETE_W, AC.PAL.NEON_G);
      return;
    }

    if (style === 'farm') {
      this._clearBlock(x0, y0, x1, y1, K.FIELD);
      if (rng.next() < 0.35) box(x1 - 5, y1 - 4, x1 - 1, y1 - 1, 3.4, M.CONCRETE_W, AC.PAL.NEON_R);
      return;
    }

    if (style === 'casino') {
      this._clearBlock(x0, y0, x1, y1, K.PLAZA);
      const accent = [AC.PAL.NEON_M, AC.PAL.NEON_A, AC.PAL.NEON_C][rng.int(0, 2)];
      box(x0 + 2, y0 + 2, x1 - 2, y1 - 2, rng.range(16, 30), M.GLASS_M, accent);
      return;
    }

    if (style === 'stadium') {
      this._clearBlock(x0, y0, x1, y1, K.PARK);
      // A bowl: a ring of stands around an open pitch.
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      const rx = (x1 - x0) / 2 - 0.5, ry = (y1 - y0) / 2 - 0.5;
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          const u = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
          if (u > 1.02 || u < 0.55) continue;
          const i = y * S + x;
          this.solid[i] = 1; this.h[i] = 7.5 + (1 - Math.abs(u - 0.8) * 4) * 2.5;
          this.mat[i] = M.CONCRETE; this.kind[i] = K.BUILDING;
          this.accent[i] = AC.PAL.NEON_C;
          this.lot[i] = 3;
        }
      }
      return;
    }

    if (style === 'industry') {
      this._clearBlock(x0, y0, x1, y1, K.PLAZA);
      for (let n = rng.int(2, 4), i = 0; i < n; i++) {
        const bx = rng.int(x0, x1 - 6), by = rng.int(y0, y1 - 4);
        box(bx, by, Math.min(x1, bx + rng.int(5, 11)), Math.min(y1, by + rng.int(3, 6)),
          rng.range(3.0, 6.0), M.DARK, AC.PAL.NEON_A);
      }
      return;
    }

    // oldtown: many small, low, tightly packed buildings.
    this._clearBlock(x0, y0, x1, y1, K.SIDEWALK);
    for (let y = y0; y < y1; y += 4) {
      for (let x = x0; x < x1; x += 4) {
        if (rng.next() < 0.18) continue;
        box(x, y, Math.min(x1, x + 2), Math.min(y1, y + 2),
          rng.range(3.5, 8.0), rng.next() < 0.5 ? M.CONCRETE_W : M.CONCRETE,
          rng.next() < 0.3 ? AC.PAL.NEON_A : 255);
      }
    }
  }

  /** The named district containing a point, if any. Used by the map to label
   *  what the cursor is over and to snap a pin onto a landmark rather than onto
   *  an arbitrary rooftop inside it. */
  districtNear(x, y) {
    let best = null, bd = 1e18;
    for (const d of (this.districts || [])) {
      const dd = (d.x - x) * (d.x - x) + (d.y - y) * (d.y - y);
      if (dd < d.r * d.r && dd < bd) { bd = dd; best = d; }
    }
    return best;
  }

  /** The seafront funfair: a timber pier out into the water on the east shore,
   *  carrying a ferris wheel at the seaward end and a coaster behind it.
   *
   *  The deck is grid cells, because you walk and drive on it. The rides are
   *  NOT — they are described here as parametric geometry and drawn by the
   *  renderer as projected point clouds. A ferris wheel expressed as columns of
   *  a height field would be a cylinder. */
  _pier(rng) {
    const S = this.size, K = AC.KIND, cfg = this.cfg;
    const c = (S - 1) / 2;
    // March east along the middle row until the land runs out.
    let sx = Math.round(c);
    while (sx < S - 2 && this.shoreDist(sx, c) < this.shoreAt(sx, c) - cfg.beachWidth) sx++;
    const y0 = Math.round(c - cfg.pierWidth / 2);
    const y1 = y0 + cfg.pierWidth;
    const x1 = Math.min(S - 1, sx + cfg.pierLength);

    for (let y = y0; y <= y1; y++) {
      for (let x = sx - 3; x <= x1; x++) {
        if (!this.inBounds(x, y)) continue;
        const j = y * S + x;
        this.solid[j] = 0; this.h[j] = 0;
        this.kind[j] = K.PIER;
        this.mat[j] = AC.MAT.CONCRETE;
      }
    }

    const midY = (y0 + y1) / 2 + 0.5;
    this.funfair = {
      deck: { x0: sx - 3, x1, y0, y1 },
      // Disc in the y-z plane so the whole circle faces you as you walk out.
      wheel: {
        x: x1 - cfg.wheelRadius * 0.55 + 0.5,
        y: midY,
        z: cfg.wheelRadius + 1.6,
        r: cfg.wheelRadius,
        cars: cfg.wheelCars,
        phase: rng.next() * Math.PI * 2,
      },
      coaster: {
        x: sx + cfg.coasterA + 2.5,
        y: midY,
        a: cfg.coasterA,
        b: Math.min(cfg.coasterB, cfg.pierWidth / 2 - 1),
        z: 1.2,
        lift: cfg.coasterLift,
        phase: rng.next(),
      },
    };
  }

  /** A point on the coaster track, u in [0,1) around the circuit.
   *
   *  Plan is an oval; height is one big lift hill and a smaller second rise, so
   *  the train visibly climbs, drops and climbs again rather than orbiting at a
   *  constant altitude. */
  coasterPoint(u, out) {
    const C = this.funfair.coaster;
    const th = u * Math.PI * 2;
    const z = C.z + C.lift * (0.5 - 0.5 * Math.cos(th))
      + C.lift * 0.22 * (0.5 - 0.5 * Math.cos(th * 3));
    const o = out || {};
    o.x = C.x + Math.cos(th) * C.a;
    o.y = C.y + Math.sin(th) * C.b;
    o.z = z;
    return o;
  }

  /** Distance from the city centre used to shape the island.
   *
   *  A blend of Chebyshev and Euclidean distance: pure Chebyshev gives a square
   *  with hard corners, pure Euclidean a circle that would drown the airport in
   *  the west. Three-quarters square keeps the street grid usable right out to
   *  the promenade and still rounds the corners off into headlands. */
  shoreDist(x, y) {
    const c = (this.size - 1) / 2;
    const dx = Math.abs(x - c), dy = Math.abs(y - c);
    const cheb = dx > dy ? dx : dy;
    const euc = Math.sqrt(dx * dx + dy * dy);
    return 0.75 * cheb + 0.25 * euc;
  }

  /** Coastline radius in a given direction — the shore is not a circle. */
  shoreAtTheta(th) {
    const A = this.cfg.islandRadius * 0.04;
    return this.cfg.islandRadius
      + Math.sin(th * 3 + 0.7) * A
      + Math.sin(th * 5 - 1.9) * A * 0.62
      + Math.sin(th * 8 + 2.4) * A * 0.35;
  }

  shoreAt(x, y) {
    const c = (this.size - 1) / 2;
    return this.shoreAtTheta(Math.atan2(y - c, x - c));
  }

  /** Distance from the centre, along a bearing, at which `shoreDist` equals the
   *  shoreline plus `off`.
   *
   *  `shoreDist` is a blend of Chebyshev and Euclidean distance, so it is
   *  linear in radius for a fixed bearing — which makes this an exact inverse
   *  rather than a search. Anything that wants to sit a fixed distance offshore
   *  has to use it: a plain circle of radius `islandRadius + n` runs aground on
   *  the diagonals, where the blended metric is much smaller than the radius. */
  seaRadius(th, off) {
    const cs = Math.abs(Math.cos(th)), sn = Math.abs(Math.sin(th));
    const k = 0.75 * (cs > sn ? cs : sn) + 0.25;
    return (this.shoreAtTheta(th) + off) / Math.max(0.2, k);
  }

  /** Carve the island: sand ring, then open water, then the sea beyond the
   *  grid. Runs last, so it overrides anything the block and airport passes
   *  put in the way. */
  _island() {
    const S = this.size, K = AC.KIND;
    const beach = this.cfg.beachWidth;
    for (let y = 0; y < S; y++) {
      for (let x = 0; x < S; x++) {
        const d = this.shoreDist(x, y);
        const r = this.shoreAt(x, y);
        if (d < r - beach) continue;                 // inland: leave the city
        const j = y * S + x;
        this.solid[j] = 0;
        this.h[j] = 0;
        this.accent[j] = 255;
        this.lot[j] = 0;
        this.mat[j] = AC.MAT.CONCRETE;
        this.kind[j] = d < r ? K.SAND : K.WATER;
      }
    }
  }

  /** Mark every corridor node traffic may not use.
   *
   *  Runs LAST, after the sea, the river and the districts have all had their
   *  say — a node is usable if what is actually under it is drivable, and every
   *  one of those passes can take a node away. */
  _blockNodes() {
    const S = this.size, B = this.blocksPerSide;
    for (let ky = 0; ky < B; ky++) {
      for (let kx = 0; kx < B; kx++) {
        const cx = this.corridorCentre(kx) | 0, cy = this.corridorCentre(ky) | 0;
        if (!this.inBounds(cx, cy) || !AC.isDriveable(this.kind[cy * S + cx])) {
          this.blockedNodes[ky * B + kx] = 1;
        }
      }
    }
  }

  /** Fill every block interior: parks, plazas or subdivided building lots. */
  _blocks(rng) {
    const B = this.blocksPerSide;
    const cx = (B - 1) / 2, cy = (B - 1) / 2;
    const maxR = Math.hypot(cx, cy);

    for (let by = 0; by < B; by++) {
      for (let bx = 0; bx < B; bx++) {
        // Downtown gradient: 1 at the core, 0 at the rim.
        const d = Math.hypot(bx - cx, by - cy) / maxR;
        const density = Math.pow(1 - Math.min(1, d), 1.35);

        const x0 = this.blockLo(bx, 0), x1 = this.blockHi(bx, 0);   // inclusive
        const y0 = this.blockLo(by, 1), y1 = this.blockHi(by, 1);
        if (x1 >= this.size - 2 || y1 >= this.size - 2) continue;
        if (x1 < x0 || y1 < y0) continue;

        const roll = rng.next();
        if (roll < this.cfg.parkChance) {
          this._park(x0, y0, x1, y1, rng);
        } else if (roll < this.cfg.parkChance + this.cfg.plazaChance) {
          this._plaza(x0, y0, x1, y1, rng);
        } else {
          this._lots(x0, y0, x1, y1, density, rng, 0);
        }
      }
    }
  }

  _park(x0, y0, x1, y1, rng) {
    const S = this.size, K = AC.KIND, M = AC.MAT;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * S + x;
        this.kind[i] = K.PARK;
        this.solid[i] = 0;
        this.h[i] = 0;
      }
    }
    const trees = rng.int(4, 9);
    for (let t = 0; t < trees; t++) {
      const x = rng.int(x0, x1), y = rng.int(y0, y1);
      const i = y * S + x;
      this.solid[i] = 1;
      this.h[i] = rng.range(1.6, 3.1);
      this.mat[i] = M.FOLIAGE;
      this.kind[i] = K.PARK;
    }
  }

  _plaza(x0, y0, x1, y1, rng) {
    const S = this.size, K = AC.KIND;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * S + x;
        this.kind[i] = K.PLAZA;
        this.solid[i] = 0;
        this.h[i] = 0;
      }
    }
    // A single monument slab in the middle.
    if (rng.chance(0.7)) {
      const mx = ((x0 + x1) / 2) | 0, my = ((y0 + y1) / 2) | 0;
      const i = my * S + mx;
      this.solid[i] = 1;
      this.h[i] = rng.range(3, 7);
      this.mat[i] = AC.MAT.CONCRETE_W;
      this.kind[i] = AC.KIND.BUILDING;
    }
  }

  /** Recursive binary subdivision of a block interior into building lots. */
  _lots(x0, y0, x1, y1, density, rng, depth) {
    const w = x1 - x0 + 1, hgt = y1 - y0 + 1;
    if (w <= 0 || hgt <= 0) return;

    const splittable = (w >= 5 || hgt >= 5) && depth < 3 && rng.chance(0.82);
    if (splittable) {
      if (w >= hgt) {
        const cut = rng.int(x0 + 2, x1 - 2);
        this._lots(x0, y0, cut, y1, density, rng, depth + 1);
        this._lots(cut + 1, y0, x1, y1, density, rng, depth + 1);
      } else {
        const cut = rng.int(y0 + 2, y1 - 2);
        this._lots(x0, y0, x1, cut, density, rng, depth + 1);
        this._lots(x0, cut + 1, x1, y1, density, rng, depth + 1);
      }
      return;
    }

    // Leave the odd courtyard / alley so blocks are not solid slabs.
    if (rng.chance(0.07 + 0.07 * (1 - density))) {
      for (let y = y0; y <= y1; y++)
        for (let x = x0; x <= x1; x++) this.kind[y * this.size + x] = AC.KIND.PLAZA;
      return;
    }

    const cfg = this.cfg;
    const spread = cfg.maxFloors - cfg.minFloors;
    let floors = cfg.minFloors + spread * Math.pow(rng.next(), 1.7) * (0.30 + 0.95 * density);
    if (rng.chance(0.05 * density + 0.01)) floors *= rng.range(1.5, 2.3); // spire
    floors = Math.max(cfg.minFloors, Math.min(cfg.maxFloors * 1.8, floors));
    const height = floors * cfg.floorHeight;

    const mats = [AC.MAT.CONCRETE, AC.MAT.CONCRETE_W, AC.MAT.GLASS_C, AC.MAT.GLASS_M, AC.MAT.DARK];
    const wts = [0.30, 0.20, 0.20 + 0.10 * density, 0.14 + 0.08 * density, 0.16];
    let acc = 0, r = rng.next() * wts.reduce((a, b) => a + b, 0), mat = 0;
    for (let i = 0; i < mats.length; i++) { acc += wts[i]; if (r <= acc) { mat = mats[i]; break; } }

    // Neon accent for the lot; drives sign colour and window glow.
    const accents = [AC.PAL.NEON_M, AC.PAL.NEON_C, AC.PAL.NEON_A, AC.PAL.NEON_G, AC.PAL.NEON_R];
    const accent = rng.chance(0.75) ? accents[rng.int(0, accents.length - 1)] : 255;

    // Step the tops of larger footprints so skylines are not flat.
    const stepTop = rng.chance(0.35);
    const S = this.size;
    const lot = (this.lotCount = (this.lotCount + 1) & 0xffff) || 1;
    // A real city is not made of rectangles: this picks an L, a U, a courtyard,
    // a chamfered corner and so on, and returns a per-cell mask. Everything
    // outside the mask is left as open ground, which is where the alleys,
    // light wells and forecourts come from.
    const mask = this._footprint(w, hgt, rng);
    // Podium-and-tower, so a tall lot does not read as one extruded slab.
    const podium = rng.chance(0.42) && w >= 5 && hgt >= 5 && height > 9
      ? {
        x0: x0 + rng.int(1, Math.max(1, (w / 3) | 0)),
        y0: y0 + rng.int(1, Math.max(1, (hgt / 3) | 0)),
        w: Math.max(2, (w * rng.range(0.34, 0.62)) | 0),
        h: Math.max(2, (hgt * rng.range(0.34, 0.62)) | 0),
        base: height * rng.range(0.22, 0.42),
      } : null;

    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * S + x;
        if (!mask[(y - y0) * w + (x - x0)]) {
          // Cut away, not built on: a yard rather than a hole in the world.
          this.kind[i] = AC.KIND.PLAZA;
          this.solid[i] = 0;
          this.h[i] = 0;
          continue;
        }
        this.kind[i] = AC.KIND.BUILDING;
        this.solid[i] = 1;
        this.mat[i] = mat;
        this.accent[i] = accent;
        this.lot[i] = lot;
        let hh = height;
        if (podium) {
          const inTower = x >= podium.x0 && x < podium.x0 + podium.w
            && y >= podium.y0 && y < podium.y0 + podium.h;
          hh = inTower ? height : podium.base;
        } else if (stepTop) {
          const edge = Math.min(x - x0, x1 - x, y - y0, y1 - y);
          hh = height * (0.72 + 0.10 * Math.min(3, edge));
        }
        this.h[i] = hh;
      }
    }
  }

  /** Per-cell build mask for one lot, `w * h` bytes, row-major.
   *
   *  All of these are cut from the bounding rectangle rather than drawn into
   *  it, so the footprint always touches at least one street frontage — a
   *  building floating in the middle of a block reads as a mistake.
   *  Very small lots stay rectangular: there is nothing to carve out of a 2x2,
   *  and the ones that are only three cells across get corners and frontages
   *  rather than courtyards. */
  _footprint(w, h, rng) {
    const m = new Uint8Array(w * h).fill(1);
    const at = (x, y) => y * w + x;
    if (w < 3 || h < 3) return m;

    const roll = rng.next();
    if (roll < 0.16) {
      // L: one corner quadrant removed. The bite is a third of the lot at
      // most — a half-lot bite reads as two buildings, and enough of those in
      // a row and the city map goes hollow.
      const cw = rng.int(1, Math.max(1, Math.ceil(w / 3)));
      const chh = rng.int(1, Math.max(1, Math.ceil(h / 3)));
      const rx = rng.chance(0.5), ry = rng.chance(0.5);
      for (let y = 0; y < chh; y++) {
        for (let x = 0; x < cw; x++) {
          m[at(rx ? w - 1 - x : x, ry ? h - 1 - y : y)] = 0;
        }
      }
    } else if (roll < 0.25) {
      // U: a notch bitten out of one side, i.e. a light well open to the street.
      const vert = rng.chance(0.5);
      const span = vert ? w : h;
      const depth = rng.int(1, Math.max(1, Math.ceil((vert ? h : w) / 3)));
      const n0 = rng.int(1, Math.max(1, span - 3));
      const n1 = Math.min(span - 2, n0 + rng.int(1, Math.max(1, ((span / 2) | 0))));
      const far = rng.chance(0.5);
      for (let a = n0; a <= n1; a++) {
        for (let d = 0; d < depth; d++) {
          if (vert) m[at(a, far ? h - 1 - d : d)] = 0;
          else m[at(far ? w - 1 - d : d, a)] = 0;
        }
      }
    } else if (roll < 0.31 && w >= 6 && h >= 6) {
      // Courtyard: a hollow core with an entry passage to the street.
      const bx = rng.int(1, w - 4), by = rng.int(1, h - 4);
      const bw = rng.int(2, Math.max(2, w - bx - 2));
      const bh = rng.int(2, Math.max(2, h - by - 2));
      for (let y = by; y < by + bh; y++) {
        for (let x = bx; x < bx + bw; x++) m[at(x, y)] = 0;
      }
      const side = rng.int(0, 3);
      const px = bx + ((bw / 2) | 0), py = by + ((bh / 2) | 0);
      if (side === 0) for (let y = 0; y < by; y++) m[at(px, y)] = 0;
      else if (side === 1) for (let y = by + bh; y < h; y++) m[at(px, y)] = 0;
      else if (side === 2) for (let x = 0; x < bx; x++) m[at(x, py)] = 0;
      else for (let x = bx + bw; x < w; x++) m[at(x, py)] = 0;
    } else if (roll < 0.42) {
      // Chamfer: corners clipped on the diagonal, the way a bank on a corner
      // plot always is.
      const c = rng.int(1, Math.min(3, Math.min(w, h) - 2));
      const corners = [[0, 0], [1, 0], [0, 1], [1, 1]].filter(() => rng.chance(0.62));
      for (const [rx, ry] of corners) {
        for (let y = 0; y <= c; y++) {
          for (let x = 0; x + y <= c; x++) {
            m[at(rx ? w - 1 - x : x, ry ? h - 1 - y : y)] = 0;
          }
        }
      }
    } else if (roll < 0.48) {
      // Sawtooth frontage: a shallow ragged edge along one street.
      const vert = rng.chance(0.5);
      const span = vert ? w : h;
      for (let a = 0; a < span; a++) {
        if (!rng.chance(0.45)) continue;
        if (vert) m[at(a, rng.chance(0.5) ? 0 : h - 1)] = 0;
        else m[at(rng.chance(0.5) ? 0 : w - 1, a)] = 0;
      }
    }
    // Anything left is a plain rectangle, which real blocks also contain.

    // A mask that carved away everything is worse than no mask at all.
    let live = 0;
    for (let i = 0; i < m.length; i++) live += m[i];
    if (live < 2) m.fill(1);
    return m;
  }

  // --- queries used by the renderer -----------------------------------------

  /** Per-building facade description, derived once and cached by lot id.
   *  Pure function of the lot id, so it costs nothing in the world hash and
   *  survives a reload unchanged. */
  facade(lot) {
    const cache = this._facades || (this._facades = new Map());
    let f = cache.get(lot);
    if (f) return f;
    const h = AC.hash2(lot, 0x9E37, 0x4F1B);
    const winCols = 2 + (h & 3);                     // 2..5 windows per cell
    const vlo = 0.10 + ((h >>> 3) & 7) * 0.022;
    const vhi = 1 - vlo - 0.06 * (((h >>> 6) & 3) / 3);
    f = {
      winCols,
      vlo, vhi,
      hlo: 0.10 + ((h >>> 8) & 7) * 0.020,
      lit: 0.24 + ((h >>> 11) & 15) / 15 * 0.46,     // 24%..70% occupancy
      ledge: ((h >>> 15) & 3) === 0 ? 3 + ((h >>> 17) & 3) : 0,
      warm: ((h >>> 19) & 7) < 3,                    // amber vs cyan interiors
      mullion: ((h >>> 22) & 1) === 1,
    };
    f.hhi = 1 - f.hlo;
    cache.set(lot, f);
    return f;
  }

  /** Deterministic vertical neon sign for a wall face, or null.
   *  side: 0 = wall faces -X, 1 = +X, 2 = -Y, 3 = +Y.
   *  Signs only appear on faces that actually front a street, and only below
   *  the building's own roofline. Everything here is a pure function of
   *  (x, y, side) so the raycaster can ask per column with no lookup table. */
  signAt(x, y, side) {
    const i = y * this.size + x;
    const accent = this.accent[i];
    if (accent === 255) return null;

    const h0 = AC.hash2(x, y, 0x5169 + side * 7919);
    if ((h0 & 0xff) > 92) return null;             // ~36% of eligible faces

    const word = AC.SIGN_WORDS[(h0 >>> 8) % AC.SIGN_WORDS.length];
    const charH = 0.42 + ((h0 >>> 14) & 7) * 0.035;      // world units per glyph
    const span = word.length * charH;
    const roof = this.h[i];
    const headroom = roof - 1.1 - span;
    if (headroom <= 0.2) return null;
    const zTop = 1.1 + span + ((h0 >>> 18) & 31) / 31 * headroom;
    return { word, charH, zTop, base: accent, blink: ((h0 >>> 24) & 7) === 0 };
  }

  /** Is the cell facing an open street on the given side? */
  facesStreet(x, y, dx, dy) {
    const nx = x + dx, ny = y + dy;
    if (!this.inBounds(nx, ny)) return false;
    const k = this.kind[ny * this.size + nx];
    return k === AC.KIND.ROAD || k === AC.KIND.SIDEWALK || k === AC.KIND.PLAZA;
  }

  /** A deterministic hash of the whole map — used by the determinism test. */
  hash() {
    let h = 0x811C9DC5 >>> 0;
    const mix = (v) => { h ^= v >>> 0; h = Math.imul(h, 0x01000193) >>> 0; };
    for (let i = 0; i < this.kind.length; i++) {
      mix(this.kind[i]);
      mix(this.solid[i]);
      mix(Math.round(this.h[i] * 1024));
      mix(this.mat[i]);
      mix(this.accent[i]);
    }
    return h >>> 0;
  }

  nodeBlocked(kx, ky) {
    const B = this.blocksPerSide;
    if (kx < 0 || ky < 0 || kx >= B || ky >= B) return true;
    return this.blockedNodes[ky * B + kx] === 1;
  }

  /** Carve an airport out of the west side: clear the block grid, lay a
   *  runway, apron, helipads, terminal and tower, and mark every road node it
   *  swallows so traffic routes around it instead of driving down the runway.
   *
   *  The flight circuit is built here too — it is a property of the airport's
   *  geometry, and putting it anywhere else means two places have to agree on
   *  where the runway is. */
  _airport(rng) {
    const S = this.size, K = AC.KIND, M = AC.MAT;
    // Placed as a fraction of the grid rather than at fixed cells: the map grew
    // when the island arrived, and a hardcoded footprint on the western side
    // ended up in the sea.
    const f = (v) => Math.round(v * S);
    const A = {
      x0: f(0.13), x1: f(0.38), y0: f(0.34), y1: f(0.46),
      rwHalf: 2,
    };
    A.rwX0 = A.x0 + 6; A.rwX1 = A.x1 - 6;
    A.rwY = Math.round((A.y0 + A.y1) / 2);
    this.airport = A;

    for (let y = A.y0; y <= A.y1; y++) {
      for (let x = A.x0; x <= A.x1; x++) {
        const i = y * S + x;
        this.solid[i] = 0; this.h[i] = 0; this.lot[i] = 0;
        this.accent[i] = 255; this.mat[i] = M.CONCRETE;
        this.kind[i] = K.APRON;
      }
    }
    for (let y = A.rwY - A.rwHalf; y <= A.rwY + A.rwHalf; y++) {
      for (let x = A.rwX0; x <= A.rwX1; x++) this.kind[y * S + x] = K.RUNWAY;
    }

    // Helipads and aircraft stands along the southern apron.
    const span = A.x1 - A.x0;
    A.pads = [{ x: A.x0 + 7.5, y: A.y1 - 4.5 }, { x: A.x0 + 15.5, y: A.y1 - 4.5 }];
    for (const pad of A.pads) {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          this.kind[((pad.y | 0) + dy) * S + ((pad.x | 0) + dx)] = K.HELIPAD;
        }
      }
    }
    A.stands = [
      { x: A.x0 + span * 0.46, y: A.y1 - 5.5 },
      { x: A.x0 + span * 0.58, y: A.y1 - 5.5 },
      { x: A.x0 + span * 0.70, y: A.y1 - 5.5 },
    ];

    // Terminal and control tower, so the apron is not a bare slab.
    for (let y = A.y1 - 3; y <= A.y1 - 1; y++) {
      for (let x = Math.round(A.x0 + span * 0.42); x <= Math.round(A.x0 + span * 0.75); x++) {
        const i = y * S + x;
        this.solid[i] = 1; this.h[i] = 3.2; this.mat[i] = M.GLASS_C;
        this.kind[i] = K.BUILDING; this.accent[i] = AC.PAL.NEON_C;
        this.lot[i] = 1;
      }
    }
    for (let y = A.y1 - 4; y <= A.y1 - 3; y++) {
      for (let x = Math.round(A.x0 + span * 0.34); x <= Math.round(A.x0 + span * 0.37); x++) {
        const i = y * S + x;
        this.solid[i] = 1; this.h[i] = 9.5; this.mat[i] = M.CONCRETE_W;
        this.kind[i] = K.BUILDING; this.accent[i] = AC.PAL.NEON_A;
        this.lot[i] = 2;
      }
    }

    // Any road node inside the footprint (plus a cell of margin) is off limits.
    const B = this.blocksPerSide;
    for (let ky = 0; ky < B; ky++) {
      const cy = this.corridorCentre(ky);
      for (let kx = 0; kx < B; kx++) {
        const cx = this.corridorCentre(kx);
        if (cx >= A.x0 - 1 && cx <= A.x1 + 1 && cy >= A.y0 - 1 && cy <= A.y1 + 1) {
          this.blockedNodes[ky * B + kx] = 1;
        }
      }
    }
  }

  /** Paint a decal disc into one of the runtime layers, saturating at 255. */
  stain(layer, wx, wy, radius, amount) {
    const r2 = radius * radius;
    const x0 = Math.floor(wx - radius), x1 = Math.ceil(wx + radius);
    const y0 = Math.floor(wy - radius), y1 = Math.ceil(wy + radius);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        if (!this.inBounds(cx, cy)) continue;
        const i = cy * this.size + cx;
        if (this.solid[i]) continue;
        const dx = cx + 0.5 - wx, dy = cy + 0.5 - wy;
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        const fall = 1 - Math.sqrt(d2 / r2);
        const v = layer[i] + amount * fall;
        layer[i] = v > 255 ? 255 : v;
      }
    }
  }

  stainBlood(wx, wy, radius, amount) { this.stain(this.blood, wx, wy, radius, amount); }
  stainScorch(wx, wy, radius, amount) { this.stain(this.scorch, wx, wy, radius, amount); }

  /** Default spawn: mid-carriageway on a central avenue, looking down it. */
  /** Where a new game starts: a road node near the middle of the island that is
   *  not in the river. The old version took the centre corridor on trust, which
   *  stopped being safe the moment a river was cut down the middle of it. */
  spawnPoint() {
    const B = this.blocksPerSide, mid = Math.floor(B / 2);
    let best = null, bd = 1e18;
    for (let ky = 1; ky < B - 1; ky++) {
      for (let kx = 1; kx < B - 1; kx++) {
        const x = this.corridorCentre(kx), y = this.corridorCentre(ky);
        if (this.kind[(y | 0) * this.size + (x | 0)] !== AC.KIND.ROAD) continue;
        if (this.riverDist(x, y) < this.cfg.riverWidth + 12) continue;
        const d = (kx - mid) ** 2 + (ky - mid) ** 2;
        if (d < bd) { bd = d; best = { x, y }; }
      }
    }
    if (!best) { const c = this.corridorCentre(mid); best = { x: c, y: c }; }
    return { x: best.x, y: best.y, yaw: Math.PI / 2 };
  }

  /** Nearest open, walkable cell centre to (x,y) — used for spawning. */
  /** Places the city puts you back on your feet: four clinics, one per quarter.
   *
   *  Built after the island carve so they can be snapped onto road nodes that
   *  actually survived, and kept deterministic — they are part of the world,
   *  not of the run. */
  _clinics() {
    const B = this.blocksPerSide;
    const q = [0.28, 0.72];
    this.clinics = [];
    for (const fy of q) {
      for (const fx of q) {
        const n = this.nodeAt(this.corridorCentre(Math.round(fx * (B - 1))),
          this.corridorCentre(Math.round(fy * (B - 1))));
        this.clinics.push({
          x: this.corridorCentre(n.kx), y: this.corridorCentre(n.ky),
          yaw: Math.atan2(this.size / 2 - this.corridorCentre(n.ky),
            this.size / 2 - this.corridorCentre(n.kx)),
        });
      }
    }
  }

  /** Where you wake up after dying: the nearest clinic to where you went down.
   *  Respawning on the exact tile you started the session on made the cutscene
   *  look broken — nothing had changed by the end of it. */
  respawnNear(x, y) {
    let best = this.clinics[0], bd = 1e18;
    for (const c of this.clinics) {
      const d = (c.x - x) * (c.x - x) + (c.y - y) * (c.y - y);
      if (d < bd) { bd = d; best = c; }
    }
    return best;
  }

  /** Nearest road node to a world position. Corridor k is centred at
   *  `corridorCentre(k)`, so this is the inverse of that, clamped and nudged
   *  off any node the airport swallowed. */
  nodeAt(x, y) {
    const B = this.blocksPerSide;
    const clamp = (v) => Math.max(0, Math.min(B - 1, v));
    const inv = (c) => Math.round((c - (this.W - 1) / 2 - 0.5) / this.P);
    let kx = clamp(inv(x)), ky = clamp(inv(y));
    if (!this.nodeBlocked(kx, ky)) return { kx, ky };
    // Search outward in rings until something opens up. A fixed three-node
    // window was fine when the only hole in the grid was an airport six nodes
    // across; the airport is now twenty-odd nodes wide and the river is longer
    // than the map, so a bounded search just returned a blocked node.
    for (let r = 1; r < B; r++) {
      let best = null, bd = 1e18;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          const tx = clamp(kx + dx), ty = clamp(ky + dy);
          if (this.nodeBlocked(tx, ty)) continue;
          const cx = this.corridorCentre(tx), cy = this.corridorCentre(ty);
          const d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
          if (d < bd) { bd = d; best = { kx: tx, ky: ty }; }
        }
      }
      if (best) return best;
    }
    return { kx, ky };
  }

  /** Shortest road route between two nodes, as a list of `{kx, ky}`.
   *
   *  Breadth-first over the corridor graph, four-connected. The graph is
   *  `blocksPerSide` squared — a couple of hundred nodes — so the simplest
   *  correct search is also fast enough to re-run whenever the player crosses
   *  an intersection, which is what keeps the drawn route honest as you drive.
   *  Returns null when the destination is unreachable. */
  routeNodes(kx0, ky0, kx1, ky1) {
    const STEP = [[1, 0], [0, 1], [-1, 0], [0, -1]];
    const B = this.blocksPerSide;
    if (this.nodeBlocked(kx0, ky0) || this.nodeBlocked(kx1, ky1)) return null;
    const start = ky0 * B + kx0, goal = ky1 * B + kx1;
    if (start === goal) return [{ kx: kx0, ky: ky0 }];
    const prev = new Int32Array(B * B).fill(-1);
    const seen = new Uint8Array(B * B);
    const queue = new Int32Array(B * B);
    let head = 0, tail = 0;
    queue[tail++] = start; seen[start] = 1;
    while (head < tail) {
      const cur = queue[head++];
      if (cur === goal) break;
      const cx = cur % B, cy = (cur / B) | 0;
      for (let d = 0; d < 4; d++) {
        // Spelled out rather than borrowing AC.DIRS: that lives in 05_entities,
        // and the numeric file prefixes are the dependency order.
        const nx = cx + STEP[d][0], ny = cy + STEP[d][1];
        if (this.nodeBlocked(nx, ny)) continue;
        const ni = ny * B + nx;
        if (seen[ni]) continue;
        seen[ni] = 1; prev[ni] = cur; queue[tail++] = ni;
      }
    }
    if (!seen[goal]) return null;
    const out = [];
    for (let cur = goal; cur !== -1; cur = prev[cur]) {
      out.push({ kx: cur % B, ky: (cur / B) | 0 });
      if (cur === start) break;
    }
    out.reverse();
    return out;
  }

  /** Does a circle of radius r at (x, y) clear every wall?
   *  Same test the player uses, but without the vehicle pass — this one is for
   *  choosing spawn points, where traffic has not been placed yet. */
  clearFor(x, y, r) {
    const x0 = Math.floor(x - r), x1 = Math.floor(x + r);
    const y0 = Math.floor(y - r), y1 = Math.floor(y + r);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        if (!this.isSolidAt(cx, cy)) continue;
        const px = Math.max(cx, Math.min(x, cx + 1));
        const py = Math.max(cy, Math.min(y, cy + 1));
        const dx = x - px, dy = y - py;
        if (dx * dx + dy * dy < r * r) return false;
      }
    }
    return true;
  }

  /** Nearest point at which a body of radius r actually fits.
   *
   *  `findOpen` only asks whether a single cell is non-solid, which is fine for
   *  a point and useless for a vehicle: a tank dropped on a cell right beside a
   *  kerb is wedged the moment it exists. Searches on a half-cell lattice so
   *  the answer can sit between cells. */
  findClear(x, y, r) {
    if (this.clearFor(x, y, r)) return { x, y };
    for (let step = 1; step <= 24; step++) {
      const d = step * 0.5;
      for (let a = 0; a < 16; a++) {
        const th = (a / 16) * Math.PI * 2;
        const nx = x + Math.cos(th) * d, ny = y + Math.sin(th) * d;
        if (this.clearFor(nx, ny, r)) return { x: nx, y: ny };
      }
    }
    return this.findOpen(x, y);
  }

  findOpen(x, y) {
    for (let r = 0; r < this.size; r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          const nx = (x + dx) | 0, ny = (y + dy) | 0;
          if (!this.inBounds(nx, ny)) continue;
          if (!this.solid[ny * this.size + nx]) return { x: nx + 0.5, y: ny + 0.5 };
        }
      }
    }
    return { x: 1.5, y: 1.5 };
  }
};


/* ===== src/05_entities.js ============================================ */
// ---------------------------------------------------------------------------
// entities.js — traffic and pedestrian simulation.
//
// Pure simulation: nothing here touches the screen. Everything advances on the
// fixed dt from CONFIG, and every stochastic choice comes from a per-entity
// mulberry32 stream seeded at spawn, so the Nth step is reproducible whatever
// the frame rate did.
//
// Cars run on the road-corridor graph. A corridor index k on either axis has
// its centreline at k*blockPitch + (roadWidth-1)/2 + 0.5; intersections are the
// (kx, ky) pairs. Cars hold a lane offset to the right of the centreline, and
// turn through a quadratic Bezier fitted to the two lane lines so corners do
// not snap.
// ---------------------------------------------------------------------------

AC.DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
AC.LANE = 0.62;
AC.CAR_BODY = [AC.PAL.CAR_R, AC.PAL.CAR_B, AC.PAL.CAR_W, AC.PAL.CAR_G];

AC.Car = class Car {
  constructor(world, cfg, rng) {
    this.w = world; this.cfg = cfg;
    this.rng = new AC.Rng(rng.int(1, 0x7ffffffe));
    this.base = AC.CAR_BODY[this.rng.int(0, AC.CAR_BODY.length - 1)];
    this.width = 0.72;
    this.height = 0.62;
    this.speed = 0;
    this.target = cfg.carMaxSpeed * this.rng.range(0.72, 1.0);
    this.turning = null;
    this.playerDriven = false;
    this.heading = 0;
    this.vx = 0; this.vy = 0;

    // 'alive' -> ('knocked' -> 'recover' -> 'alive') | 'exploding' -> 'gone'.
    // Traffic reaps 'gone'.
    this.state = 'alive';
    this.hp = cfg.carHitPoints;
    this.hitFlash = 0;
    this.boomT = 0;
    this.kvx = 0; this.kvy = 0; this.spin = 0;
    this.knockT = 0; this.recoverT = 0;

    // parked: sits where it is and is never taken over by the lane AI.
    // tank: heavier, slower, and lethal to anything it touches.
    // summon: a cheat-driven drive-to-the-player manoeuvre.
    this.parked = false;
    this.tank = false;
    this.summon = null;
  }

  /** A tank: parked where it is put, and not part of the traffic flow. */
  static spawnTank(world, cfg, rng, x, y, heading) {
    const t = new Car(world, cfg, rng);
    t.tank = true;
    t.parked = true;
    t.base = AC.PAL.FOLIAGE;              // olive drab
    t.hp = cfg.tankHitPoints;
    t.x = x; t.y = y; t.heading = heading;
    t.speed = 0; t.vx = 0; t.vy = 0;
    const N = world.blocksPerSide;
    t.kx = Math.max(1, Math.min(N - 2, Math.round((x - 1.5) / world.P)));
    t.ky = Math.max(1, Math.min(N - 2, Math.round((y - 1.5) / world.P)));
    t.dirIdx = 0;
    return t;
  }

  /** Leave the lane grid and drive to a spot, then hold it. */
  /** Collision radius. A tank is a bigger object than a hatchback, and every
   *  collision test asks the car rather than reading the config directly. */
  bodyRadius() {
    return this.tank ? this.cfg.carBodyRadius * this.cfg.tankBodyScale
      : this.cfg.carBodyRadius;
  }

  summonTo(x, y, heading) {
    if (this.state !== 'alive') return false;
    this.turning = null;
    this.parked = false;
    this.summon = { x, y, heading, t: 0 };
    return true;
  }

  _stepSummon(dt) {
    const cfg = this.cfg, S = this.summon;
    S.t += dt;
    const r = this.bodyRadius();
    const dx = S.x - this.x, dy = S.y - this.y;
    const d = Math.hypot(dx, dy);

    if (d > 0.35 && S.t < cfg.summonDur) {
