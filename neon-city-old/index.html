      this.heading = AC.steer(this.heading, Math.atan2(dy, dx), 2.6 * dt);
      const want = Math.min(cfg.carMaxSpeed * 1.15, d * 1.7);
      this.speed += (want - this.speed) * Math.min(1, dt * 3);
      const nx = this.x + Math.cos(this.heading) * this.speed * dt;
      const ny = this.y + Math.sin(this.heading) * this.speed * dt;
      if (!this._hitsWorld(nx, this.y, r)) this.x = nx;
      if (!this._hitsWorld(this.x, ny, r)) this.y = ny;
    } else {
      // Arrived, or out of time: settle onto the mark and square up.
      this.speed *= (1 - Math.min(1, dt * 6));
      this.heading = AC.steer(this.heading, S.heading, 3.4 * dt);
      const settled = this.speed < 0.06
        && Math.abs(AC.wrapPi(this.heading - S.heading)) < 0.04;
      if (settled || S.t > cfg.summonDur + 2.5) {
        this.x = S.x; this.y = S.y; this.heading = S.heading;
        this.speed = 0; this.vx = 0; this.vy = 0;
        this.summon = null; this.parked = true;
      }
    }
    this.vx = Math.cos(this.heading) * this.speed;
    this.vy = Math.sin(this.heading) * this.speed;
  }

  /** Take a hit: leave the lane grid and fly. Impulse is in world units/s. */
  knock(vx, vy, spin) {
    if (this.state === 'exploding' || this.state === 'gone') return;
    if (this.state !== 'knocked') { this.kvx = 0; this.kvy = 0; this.spin = 0; }
    this.state = 'knocked';
    this.kvx += vx; this.kvy += vy; this.spin += spin;
    this.knockT = 0;
    this.turning = null;
    this.speed = 0;
  }

  /** Circle-vs-grid overlap, same test the player uses. */
  _hitsWorld(x, y, r) {
    const w = this.w;
    const x0 = Math.floor(x - r), x1 = Math.floor(x + r);
    const y0 = Math.floor(y - r), y1 = Math.floor(y + r);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        if (!w.isSolidAt(cx, cy)) continue;
        const px = Math.max(cx, Math.min(x, cx + 1));
        const py = Math.max(cy, Math.min(y, cy + 1));
        const dx = x - px, dy = y - py;
        if (dx * dx + dy * dy < r * r) return true;
      }
    }
    return false;
  }

  _stepKnocked(dt) {
    const cfg = this.cfg;
    this.knockT += dt;
    const drag = Math.exp(-cfg.knockDrag * dt);
    this.kvx *= drag; this.kvy *= drag;
    this.spin *= Math.exp(-cfg.knockSpinDrag * dt);
    this.heading = AC.wrapPi(this.heading + this.spin * dt);

    // Axis-separated so a car sliding along a wall keeps its other component.
    const r = this.bodyRadius();
    const nx = this.x + this.kvx * dt;
    if (!this._hitsWorld(nx, this.y, r)) this.x = nx;
    else { this.kvx *= -0.35; this.spin *= 0.6; }
    const ny = this.y + this.kvy * dt;
    if (!this._hitsWorld(this.x, ny, r)) this.y = ny;
    else { this.kvy *= -0.35; this.spin *= 0.6; }

    this.vx = this.kvx; this.vy = this.kvy;
    if (this.kvx * this.kvx + this.kvy * this.kvy < 0.12 && this.knockT > 0.4) {
      this._beginRecover();
    }
  }

  /** Rejoin the lane grid from wherever the car came to rest. */
  _beginRecover() {
    const w = this.w, P = w.P, N = w.blocksPerSide;
    const clamp = (v) => Math.max(1, Math.min(N - 2, v));
    let kx = clamp(Math.round((this.x - 1.5) / P));
    let ky = clamp(Math.round((this.y - 1.5) / P));
    if (w.nodeBlocked(kx, ky)) {                 // e.g. thrown into the airport
      let best = null, bd = 1e9;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const tx = clamp(kx + dx), ty = clamp(ky + dy);
          if (w.nodeBlocked(tx, ty)) continue;
          const d = dx * dx + dy * dy;
          if (d < bd) { bd = d; best = [tx, ty]; }
        }
      }
      if (best) { kx = best[0]; ky = best[1]; }
    }
    this.kx = kx; this.ky = ky;
    let bi = 0, bd = -2;
    for (let i = 0; i < 4; i++) {
      const d = Math.cos(this.heading) * AC.DIRS[i][0] + Math.sin(this.heading) * AC.DIRS[i][1];
      if (d > bd) { bd = d; bi = i; }
    }
    this.dirIdx = bi;
    this.state = 'recover';
    this.recoverT = 0;
    this.kvx = 0; this.kvy = 0; this.spin = 0;
  }

  _stepRecover(dt) {
    this.recoverT += dt;
    const p = this.laneStart();
    const want = Math.atan2(AC.DIRS[this.dirIdx][1], AC.DIRS[this.dirIdx][0]);
    const k = Math.min(1, dt * 3);
    this.x += (p.x - this.x) * k;
    this.y += (p.y - this.y) * k;
    this.heading = AC.steer(this.heading, want, dt * 3);
    this.vx = 0; this.vy = 0;
    if (this.recoverT >= this.cfg.knockRecover) {
      this.x = p.x; this.y = p.y; this.heading = want;
      this.state = 'alive'; this.speed = 0;
    }
  }

  /** Still a real car for targeting purposes — a wreck mid-tumble can be shot. */
  get alive() {
    return this.state === 'alive' || this.state === 'knocked' || this.state === 'recover';
  }

  /** One hit. Returns true if it destroyed the car. */
  damage() {
    if (this.state === 'exploding' || this.state === 'gone') return false;
    this.hp--;
    this.hitFlash = 0.16;
    if (this.hp > 0) return false;
    this.state = 'exploding';
    this.boomT = 0;
    this.blastDone = false;      // blast damage is applied once, by Traffic
    this.speed = 0;
    this.turning = null;
    this.w.stainScorch(this.x, this.y, 1.9, 210);
    return true;
  }

  static spawn(world, cfg, rng) {
    const c = new Car(world, cfg, rng);
    const N = world.blocksPerSide;
    c.dirIdx = rng.int(0, 3);
    // Never spawn inside a hole in the road grid, and never facing into one.
    for (let tries = 0; tries < 60; tries++) {
      c.kx = rng.int(1, Math.max(1, N - 2));
      c.ky = rng.int(1, Math.max(1, N - 2));
      const d = AC.DIRS[c.dirIdx];
      if (!world.nodeBlocked(c.kx, c.ky)
        && !world.nodeBlocked(c.kx + d[0], c.ky + d[1])) break;
    }
    const p = c.laneStart();
    c.x = p.x; c.y = p.y;
    c.heading = Math.atan2(AC.DIRS[c.dirIdx][1], AC.DIRS[c.dirIdx][0]);
    return c;
  }

  dir() { return AC.DIRS[this.dirIdx]; }
  right(d) { return [d[1], -d[0]]; }

  /** Lane point at the current node, offset right of the corridor centreline. */
  laneStart() {
    const d = this.dir(), r = this.right(d);
    const cx = this.w.corridorCentre(this.kx), cy = this.w.corridorCentre(this.ky);
    return { x: cx + r[0] * AC.LANE, y: cy + r[1] * AC.LANE };
  }

  nodeCentre(kx, ky) {
    return { x: this.w.corridorCentre(kx), y: this.w.corridorCentre(ky) };
  }

  /** Next node index pair in the current direction. */
  nextNode() {
    const d = this.dir();
    return { kx: this.kx + d[0], ky: this.ky + d[1] };
  }

  chooseDir(nkx, nky) {
    const N = this.w.blocksPerSide;
    const opts = [];
    for (let t = 0; t < 4; t++) {
      if (t === (this.dirIdx + 2) % 4) continue;              // no U-turn
      const d = AC.DIRS[t];
      const tx = nkx + d[0], ty = nky + d[1];
      if (tx < 1 || ty < 1 || tx > N - 2 || ty > N - 2) continue;
      if (this.w.nodeBlocked(tx, ty)) continue;      // e.g. the airport
      opts.push({ t, w: t === this.dirIdx ? 0.62 : 0.19 });
    }
    if (!opts.length) return (this.dirIdx + 2) % 4;
    let sum = 0; for (const o of opts) sum += o.w;
    let r = this.rng.next() * sum;
    for (const o of opts) { r -= o.w; if (r <= 0) return o.t; }
    return opts[opts.length - 1].t;
  }

  beginTurn(nkx, nky, newIdx) {
    const d = this.dir(), nd = AC.DIRS[newIdx];
    const r = this.right(d), nr = this.right(nd);
    const c = this.nodeCentre(nkx, nky);
    const half = this.cfg.roadWidth / 2 + 0.35;
    const ex = c.x - d[0] * half + r[0] * AC.LANE;
    const ey = c.y - d[1] * half + r[1] * AC.LANE;
    const xx = c.x + nd[0] * half + nr[0] * AC.LANE;
    const xy = c.y + nd[1] * half + nr[1] * AC.LANE;
    const t = (xx - ex) * d[0] + (xy - ey) * d[1];
    const cpx = ex + d[0] * t, cpy = ey + d[1] * t;
    const len = Math.hypot(cpx - ex, cpy - ey) + Math.hypot(xx - cpx, xy - cpy);
    this.turning = {
      ex, ey, cpx, cpy, xx, xy, newIdx, nkx, nky,
      len: Math.max(0.5, len * 0.92), t: 0,
    };
  }

  step(dt, traffic) {
    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.state === 'knocked') { this._stepKnocked(dt); return; }
    if (this.state === 'recover') { this._stepRecover(dt); return; }
    if (this.state === 'exploding' || this.state === 'gone') {
      this.boomT += dt;
      this.vx = 0; this.vy = 0;
      if (this.boomT >= this.cfg.carExplodeTime) this.state = 'gone';
      return;
    }
    if (this.summon) { this._stepSummon(dt); return; }
    if (this.playerDriven || this.parked) return;

    // Longitudinal control: match target speed, back off behind a car ahead.
    const d = this.dir();
    let cap = this.target;
    if (traffic) {
      const gap = traffic.gapAhead(this);
      if (gap < 3.4) cap = Math.min(cap, Math.max(0, (gap - 0.9) * 1.5));
    }
    if (this.turning) cap = Math.min(cap, this.target * 0.55);

    // Traffic signal for the intersection we are approaching. Evaluated before
    // the move so the braking curve is applied on the way in, not after.
    if (!this.turning && traffic) {
      const N = this.w.blocksPerSide;
      const n = this.nextNode();
      if (n.kx >= 1 && n.ky >= 1 && n.kx <= N - 2 && n.ky <= N - 2) {
        const axis = (this.dirIdx & 1) === 0 ? 0 : 1;
        if (traffic.signal(n.kx, n.ky, axis) !== AC.SIGNAL.GREEN) {
          const c = this.nodeCentre(n.kx, n.ky);
          const along = (c.x - this.x) * d[0] + (c.y - this.y) * d[1];
          const stopDist = along - (this.cfg.roadWidth / 2 + 0.35) - 0.30;
          // Past the line already: too late to stop, so clear the junction.
          // Otherwise cap speed at whatever still allows a stop at the line —
          // and clamp to zero once we are on it, or the car creeps through.
          if (stopDist > -0.10) {
            const vmax = stopDist <= 0 ? 0 : Math.sqrt(2 * this.cfg.carBrake * stopDist);
            if (vmax < cap) cap = vmax;
          }
        }
      }
    }

    const a = this.speed < cap ? this.cfg.carAccel : -this.cfg.carBrake;
    this.speed += a * dt;
    if (this.speed < 0) this.speed = 0;
    if (this.speed > cap) this.speed = cap;

    if (this.turning) {
      const T = this.turning;
      T.t += (this.speed * dt) / T.len;
      if (T.t >= 1) {
        this.x = T.xx; this.y = T.xy;
        this.dirIdx = T.newIdx;
        this.kx = T.nkx; this.ky = T.nky;
        this.heading = Math.atan2(AC.DIRS[this.dirIdx][1], AC.DIRS[this.dirIdx][0]);
        this.turning = null;
      } else {
        const t = T.t, it = 1 - t;
        const px = it * it * T.ex + 2 * it * t * T.cpx + t * t * T.xx;
        const py = it * it * T.ey + 2 * it * t * T.cpy + t * t * T.xy;
        const tx = 2 * it * (T.cpx - T.ex) + 2 * t * (T.xx - T.cpx);
        const ty = 2 * it * (T.cpy - T.ey) + 2 * t * (T.xy - T.cpy);
        this.x = px; this.y = py;
        this.heading = Math.atan2(ty, tx);
      }
      this.vx = Math.cos(this.heading) * this.speed;
      this.vy = Math.sin(this.heading) * this.speed;
      return;
    }

    this.x += d[0] * this.speed * dt;
    this.y += d[1] * this.speed * dt;
    this.vx = d[0] * this.speed;
    this.vy = d[1] * this.speed;

    // Approaching the next intersection?
    const n = this.nextNode();
    const N = this.w.blocksPerSide;
    if (n.kx < 1 || n.ky < 1 || n.kx > N - 2 || n.ky > N - 2) {
      // Dead end at the rim: force a turn at the node we are on.
      const alt = this.chooseDir(this.kx, this.ky);
      if (alt !== this.dirIdx) this.beginTurn(this.kx, this.ky, alt);
      else { this.dirIdx = (this.dirIdx + 1) % 4; }
      return;
    }
    const c = this.nodeCentre(n.kx, n.ky);
    const half = this.cfg.roadWidth / 2 + 0.35;
    const along = (c.x - this.x) * d[0] + (c.y - this.y) * d[1];
    if (along <= half) {
      const nd = this.chooseDir(n.kx, n.ky);
      if (nd === this.dirIdx) { this.kx = n.kx; this.ky = n.ky; }
      else this.beginTurn(n.kx, n.ky, nd);
    }
  }
};

AC.Ped = class Ped {
  constructor(world, cfg, rng) {
    this.w = world; this.cfg = cfg;
    this.rng = new AC.Rng(rng.int(1, 0x7ffffffe));
    const N = world.blocksPerSide;
    this.bx = rng.int(0, Math.max(0, N - 1));
    this.by = rng.int(0, Math.max(0, N - 1));
    this.side = rng.int(0, 3);
    this.t = rng.next();
    this.dir = rng.chance(0.5) ? 1 : -1;
    this.speed = cfg.pedSpeed * this.rng.range(0.7, 1.35);
    this.base = AC.PAL.PED;
    this.width = 0.34;
    this.height = 0.56;
    this.cross = null;
    this.phase = this.rng.next() * Math.PI * 2;
    const p = this.pos();
    this.x = p.x; this.y = p.y;

    // Combat state. 'alive' -> 'dying' -> 'gone'.
    this.state = 'alive';
    this.deadT = 0;
    this._bloodStep = -1;
  }

  get alive() { return this.state === 'alive'; }

  kill() {
    if (this.state !== 'alive') return false;
    this.state = 'dying';
    this.deadT = 0;
    this.cross = null;
    return true;
  }

  /** 0 while upright, 1 once fully collapsed. */
  get fallT() {
    const f = this.deadT / this.cfg.pedFallTime;
    return f < 0 ? 0 : (f > 1 ? 1 : f);
  }

  /** Fade weight for the last moments before removal. */
  get fadeT() {
    const cfg = this.cfg;
    const start = cfg.pedFallTime + cfg.pedBleedTime;
    if (this.deadT <= start) return 0;
    const f = (this.deadT - start) / cfg.pedFadeTime;
    return f > 1 ? 1 : f;
  }

  _stepDying(dt) {
    const cfg = this.cfg;
    this.deadT += dt;

    // Grow the pool in discrete stamps rather than every tick: 6 per second is
    // indistinguishable visually and keeps this off the per-frame budget.
    const bleedEnd = cfg.pedFallTime + cfg.pedBleedTime;
    if (this.deadT > cfg.pedFallTime * 0.6 && this.deadT < bleedEnd) {
      const k = Math.floor((this.deadT - cfg.pedFallTime * 0.6) * 6);
      if (k > this._bloodStep) {
        this._bloodStep = k;
        this.w.stainBlood(this.x, this.y, 0.30 + k * 0.075, 46);
      }
    }
    if (this.deadT >= bleedEnd + cfg.pedFadeTime) this.state = 'gone';
  }

  ring(bx, by) {
    // Asked of the world rather than computed from the pitch: street widths
    // vary, so where the kerb is depends on which street it is.
    const w = this.w;
    return {
      x0: w.sideLo(bx, 0), y0: w.sideLo(by, 1),
      x1: w.sideHi(bx, 0), y1: w.sideHi(by, 1),
    };
  }

  pos(bx, by, side, t) {
    bx = bx === undefined ? this.bx : bx;
    by = by === undefined ? this.by : by;
    side = side === undefined ? this.side : side;
    t = t === undefined ? this.t : t;
    const r = this.ring(bx, by);
    const L = r.x1 - r.x0;
    switch (side) {
      case 0: return { x: r.x0 + t * L, y: r.y0 };
      case 1: return { x: r.x1, y: r.y0 + t * L };
      case 2: return { x: r.x1 - t * L, y: r.y1 };
      default: return { x: r.x0, y: r.y1 - t * L };
    }
  }

  step(dt) {
    if (this.state !== 'alive') { this._stepDying(dt); return; }
    if (this.cross) {
      const C = this.cross;
      C.t += (this.speed * dt) / C.len;
      if (C.t >= 1) {
        this.bx = C.bx; this.by = C.by; this.side = C.side; this.t = C.tt;
        const p = this.pos();
        this.x = p.x; this.y = p.y;
        this.cross = null;
      } else {
        this.x = C.sx + (C.ex - C.sx) * C.t;
        this.y = C.sy + (C.ey - C.sy) * C.t;
      }
      this.phase += dt * 6;
      return;
    }

    const r = this.ring(this.bx, this.by);
    const L = r.x1 - r.x0;
    this.t += this.dir * (this.speed * dt) / L;
    while (this.t >= 1) { this.t -= 1; this.side = (this.side + 1) & 3; }
    while (this.t < 0) { this.t += 1; this.side = (this.side + 3) & 3; }
    const p = this.pos();
    this.x = p.x; this.y = p.y;
    this.phase += dt * 5.5;

    if (this.rng.next() < 0.0022) this._beginCross();
    else if (this.rng.next() < 0.0007) this.dir = -this.dir;
  }

  _beginCross() {
    const N = this.w.blocksPerSide;
    const out = [[0, -1], [1, 0], [0, 1], [-1, 0]][this.side];
    const bx = this.bx + out[0], by = this.by + out[1];
    if (bx < 0 || by < 0 || bx > N - 1 || by > N - 1) return;
    const side = (this.side + 2) & 3;
    const tt = 1 - this.t;
    const to = this.pos(bx, by, side, tt);
    const len = Math.hypot(to.x - this.x, to.y - this.y);
    if (len < 0.01 || len > 12) return;
    this.cross = {
      sx: this.x, sy: this.y, ex: to.x, ey: to.y,
      bx, by, side, tt, len, t: 0,
    };
  }
};

/** Owns the entity pools and the fixed-step advance. */
AC.SIGNAL = { GREEN: 0, YELLOW: 1, RED: 2 };

/** Impact sparks. A fixed pool of ballistic points with a short life, drawn as
 *  single glyphs. Spread comes from the position hash rather than an RNG
 *  stream, so bursts cost nothing and cannot desynchronise anything. */
AC.Sparks = class Sparks {
  constructor(cfg) {
    this.cfg = cfg;
    this.n = 0;
    const N = cfg.sparkMax;
    this.x = new Float32Array(N); this.y = new Float32Array(N); this.z = new Float32Array(N);
    this.vx = new Float32Array(N); this.vy = new Float32Array(N); this.vz = new Float32Array(N);
    this.t = new Float32Array(N);
  }

  burst(x, y, z, nx, ny, power, salt) {
    const cfg = this.cfg;
    const count = Math.min(cfg.sparkCount, cfg.sparkMax - this.n);
    for (let i = 0; i < count; i++) {
      const h = AC.hash2((x * 64) | 0, ((y * 64) | 0) + i * 37, salt + i);
      const a = ((h & 1023) / 1023) * Math.PI * 2;
      const sp = cfg.sparkSpeed * (0.35 + ((h >>> 10) & 255) / 255) * (0.4 + power * 0.5);
      const up = 1.2 + ((h >>> 18) & 127) / 127 * 2.6;
      const k = this.n++;
      this.x[k] = x; this.y[k] = y; this.z[k] = z;
      // Biased along the contact normal so the shower comes off the impact.
      this.vx[k] = Math.cos(a) * sp * 0.6 + nx * sp * 0.9;
      this.vy[k] = Math.sin(a) * sp * 0.6 + ny * sp * 0.9;
      this.vz[k] = up;
      this.t[k] = 0;
    }
  }

  step(dt) {
    const cfg = this.cfg;
    let w = 0;
    for (let i = 0; i < this.n; i++) {
      const t = this.t[i] + dt;
      if (t >= cfg.sparkLife) continue;
      let z = this.z[i] + this.vz[i] * dt;
      let vz = this.vz[i] - cfg.sparkGravity * dt;
      if (z < 0.05) { z = 0.05; vz = -vz * 0.32; }      // bounce off the road
      this.x[w] = this.x[i] + this.vx[i] * dt;
      this.y[w] = this.y[i] + this.vy[i] * dt;
      this.z[w] = z;
      this.vx[w] = this.vx[i] * (1 - dt * 1.4);
      this.vy[w] = this.vy[i] * (1 - dt * 1.4);
      this.vz[w] = vz;
      this.t[w] = t;
      w++;
    }
    this.n = w;
  }
};

/** Uniform bucket grid over the map, rebuilt once per simulation step.
 *
 *  gapAhead used to test every car against every other car. That is fine at a
 *  couple of hundred vehicles and quadratic at a couple of thousand, and the
 *  city needed the couple of thousand. Counting sort into flat typed arrays:
 *  no per-bucket array objects, no allocation per step, and the only clear is
 *  a memset of the count table.
 *
 *  Bucket size is deliberately larger than any query radius, so a query only
 *  ever has to visit the 3x3 neighbourhood around its own bucket.
 */
AC.Buckets = class Buckets {
  constructor(size, cell) {
    this.cell = cell;
    this.n = Math.max(1, Math.ceil(size / cell));
    this.count = new Int32Array(this.n * this.n + 1);
    this.start = new Int32Array(this.n * this.n + 1);
    this.items = new Int32Array(0);
  }

  /** Index of the bucket containing a world position, clamped to the grid. */
  at(x, y) {
    const n = this.n;
    let bx = (x / this.cell) | 0, by = (y / this.cell) | 0;
    if (bx < 0) bx = 0; else if (bx >= n) bx = n - 1;
    if (by < 0) by = 0; else if (by >= n) by = n - 1;
    return by * n + bx;
  }

  build(list) {
    const nb = this.n * this.n;
    const count = this.count, start = this.start;
    count.fill(0);
    for (let i = 0; i < list.length; i++) count[this.at(list[i].x, list[i].y)]++;
    let acc = 0;
    for (let b = 0; b < nb; b++) { start[b] = acc; acc += count[b]; }
    start[nb] = acc;
    if (this.items.length < acc) this.items = new Int32Array(acc + 256);
    const cur = count;                      // reused as the write cursor
    for (let b = 0; b < nb; b++) cur[b] = start[b];
    for (let i = 0; i < list.length; i++) {
      this.items[cur[this.at(list[i].x, list[i].y)]++] = i;
    }
  }

  /** Call `fn(index)` for every member of the 3x3 neighbourhood of (x, y). */
  near(x, y, fn) {
    const n = this.n, c = this.cell;
    let bx = (x / c) | 0, by = (y / c) | 0;
    if (bx < 0) bx = 0; else if (bx >= n) bx = n - 1;
    if (by < 0) by = 0; else if (by >= n) by = n - 1;
    const x0 = bx > 0 ? bx - 1 : 0, x1 = bx < n - 1 ? bx + 1 : n - 1;
    const y0 = by > 0 ? by - 1 : 0, y1 = by < n - 1 ? by + 1 : n - 1;
    const items = this.items, start = this.start;
    for (let yy = y0; yy <= y1; yy++) {
      const row = yy * n;
      for (let xx = x0; xx <= x1; xx++) {
        const b = row + xx;
        for (let k = start[b], e = start[b + 1]; k < e; k++) fn(items[k]);
      }
    }
  }
};

AC.Traffic = class Traffic {
  constructor(world, cfg, rng) {
    this.w = world; this.cfg = cfg;
    // Set by Game once the player exists. Null in the headless self-test, which
    // is what keeps AC.selfTest() free of any player dependency.
    this.player = null;
    const cr = rng.fork('cars');
    const pr = rng.fork('peds');
    this.cars = [];
    for (let i = 0; i < cfg.carCount; i++) this.cars.push(AC.Car.spawn(world, cfg, cr));
    this.peds = [];
    for (let i = 0; i < cfg.pedCount; i++) this.peds.push(new AC.Ped(world, cfg, pr));
    // The sky steps from here so there is one simulation entry point and the
    // headless self-test covers it too.
    this.air = new AC.Airspace(world, cfg, rng);
    this.sea = new AC.Sea(world, cfg, rng);
    this.sparks = new AC.Sparks(cfg);
    this.respawnRng = rng.fork('respawn');
    this.steps = 0;
    // 6 units a side: comfortably wider than the widest gapAhead query, so a
    // 3x3 neighbourhood always contains everything a car can see.
    this.carGrid = new AC.Buckets(world.size, 6);
    this.pedGrid = new AC.Buckets(world.size, 6);
    this.carGrid.build(this.cars);
    this.pedGrid.build(this.peds);
  }

  /** Signal state for traffic crossing intersection (kx, ky) on `axis`
   *  (0 = travelling along X, 1 = along Y).
   *
   *  A pure function of simulation time and the node index — no stored state,
   *  no RNG, so it costs nothing to add and cannot break reproducibility. */
  signal(kx, ky, axis) {
    const cfg = this.cfg;
    const G = cfg.signalGreen, Y = cfg.signalYellow, R = cfg.signalAllRed;
    const phase = G + Y + R;
    const cycle = phase * 2;
    const t = this.steps * cfg.fixedDt;
    const off = AC.hash2f(kx, ky, 0x51A7) * cycle;
    let v = (t + off - (axis === 0 ? 0 : phase)) % cycle;
    if (v < 0) v += cycle;
    if (v < G) return AC.SIGNAL.GREEN;
    if (v < G + Y) return AC.SIGNAL.YELLOW;
    return AC.SIGNAL.RED;
  }

  /** Distance to the nearest obstacle ahead in the same lane, or Infinity.
   *  Cars, the player on foot, and any pedestrian actually in the road. */
  gapAhead(car) {
    const d = car.turning
      ? [Math.cos(car.heading), Math.sin(car.heading)]
      : car.dir();
    const rx = d[1], ry = -d[0];
    let best = Infinity;
    const cars = this.cars;
    const cx = car.x, cy = car.y;
    const d0 = d[0], d1 = d[1];
    this.carGrid.near(cx, cy, (i) => {
      const o = cars[i];
      if (o === car || o.state === 'gone') return;
      const dx = o.x - cx, dy = o.y - cy;
      if (dx * dx + dy * dy > 16) return;
      const along = dx * d0 + dy * d1;
      if (along <= 0.2) return;
      const lat = dx * rx + dy * ry;
      if (lat < -0.75 || lat > 0.75) return;
      if (along < best) best = along;
    });

    // The player on foot is an obstacle like any other — this is what stops
    // cars driving through you.
    const p = this.player;
    if (p && p.mode === 'walk') {
      const dx = p.x - car.x, dy = p.y - car.y;
      if (dx * dx + dy * dy <= 30) {
        const along = dx * d[0] + dy * d[1];
        const lat = dx * rx + dy * ry;
        if (along > 0.2 && lat > -0.95 && lat < 0.95 && along < best) best = along;
      }
    }

    // Only pedestrians who are actually crossing can be in the carriageway, so
    // this stays a handful of tests rather than cars x pedestrians.
    const peds = this.peds;
    this.pedGrid.near(cx, cy, (i) => {
      const q = peds[i];
      if (q.state !== 'alive' || !q.cross) return;
      const dx = q.x - cx, dy = q.y - cy;
      if (dx * dx + dy * dy > 30) return;
      const along = dx * d0 + dy * d1;
      if (along <= 0.2) return;
      const lat = dx * rx + dy * ry;
      if (lat < -0.95 || lat > 0.95) return;
      if (along < best) best = along;
    });
    return best;
  }

  /** Hazards that hurt the player: blast radius, and being run down on foot.
   *
   *  Blast falls off linearly to zero at `blastRadiusM`, which is expressed in
   *  metres because that is how the requirement reads — converted here rather
   *  than baking the world-unit number into config, so the two cannot drift. */
  _playerHazards() {
    const p = this.player;
    if (!p || p.dead) return;
    const cfg = this.cfg;
    const cars = this.cars;

    for (let i = 0; i < cars.length; i++) {
      const c = cars[i];
      if (c.state !== 'exploding' || c.blastDone) continue;
      c.blastDone = true;
      const R = cfg.blastRadiusM / AC.METRES_PER_UNIT;
      const d = Math.hypot(c.x - p.x, c.y - p.y);
      if (d < R) p.hurt(cfg.blastDamageMax * (1 - d / R), false);
    }

    if (p.mode !== 'walk') return;
    const mine = p.trans ? p.trans.car : null;
    for (let i = 0; i < cars.length; i++) {
      const c = cars[i];
      if (c.state === 'gone' || c.state === 'exploding') continue;
      // Friendly vehicles never run you over: the one you are climbing out of,
      // the one you are climbing into, and the one you just whistled up. All
      // three are scripted to be exactly where you are, so treating them as
      // hostile traffic meant the game punished you for its own cutscenes.
      if (c === mine || c === p.car || c.summon || c.parked || c.playerDriven) continue;
      const vx = c.vx || 0, vy = c.vy || 0;
      if (vx * vx + vy * vy < 0.36) continue;      // stationary cars do not hurt
      const R = c.bodyRadius() + cfg.playerRadius, R2 = R * R;
      const dx = c.x - p.x, dy = c.y - p.y;
      if (dx * dx + dy * dy < R2) { p.hurt(cfg.damageCarOnFoot); break; }
    }
  }

  /** The player's car kills whatever it drives into. Deliberately limited to
   *  the player: letting AI traffic do this too would quietly depopulate the
   *  city, since pedestrians cross mid-block by design. AI cars brake for them
   *  instead, via gapAhead. */
  _runOver() {
    const p = this.player;
    if (!p || p.mode !== 'drive' || !p.car) return;
    const car = p.car;
    if (car.state !== 'alive') return;
    if (Math.abs(car.speed) < this.cfg.runOverSpeed) return;
    const R = car.bodyRadius() + 0.24;
    const R2 = R * R;
    const peds = this.peds;
    for (let i = 0; i < peds.length; i++) {
      const q = peds[i];
      if (q.state !== 'alive') continue;
      const dx = q.x - car.x, dy = q.y - car.y;
      if (dx * dx + dy * dy > R2) continue;
      if (q.kill()) {
        p.kills++;
        this.w.stainBlood(q.x, q.y, 0.55, 90);
        // A body under the wheels is a buzz, not a wallop.
        p.addRumble(this.cfg.rumbleOnPed);
        p.addShake(this.cfg.shakeOnPed);
      }
    }
  }

  step(dt) {
    // Index BEFORE anything moves, so every car sees the same snapshot of the
    // world within one step — a grid rebuilt mid-loop would make the answer
    // depend on iteration order, which is exactly what determinism forbids.
    const cars = this.cars;
    this.carGrid.build(cars);
    this.pedGrid.build(this.peds);
    for (let i = 0; i < cars.length; i++) cars[i].step(dt, this);
    const peds = this.peds;
    for (let i = 0; i < peds.length; i++) peds[i].step(dt);
    this.air.step(dt);
    this.sea.step(dt);
    this.sparks.step(dt);
    this._runOver();
    this._playerHazards();
    this.steps++;
    if ((this.steps & 15) === 0) this.reap();
  }

  /** Drop finished wrecks and bodies. Compacts in place rather than
   *  allocating, since this runs inside the simulation step. */
  reap() {
    let w = 0;
    for (let i = 0; i < this.cars.length; i++) {
      if (this.cars[i].state !== 'gone') this.cars[w++] = this.cars[i];
    }
    this.cars.length = w;
    w = 0;
    for (let i = 0; i < this.peds.length; i++) {
      if (this.peds[i].state !== 'gone') this.peds[w++] = this.peds[i];
    }
    this.peds.length = w;

    const cfg = this.cfg;
    while (this.cars.length < cfg.carCount) {
      this.cars.push(AC.Car.spawn(this.w, cfg, this.respawnRng));
    }
    while (this.peds.length < cfg.pedCount) {
      this.peds.push(new AC.Ped(this.w, cfg, this.respawnRng));
    }
    // The lists just changed shape; the indices in the buckets no longer point
    // at the same entities. Rebuild rather than let a stale index through.
    if (this.carGrid) { this.carGrid.build(this.cars); this.pedGrid.build(this.peds); }
  }

  /** Deterministic digest of entity state, for the reproducibility test. */
  hash() {
    let h = 0x811C9DC5 >>> 0;
    const mix = (v) => { h ^= (v | 0) >>> 0; h = Math.imul(h, 0x01000193) >>> 0; };
    for (const c of this.cars) {
      mix(Math.round(c.x * 4096)); mix(Math.round(c.y * 4096));
      mix(c.dirIdx); mix(Math.round(c.speed * 4096));
    }
    for (const p of this.peds) {
      mix(Math.round(p.x * 4096)); mix(Math.round(p.y * 4096)); mix(p.side);
    }
    mix(this.air.hash());
    mix(this.sea.hash());
    return h >>> 0;
  }
};


/* ===== src/05b_air.js ================================================ */
// ---------------------------------------------------------------------------
// air.js — everything above street level: helicopters.
//
// Filename note: this sorts between 05_entities and 06_player, which is exactly
// where it belongs in the build's dependency order. See docs/ARCHITECTURE.md.
//
// Pure simulation, same contract as entities.js: fixed timestep, per-entity
// mulberry32 streams seeded at construction, no DOM, no wall-clock. Airspace is
// stepped from Traffic.step so there is one simulation entry point and
// AC.selfTest() covers the sky as well as the street.
//
// Helicopters navigate by waypoint rather than by physics. Their pads are a
// property of the airport's geometry and are built in World._airport, so the
// field is defined in exactly one place.
// ---------------------------------------------------------------------------

/** Wrap to (-PI, PI]. */
AC.wrapPi = function (a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
};

/** Steer `heading` toward `want`, no faster than `rate` radians. */
AC.steer = function (heading, want, rate) {
  const d = AC.wrapPi(want - heading);
  if (d > rate) return heading + rate;
  if (d < -rate) return heading - rate;
  return want;
};

// ---------------------------------------------------------------------------
// Helicopter
// ---------------------------------------------------------------------------

AC.Helicopter = class Helicopter {
  constructor(world, cfg, rng, idx) {
    this.w = world; this.cfg = cfg;
    this.rng = new AC.Rng(rng.int(1, 0x7ffffffe));
    const A = world.airport;
    this.pad = A.pads[idx % A.pads.length];
    this.x = this.pad.x; this.y = this.pad.y; this.z = 0.2;
    this.heading = this.rng.range(-Math.PI, Math.PI);
    this.speed = 0;
    this.state = 'idle';
    this.timer = this.rng.range(1, cfg.heliIdleTime);
    this.legs = 0;
    this.rotor = this.rng.next() * 6.283;
    this.blink = this.rng.next() * 3;
    this.target = { x: this.x, y: this.y };
    this.base = AC.PAL.CONCRETE;   // asphalt was invisible against night sky
    this.kindTag = 'heli';
  }

  get alive() { return false; }

  _pickTarget() {
    const S = this.w.size;
    this.target = {
      x: this.rng.range(S * 0.25, S * 0.85),
      y: this.rng.range(S * 0.25, S * 0.85),
    };
  }

  step(dt) {
    const cfg = this.cfg;
    this.rotor += dt * 26;
    this.blink += dt;

    switch (this.state) {
      case 'idle':
        this.timer -= dt;
        this.speed = 0;
        if (this.timer <= 0) { this.state = 'up'; this.legs = this.rng.int(2, 4); }
        break;

      case 'up':
        this.z += cfg.heliClimb * dt;
        if (this.z >= cfg.heliCruiseZ) { this.z = cfg.heliCruiseZ; this.state = 'cruise'; this._pickTarget(); }
        break;

      case 'cruise':
      case 'home': {
        const t = this.state === 'home' ? this.pad : this.target;
        const dx = t.x - this.x, dy = t.y - this.y;
        this.heading = AC.steer(this.heading, Math.atan2(dy, dx), cfg.heliTurnRate * dt);
        const d = Math.hypot(dx, dy);
        // Ease off on approach so it settles rather than overshooting.
        const want = cfg.heliSpeed * Math.min(1, d / 6);
        this.speed += (want - this.speed) * Math.min(1, dt * 1.4);
        this.x += Math.cos(this.heading) * this.speed * dt;
        this.y += Math.sin(this.heading) * this.speed * dt;
        if (d < 2.0) {
          if (this.state === 'home') this.state = 'down';
          else if (--this.legs <= 0) this.state = 'home';
          else this._pickTarget();
        }
        break;
      }

      case 'down':
        this.speed *= (1 - dt * 3);
        this.x += (this.pad.x - this.x) * Math.min(1, dt * 2);
        this.y += (this.pad.y - this.y) * Math.min(1, dt * 2);
        this.z -= cfg.heliClimb * dt;
        if (this.z <= 0.2) {
          this.z = 0.2; this.state = 'idle';
          this.timer = cfg.heliIdleTime * this.rng.range(0.6, 1.5);
        }
        break;
    }
  }
};

// ---------------------------------------------------------------------------

AC.Airspace = class Airspace {
  constructor(world, cfg, rng) {
    this.w = world; this.cfg = cfg;
    const r = rng.fork('airspace');
    this.helis = [];
    for (let i = 0; i < cfg.heliCount; i++) this.helis.push(new AC.Helicopter(world, cfg, r, i));
  }

  step(dt) {
    for (let i = 0; i < this.helis.length; i++) this.helis[i].step(dt);
  }

  hash() {
    let h = 0x811C9DC5 >>> 0;
    const mix = (v) => { h ^= (v | 0) >>> 0; h = Math.imul(h, 0x01000193) >>> 0; };
    const p3 = (e) => {
      mix(Math.round(e.x * 2048)); mix(Math.round(e.y * 2048)); mix(Math.round(e.z * 2048));
    };
    for (const c of this.helis) { p3(c); mix(c.state.length); mix(c.legs); }
    return h >>> 0;
  }
};


/* ===== src/05c_sea.js ================================================ */
// ---------------------------------------------------------------------------
// sea.js — boats.
//
// Same shape as the airspace: waypoint navigation rather than physics, and a
// wake sampled on a timer so its length is a duration rather than a frame
// count. The route is a ring around the island derived from the shoreline, so
// it stays correct if the island's radius or its noise ever change.
// ---------------------------------------------------------------------------

AC.Boat = class Boat {
  constructor(world, cfg, rng, idx, count) {
    this.w = world; this.cfg = cfg;
    this.rng = new AC.Rng(rng.int(1, 0x7ffffffe));
    this.kindTag = 'boat';
    this.z = 0.02;                     // sits on the water, not in it

    // Each boat gets its own ring: different radius, different direction,
    // different speed. Boats sharing one track look like a convoy, which is
    // the mistake the aircraft made.
    // Distance OFFSHORE, not radius from the centre: the island is not a
    // circle, and a circular ring of the wrong size beaches half the fleet on
    // the diagonals where the shoreline metric is smallest.
    this.off = 26 + this.rng.range(0, 150);
    this.dir = (idx & 1) ? 1 : -1;
    this.omega = (0.008 + this.rng.range(0, 0.010)) * this.dir;
    this.th = (idx / Math.max(1, count)) * Math.PI * 2 + this.rng.range(0, 0.9);
    this.big = (idx % 3) === 0;
    this.base = this.big ? AC.PAL.CAR_W
      : [AC.PAL.CAR_R, AC.PAL.CAR_B, AC.PAL.CAR_G][idx % 3];
    this.bob = this.rng.next() * 6.283;
    this.wake = [];
    this.wakeT = 0;
    this.heading = 0;
    this.speed = 0;
    this._place();
  }

  get alive() { return false; }

  _place() {
    const c = (this.w.size - 1) / 2;
    const r = this.w.seaRadius(this.th, this.off);
    this.x = c + Math.cos(this.th) * r;
    this.y = c + Math.sin(this.th) * r;
  }

  step(dt) {
    const cfg = this.cfg;
    const px = this.x, py = this.y;
    this.th += this.omega * dt;
    this._place();
    const dx = this.x - px, dy = this.y - py;
    this.speed = Math.hypot(dx, dy) / Math.max(1e-5, dt);
    if (dx || dy) this.heading = Math.atan2(dy, dx);
    this.bob += dt * 1.4;
    // A little heave, so a boat on a flat sea still reads as afloat.
    this.z = 0.02 + Math.sin(this.bob) * 0.10;

    this.wakeT += dt;
    if (this.wakeT >= cfg.wakeInterval) {
      this.wakeT = 0;
      this.wake.push(this.x, this.y);
      while (this.wake.length > cfg.wakeLen * 2) this.wake.splice(0, 2);
    }
  }
};

AC.Sea = class Sea {
  constructor(world, cfg, rng) {
    this.w = world; this.cfg = cfg;
    const r = rng.fork('sea');
    this.boats = [];
    for (let i = 0; i < cfg.boatCount; i++) {
      this.boats.push(new AC.Boat(world, cfg, r, i, cfg.boatCount));
    }
    // The rides run on their own clocks. They are world furniture rather than
    // entities: nothing collides with them and nothing shoots them, so they
    // carry a phase and nothing else.
    this.wheelAngle = 0;
    this.coasterU = world.funfair ? world.funfair.coaster.phase : 0;
  }

  step(dt) {
    const cfg = this.cfg;
    for (let i = 0; i < this.boats.length; i++) this.boats[i].step(dt);
    this.wheelAngle = (this.wheelAngle + cfg.wheelSpeed * dt) % (Math.PI * 2);
    // The train runs faster downhill and labours up the lift, which is most of
    // what makes a coaster read as a coaster rather than as a moving dot.
    const C = this.w.funfair && this.w.funfair.coaster;
    if (C) {
      const slope = Math.sin(this.coasterU * Math.PI * 2);
      const rate = cfg.coasterSpeed * (0.45 + 0.85 * (0.5 - 0.5 * slope));
      this.coasterU = (this.coasterU + rate * dt) % 1;
    }
  }

  hash() {
    let h = 0x811C9DC5 >>> 0;
    const mix = (v) => { h ^= (v | 0) >>> 0; h = Math.imul(h, 0x01000193) >>> 0; };
    for (const b of this.boats) {
      mix(Math.round(b.x * 2048)); mix(Math.round(b.y * 2048));
    }
    mix(Math.round(this.wheelAngle * 4096));
    mix(Math.round(this.coasterU * 65536));
    return h >>> 0;
  }
};


/* ===== src/06_player.js ============================================== */
// ---------------------------------------------------------------------------
// player.js — input, camera, ground collision, and the walk/drive modes.
//
// The player is simulated on the same fixed dt as traffic. Mouse look is the
// one exception: it is sampled per frame and applied directly, because latency
// there is far more noticeable than determinism is valuable.
// ---------------------------------------------------------------------------

AC.Input = class Input {
  constructor(target) {
    this.keys = new Set();
    this.dx = 0; this.dy = 0;
    this.locked = false;
    this.lockFailed = false;
    this.everLocked = false;
    this.dismissed = false;
    this.dragging = false;
    this.lastX = 0; this.lastY = 0;
    this.downX = 0; this.downY = 0;
    this.fire = false;             // consumed once per frame by Game
    this.aimDown = false;          // right button held: aim down sights
    this.rightHit = false;         // right button pressed this frame
    this.clickHit = false;         // left button pressed this frame, locked or not
    this.lockReleased = false;     // pointer lock was given up since last frame
    this.pointerX = 0; this.pointerY = 0;   // absolute, for the unlocked map cursor
    this.pressed = new Set();
    // Rolling record of the letters typed, for cheat codes. Kept here rather
    // than in Game so that a code is recognised from the raw key stream, before
    // any of those letters reach the movement or hotkey handlers.
    this.typed = '';
    this.typedAt = 0;

    const down = (e) => {
      const c = e.code;
      if (!this.keys.has(c)) this.pressed.add(c);
      this.keys.add(c);
      if (c.length === 4 && c.startsWith('Key')) {
        this.typed = (this.typed + c[3].toLowerCase()).slice(-16);
        this.typedAt = AC.now();
      }
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(c)) e.preventDefault();
    };
    const up = (e) => this.keys.delete(e.code);
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);
    window.addEventListener('blur', () => this.keys.clear());

    // The click listener has to sit on the document, not the canvas: the start
    // overlay is a full-viewport element on top of the canvas, so a click to
    // begin never reaches the canvas at all.
    document.addEventListener('click', () => {
      this.dismissed = true;
      if (this.locked || this.lockFailed) return;
      let r;
      try { r = target.requestPointerLock(); } catch (e) { this.lockFailed = true; }
      // Newer Chrome returns a promise; a rejection here is not fatal, it just
      // means we fall back to drag-look.
      if (r && typeof r.catch === 'function') r.catch(() => { this.lockFailed = true; });
      // Belt and braces: if the request neither succeeds nor reports an error
      // within a beat, assume it is not coming. Whatever else happens, one
      // click must get the player past the overlay.
      setTimeout(() => {
        if (!this.locked && !this.everLocked) this.lockFailed = true;
      }, 700);
    });

    document.addEventListener('pointerlockchange', () => {
      const was = this.locked;
      this.locked = document.pointerLockElement === target;
      if (this.locked) { this.lockFailed = false; this.everLocked = true; }
      // ESC is the only way out of pointer lock and the browser eats the key,
      // so losing the lock IS the Escape event as far as this game is
      // concerned. Everything that used to key off `showOverlay` now keys off
      // this instead.
      else if (was) this.lockReleased = true;
    });

    // Pointer lock can be refused outright — some browsers block it on file://,
    // and it is unavailable in a sandboxed iframe. Fall back rather than
    // stranding the player behind an overlay that will not go away.
    document.addEventListener('pointerlockerror', () => { this.lockFailed = true; });

    document.addEventListener('mousemove', (e) => {
      const r = target.getBoundingClientRect ? target.getBoundingClientRect() : null;
      this.pointerX = r ? (e.clientX - r.left) / Math.max(1, r.width) : 0.5;
      this.pointerY = r ? (e.clientY - r.top) / Math.max(1, r.height) : 0.5;
      if (this.locked) {
        this.dx += e.movementX;
        this.dy += e.movementY;
      } else if (this.dragging) {
        this.dx += e.clientX - this.lastX;
        this.dy += e.clientY - this.lastY;
        this.lastX = e.clientX; this.lastY = e.clientY;
      }
    });

    // Firing. Under pointer lock a mousedown is unambiguous. In the drag-look
    // fallback it is not — the same button aims the camera — so there we fire
    // on mouseup only if the pointer barely moved, i.e. a click rather than a
    // drag. Either way the click that ACQUIRES the lock never fires, because
    // `locked` is still false at that moment.
    document.addEventListener('mousedown', (e) => {
      if (e.button === 2) { this.aimDown = true; this.rightHit = true; return; }
      if (e.button !== 0) return;
      this.downX = e.clientX; this.downY = e.clientY;
      this.clickHit = true;
      if (this.locked) this.fire = true;
    });
    document.addEventListener('mouseup', (e) => {
      if (e.button === 2) this.aimDown = false;
    });
    // Right-drag is the aim button, so the browser menu has to stay out of it.
    window.addEventListener('contextmenu', (e) => e.preventDefault());
    // Alt-tabbing away with the button held would otherwise stick in aim mode.
    window.addEventListener('blur', () => { this.aimDown = false; });

    // Drag-to-look. Always available, and the only way to look around when
    // pointer lock is refused.
    target.addEventListener('mousedown', (e) => {
      if (this.locked || e.button !== 0) return;
      this.dragging = true;
      this.lastX = e.clientX; this.lastY = e.clientY;
      e.preventDefault();
    });
    window.addEventListener('mouseup', (e) => {
      if (!this.locked && this.dragging && this.lockFailed) {
        const moved = Math.hypot(e.clientX - this.downX, e.clientY - this.downY);
        if (moved < 4) this.fire = true;
      }
      this.dragging = false;
    });
  }

  /** True while the mouse is not captured and could be. Kept because the
   *  acceptance harness uses `lockFailed` to bypass pointer lock; the title
   *  screen no longer keys off it — losing the lock opens the map now, and the
   *  title screen is its own explicit state on Game. */
  get showOverlay() {
    return !this.locked && !this.lockFailed;
  }

  down(code) { return this.keys.has(code); }
  /** True once per physical key press. */
  hit(code) { return this.pressed.has(code); }

  /** Cheat codes. Returns the code that has just been completed, or null.
   *
   *  A half-typed code lapses after `windowMs` of silence so that ordinary
   *  movement keys cannot slowly accumulate into a match. The matched code is
   *  consumed, and the caller is expected to swallow those key presses too —
   *  otherwise the `r` in "car" would also fire respawn. */
  cheat(codes, windowMs) {
    if (!this.typed) return null;
    if (AC.now() - this.typedAt > windowMs) { this.typed = ''; return null; }
    for (const code of codes) {
      if (this.typed.endsWith(code)) { this.typed = ''; return code; }
    }
    return null;
  }

  /** True while a cheat code is half-typed.
   *
   *  This is what lets a letter be both a hot key and part of a code. The
   *  earlier rule — no hot key may be a non-final letter of any code — worked
   *  but spent a letter of the alphabet on every code, and 'n' is the third
   *  letter of "panzer". Suppressing letter hot keys while a prefix is pending
   *  costs nothing when no code is in progress. */
  cheatPending(codes, windowMs) {
    if (!this.typed) return false;
    if (AC.now() - this.typedAt > windowMs) return false;
    for (const code of codes) {
      for (let n = 1; n < code.length; n++) {
        if (this.typed.endsWith(code.slice(0, n))) return true;
      }
    }
    return false;
  }

  endFrame() {
    this.pressed.clear();
    this.dx = 0; this.dy = 0;
    this.fire = false; this.rightHit = false;
    this.clickHit = false; this.lockReleased = false;
  }
};

AC.Player = class Player {
  constructor(world, cfg, traffic) {
    this.w = world; this.cfg = cfg; this.traffic = traffic;
    const spawn = world.spawnPoint();
    this.x = spawn.x; this.y = spawn.y;
    this.yaw = spawn.yaw;
    this.pitch = 0.0;
    this.mode = 'walk';
    this.car = null;
    this.bob = 0;
    this.speed = 0;
    this.headlights = true;
    // While driving, the camera is locked to the car's heading and this is the
    // free-look deviation from it. It decays back to zero so the view settles
    // ahead of the car on its own.
    this.lookOffset = 0;
    this.shots = 0;
    this.kills = 0;
    this.wrecks = 0;

    // View. `view` is the preference the player toggles with V; `aiming` is the
    // transient right-button override. camT is the eased blend between the two
    // camera placements, 0 = first person, 1 = fully chased.
    this.view = 'first';
    this.aiming = false;
    this.camT = 0;

    // Camera shake. Two channels: `shake` is the low-frequency wallop of an
    // impact, `rumble` a fast buzz for running something over. They are kept
    // apart from yaw/pitch on purpose — those are simulation state that drives
    // movement, and a shaking camera must not steer the car.
    this.shake = 0; this.rumble = 0; this.shakeT = 0;
    this.shakeYaw = 0; this.shakePitch = 0; this.shakeZ = 0;

    this.health = cfg.maxHealth;
    this.hurtCd = 0;
    this.hurtFlash = 0;
    this.dead = false;
    this.deathT = 0;
    this.deathFinished = false;
    this.deathYaw = 0; this.deathPitch = 0; this.deathZ = 0; this.deathBack = 0;

    // Cutscenes. `trans` is the get-in / get-out move; `watch` is the camera
    // locking onto a summoned car; `reviving` is getting back up after dying.
    // All three suspend player control.
    this.trans = null;
    this.watch = null;
    this.watchT = 0;
    this.watchPrevView = 'first';
    this.reviving = null;
    this.reviveLift = 0;
    this.drownT = 0;
  }

  /** How far out to sea the player is, in world units past the waterline.
   *  Negative on land. Wading at the water's edge is not drowning. */
  get waterDepth() {
    const w = this.w;
    if (!w.isWaterAt(this.x | 0, this.y | 0)) return -1;
    return w.shoreDist(this.x, this.y) - w.shoreAt(this.x, this.y);
  }

  get drowning() { return this.drownT > 0; }

  /** True while control belongs to a cutscene rather than the player. */
  get scripted() { return !!(this.trans || this.watch || this.reviving); }

  /** 0 = clear, 1 = fully blacked out. Drives the renderer's veil. */
  get veil() {
    const R = this.reviving;
    if (!R) return 0;
    const u = R.t / R.dur;
    if (u < R.down) return u / R.down;                       // fade out
    if (u < R.up) return 1;                                  // held black
    return Math.max(0, 1 - (u - R.up) / (1 - R.up));         // fade back in
  }

  /** Is the player's own body worth drawing? Hidden once they are climbing in
   *  and while actually driving. */
  get avatarVisible() {
    if (this.trans) {
      if (this.trans.kind === 'enter') return this.trans.t / this.trans.dur < 0.74;
      return this.trans.t / this.trans.dur > 0.16;
    }
    return this.mode !== 'drive';
  }

  /** Point the camera at a car being fetched, and hold it there. */
  watchCar(car) {
    this.watch = car;
    this.watchT = 0;
    this.watchPrevView = this.view;
    this.view = 'third';
  }

  _stepWatch(dt) {
    const c = this.watch;
    const want = Math.atan2(c.y - this.y, c.x - this.x);
    this.yaw = AC.steer(this.yaw, want, dt * 2.4);
    this.watchT += dt;
    if (!c.summon || this.watchT > this.cfg.summonDur + 3) {
      this.watch = null;
      this.view = this.watchPrevView;
    }
  }

  /** Door position beside a car, on whichever side the player is already on. */
  _doorSpot(car, out) {
    const rx = -Math.sin(car.heading), ry = Math.cos(car.heading);
    const side = ((this.x - car.x) * rx + (this.y - car.y) * ry) >= 0 ? 1 : -1;
    const d = car.bodyRadius() + 0.30;
    const x = car.x + rx * side * d, y = car.y + ry * side * d;
    if (out) { out.x = x; out.y = y; }
    return { x, y, side };
  }

  _beginEnter(car) {
    const door = this._doorSpot(car);
    this.trans = {
      kind: 'enter', car, t: 0, dur: this.cfg.enterDur,
      fx: this.x, fy: this.y, tx: door.x, ty: door.y,
      prevView: this.view,
    };
    car.playerDriven = true;      // the AI must not drive off mid-cutscene
    car.summon = null;
    this.view = 'third';
  }

  /** Where to put the player when they get out.
   *
   *  Tried in order: the side they are already sitting on, the other side,
   *  behind, ahead. The first that is clear of geometry and of other traffic
   *  wins. `findOpen` used to do this job and was the wrong tool — it snaps to
   *  the nearest non-solid cell without caring what is between, so getting out
   *  against a wall could drop you inside the building. */
  _exitSpot(car) {
    const cfg = this.cfg;
    const h = car.heading;
    const rx = -Math.sin(h), ry = Math.cos(h);
    const fwd = Math.cos(h), fwy = Math.sin(h);
    const side = ((this.x - car.x) * rx + (this.y - car.y) * ry) >= 0 ? 1 : -1;
    const d = car.bodyRadius() + cfg.playerRadius + 0.30;
    const tries = [
      [rx * side, ry * side],
      [-rx * side, -ry * side],
      [-fwd, -fwy],
      [fwd, fwy],
      [(rx * side - fwd) * 0.71, (ry * side - fwy) * 0.71],
      [(-rx * side - fwd) * 0.71, (-ry * side - fwy) * 0.71],
    ];
    for (let k = 0; k < tries.length; k++) {
      const x = car.x + tries[k][0] * d, y = car.y + tries[k][1] * d;
      if (!this._blocked(x, y, cfg.playerRadius)) return { x, y };
    }
    // Nowhere clear: step out on the spot. The escape rule in _move will let
    // you walk out of the car's body under your own steam.
    return { x: car.x, y: car.y };
  }

  _beginExit() {
    const car = this.car;
    const spot = this._exitSpot(car);
    this.trans = {
      kind: 'exit', car, t: 0, dur: this.cfg.exitDur,
      fx: car.x, fy: car.y, tx: spot.x, ty: spot.y,
      prevView: this.view,
    };
    this.mode = 'walk';           // the body appears straight away
    this.car = null;
    car.playerDriven = true;      // held until we are clear of it
    // A car you have just stepped out of is standing still. Leaving the last
    // driving velocity on it made it read as moving traffic to the on-foot
    // hazard check, which is what killed people who got out at speed.
    car.speed = 0; car.vx = 0; car.vy = 0;
    this.view = 'third';
  }

  _stepTrans(dt) {
    const T = this.trans;
    T.t += dt;
    const u = Math.min(1, T.t / T.dur);
    // Smoothstep, so the walk starts and finishes softly.
    const e = u * u * (3 - 2 * u);
    this.x = T.fx + (T.tx - T.fx) * e;
    this.y = T.fy + (T.ty - T.fy) * e;
    this.camT += (1 - this.camT) * Math.min(1, dt * this.cfg.camBlendRate * 0.7);

    const car = T.car;
    if (T.kind === 'enter') {
      // Face the car on the way in, then square up with it to climb aboard.
      const want = u < 0.7
        ? Math.atan2(car.y - this.y, car.x - this.x)
        : car.heading;
      this.yaw = AC.steer(this.yaw, want, dt * 5.0);
      this.bob += dt * 7;
      if (u >= 1) {
        this.mode = 'drive';
        this.car = car;
        car.parked = false;
        this.x = car.x; this.y = car.y;
        this.yaw = car.heading;
        this.lookOffset = 0;
        this.view = T.prevView;
        this.trans = null;
      }
    } else {
      this.yaw = AC.steer(this.yaw, Math.atan2(T.ty - car.y, T.tx - car.x), dt * 4.0);
      this.bob += dt * 6;
      if (u >= 1) {
        car.playerDriven = false;
        if (car.tank) { car.parked = true; car.playerDriven = true; }
        else car._beginRecover();     // eases back into a lane, no teleport
        this.view = T.prevView;
        this.trans = null;
      }
    }
  }

  /** Take damage.
   *
   *  `useCooldown` guards the *repeating* sources — grinding along a wall would
   *  otherwise register a hit every frame. One-shot sources (a blast) pass
   *  false, so two cars going up together both count. */
  /** True while nothing may hurt the player: a tank crew is untouchable, and
   *  so is anyone in the middle of a cutscene they cannot steer out of. */
  get invulnerable() {
    if (this.scripted) return true;
    return this.mode === 'drive' && !!this.car && !!this.car.tank;
  }

  hurt(amount, useCooldown) {
    if (this.dead || !(amount > 0) || this.invulnerable) return false;
    if (useCooldown !== false) {
      if (this.hurtCd > 0) return false;
      this.hurtCd = this.cfg.damageCooldown;
    }
    this.health -= amount;
    this.hurtFlash = 0.28;
    this.addShake(Math.min(0.75, amount / this.cfg.maxHealth * 1.7));
    if (this.health <= 0) { this.health = 0; this._die(); }
    return true;
  }

  _die() {
    this.dead = true;
    this.deathX = this.x; this.deathY = this.y;
    this.deathT = 0;
    this.deathFinished = false;
    this.aiming = false;
    this.view = 'third';        // watch yourself go down
    this.speed = 0;
  }

  respawn() {
    const sp = this.w.spawnPoint();
    if (this.mode === 'drive' && this.car) { this.car.playerDriven = false; }
    this.car = null;
    this.mode = 'walk';
    this.x = sp.x; this.y = sp.y; this.yaw = sp.yaw; this.pitch = 0;
    this.health = this.cfg.maxHealth;
    this.hurtCd = 0; this.hurtFlash = 0;
    this.dead = false; this.deathT = 0; this.deathFinished = false;
    // respawn() is also the way out of the revive cutscene and the way the
    // test harness resets between cases, so it has to leave no cutscene state
    // behind. _stepRevive puts `reviving` back for the rest of its own run.
    this.reviving = null; this.reviveLift = 0;
    this.trans = null; this.watch = null;
    this.deathYaw = 0; this.deathPitch = 0; this.deathZ = 0; this.deathBack = 0;
    this.shake = 0; this.rumble = 0;
    this.shakeYaw = 0; this.shakePitch = 0; this.shakeZ = 0;
    this.view = 'first'; this.camT = 0; this.lookOffset = 0;
    this.speed = 0;
  }

  _stepDead(dt) {
    const cfg = this.cfg;
    this.deathT += dt;
    // Ease out to third person regardless of what the view was.
    this.camT += (1 - this.camT) * Math.min(1, dt * cfg.camBlendRate * 0.45);
    // Drunken drift: slow, incommensurate, and growing — the camera loses its
    // grip rather than snapping into an effect.
    const t = this.deathT;
    const grow = Math.min(1, t / 1.6);
    const a = cfg.deathWobble * grow;
    this.deathYaw = a * (Math.sin(t * 0.9) * 0.7 + Math.sin(t * 1.7) * 0.3);
    this.deathPitch = a * 0.5 * Math.sin(t * 0.7 + 1.1);
    this.deathZ = grow * 0.45 + a * 0.7 * Math.sin(t * 0.6);
    this.deathBack = grow * cfg.deathDrift;
    if (this.mode === 'drive' && this.car) {
      this.car.speed *= (1 - dt * 1.6);
      if (Math.abs(this.car.speed) < 0.02) this.car.speed = 0;
    }
    if (this.deathT >= cfg.deathDuration && !this.deathFinished) {
      this.deathFinished = true;
      this._beginRevive();
    }
  }

  /** Getting back up.
   *
   *  Death used to end by dropping the mouse so that the title screen came back
   *  on its own — which put the whole city behind a menu every time you made a
   *  mistake. It is a cutscene now: black out, put the body somewhere else,
   *  crane the camera down into it, hand the controls back. */
  _beginRevive() {
    this.reviving = { t: 0, dur: this.cfg.reviveDur, down: 0.26, up: 0.42, placed: false };
  }

  _stepRevive(dt) {
    const cfg = this.cfg, R = this.reviving;
    R.t += dt;
    const u = R.t / R.dur;

    // Move the body while the screen is black, not before and not after.
    if (!R.placed && u >= R.down) {
      R.placed = true;
      const spot = this.w.respawnNear(this.deathX || this.x, this.deathY || this.y);
      this.respawn();
      this.x = spot.x; this.y = spot.y; this.yaw = spot.yaw;
      this.reviving = R;              // respawn() knows nothing about this
      R.yaw = this.yaw;
    }

    if (R.placed) {
      // Crane down out of the sky onto the spawn point, easing out.
      const k = Math.max(0, Math.min(1, (u - R.up) / Math.max(0.001, 1 - R.up)));
      const e = 1 - (1 - k) * (1 - k);
      this.reviveLift = cfg.reviveRise * (1 - e);
      this.yaw = R.yaw;
      this.pitch = -0.55 * (1 - e);
    } else {
      this.deathT += dt;              // keep the drunken drift going under the fade
    }

    if (u >= 1) {
      this.reviving = null;
      this.reviveLift = 0;
      this.pitch = 0;
      this.deathFinished = false;
    }
  }

  /** Deep water drains health, on foot or at the wheel.
   *
   *  Deliberately NOT routed through hurt(): that is the combat funnel, with a
   *  cooldown and a flash and a shake per hit, and it is gated by
   *  `invulnerable`. Drowning is a continuous drain and it applies to everyone
   *  — a tank that can idle in the Atlantic for ever is not invincible, it is
   *  broken. Cutscenes are exempt, because the player is not steering. */
  _drown(dt) {
    const cfg = this.cfg;
    if (this.dead || this.scripted) { this.drownT = 0; return; }
    if (this.waterDepth < cfg.drownDepth) { this.drownT = 0; return; }
    this.drownT += dt;
    this.health -= cfg.drownRate * dt;
    if (this.health <= 0) { this.health = 0; this.drownT = 0; this._die(); }
  }

  addShake(a) {
    this.shake = Math.min(this.cfg.shakeMax, this.shake + a);
  }

  addRumble(a) {
    this.rumble = Math.min(this.cfg.shakeMax, this.rumble + a);
  }

  /** Yaw and pitch the CAMERA uses. Movement always uses the raw values. */
  get viewYaw() { return this.yaw + this.shakeYaw + this.deathYaw; }
  get viewPitch() {
    const L = this.cfg.pitchLimit + 0.15;
    const v = this.pitch + this.shakePitch + this.deathPitch;
    return v > L ? L : (v < -L ? -L : v);
  }

  _updateShake(dt) {
    const cfg = this.cfg;
    this.shakeT += dt;
    if (this.shake > 0) {
      this.shake -= cfg.shakeDecay * dt * (0.35 + this.shake);
      if (this.shake < 0.001) this.shake = 0;
    }
    if (this.rumble > 0) {
      this.rumble -= cfg.rumbleDecay * dt * (0.35 + this.rumble);
      if (this.rumble < 0.001) this.rumble = 0;
    }
    const t = this.shakeT, a = this.shake, r = this.rumble;
    if (a <= 0 && r <= 0) { this.shakeYaw = 0; this.shakePitch = 0; this.shakeZ = 0; return; }
    // Incommensurate frequencies, so it reads as a jolt rather than a clean
    // oscillation. Rumble sits an order of magnitude higher, which is what
    // makes it feel like texture under the wheels instead of a hit.
    this.shakeYaw = a * cfg.shakeYawAmp * (Math.sin(t * 37.1) * 0.6 + Math.sin(t * 23.3) * 0.4)
      + r * cfg.rumbleYawAmp * Math.sin(t * 96.7);
    this.shakePitch = a * cfg.shakePitchAmp * (Math.sin(t * 41.7) * 0.55 + Math.sin(t * 19.9) * 0.45)
      + r * cfg.rumbleYawAmp * 0.7 * Math.sin(t * 88.1);
    this.shakeZ = a * cfg.shakeZAmp * Math.sin(t * 31.5)
      + r * cfg.rumbleZAmp * Math.sin(t * 104.3);
  }

  /** True once the camera is far enough back to be worth drawing an avatar. */
  get thirdPerson() { return this.camT > 0.45; }

  toggleView() { this.view = this.view === 'third' ? 'first' : 'third'; }

  /** Where the rays actually start. In first person this is the player's eye;
   *  in third it is pushed back along yaw and lifted, pulled in short of any
   *  wall behind so the camera never ends up inside geometry. */
  cameraOrigin() {
    const cfg = this.cfg;
    // reviveLift is the crane shot: the camera starts high above the spawn point
    // and comes down into the body as the screen fades back in.
    // Ride the ground: on a bridge deck the surface under you is metres above
    // the water, and everything the camera does is relative to it.
    const baseEye = this.eyeHeight + Math.sin(this.bob) * 0.012 + this.reviveLift
      + this.w.groundAt(this.x, this.y);
    const t = this.camT;
    if (t <= 0.001) return { x: this.x, y: this.y, eye: baseEye + this.shakeZ + this.deathZ };

    const drive = this.mode === 'drive';
    const back = (drive ? cfg.camBackDrive : cfg.camBackWalk) * t * (1 + this.deathBack);
    const up = (drive ? cfg.camUpDrive : cfg.camUpWalk) * t;
    const side = (drive ? cfg.camSideDrive : cfg.camSideWalk) * t;
    const dx = Math.cos(this.yaw), dy = Math.sin(this.yaw);

    // Full offset, back and to the side. March the whole vector rather than
    // just the back component, or the shoulder offset can push the camera
    // through a wall the straight-back test never sees.
    const ox = -dx * back - dy * side;
    const oy = -dy * back + dx * side;
    let f = 1;
    const N = 12;
    for (let i = 1; i <= N; i++) {
      const s = i / N;
      if (this.w.isSolidAt(Math.floor(this.x + ox * s), Math.floor(this.y + oy * s))) {
        f = Math.max(0, (i - 1) / N - 0.08);
        break;
      }
    }
    const len = Math.hypot(ox, oy);
    if (len > 0 && len * f < cfg.camMinBack) f = Math.min(1, cfg.camMinBack / len);
    return { x: this.x + ox * f, y: this.y + oy * f, eye: baseEye + up * f + this.shakeZ + this.deathZ };
  }

  get eyeHeight() {
    const cfg = this.cfg;
    const drive = cfg.carDriveEyeHeight, walk = cfg.eyeHeight;
    const T = this.trans;
    if (T) {
      const u = Math.min(1, T.t / T.dur);
      return T.kind === 'enter' ? walk + (drive - walk) * u : drive + (walk - drive) * u;
    }
    return this.mode === 'drive' ? drive : walk;
  }

  static wrap(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  look(dx, dy) {
    if (this.dead || this.scripted) return;   // the camera is on its own
    const s = this.cfg.mouseSensitivity;
    this.pitch -= dy * s;
    const L = this.cfg.pitchLimit;
    if (this.pitch > L) this.pitch = L;
    if (this.pitch < -L) this.pitch = -L;

    if (this.mode === 'drive' && this.car) {
      // Look around the cabin, but the car still decides where "forward" is.
      const M = this.cfg.driveLookLimit;
      this.lookOffset += dx * s;
      if (this.lookOffset > M) this.lookOffset = M;
      if (this.lookOffset < -M) this.lookOffset = -M;
      this.yaw = Player.wrap(this.car.heading + this.lookOffset);
    } else {
      this.yaw = Player.wrap(this.yaw + dx * s);
    }
  }

  /** Circle-vs-grid collision, resolved one axis at a time so we slide. */
  _move(nx, ny, radius) {
    let x = this.x, y = this.y;
    // The origin is passed so that a position already overlapping something —
    // stepping out of a car, a car that stopped on top of you — can still move
    // AWAY from it. Without that, every candidate is inside the obstacle too,
    // every axis is rejected, and you are welded to the spot for good.
    if (!this._blocked(nx, y, radius, x, y)) x = nx;
    if (!this._blocked(x, ny, radius, this.x, this.y)) y = ny;
    this.x = x; this.y = y;
  }

  /** Is a circle of radius r at (x, y) inside anything solid?
   *
   *  `fx, fy` is optional and turns this into an *escape-aware* test: an
   *  obstacle that already overlaps the origin only blocks if the candidate is
   *  no further out of it. Moving deeper is refused, moving out is allowed. */
  _blocked(x, y, r, fx, fy) {
    const w = this.w;
    const esc = fx !== undefined;
    const r2 = r * r;
    const x0 = Math.floor(x - r), x1 = Math.floor(x + r);
    const y0 = Math.floor(y - r), y1 = Math.floor(y + r);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        if (!w.isSolidAt(cx, cy)) continue;
        const px = Math.max(cx, Math.min(x, cx + 1));
        const py = Math.max(cy, Math.min(y, cy + 1));
        const dx = x - px, dy = y - py;
        const d2 = dx * dx + dy * dy;
        if (d2 >= r2) continue;
        if (esc) {
          const qx = Math.max(cx, Math.min(fx, cx + 1));
          const qy = Math.max(cy, Math.min(fy, cy + 1));
          const ex = fx - qx, ey = fy - qy;
          const o2 = ex * ex + ey * ey;
          if (o2 < r2 && d2 > o2) continue;      // already inside, backing out
        }
        return true;
      }
    }

    // Vehicles are solid too — walking through a car looked absurd, and while
    // driving this is what makes you bump off other traffic. Your own car is
    // obviously excluded, and a wreck mid-explosion is not worth colliding with.
    const cars = this.traffic ? this.traffic.cars : null;
    if (cars) {
      for (let i = 0; i < cars.length; i++) {
        const c = cars[i];
        if (c === this.car || c.state === 'gone' || c.state === 'exploding') continue;
        const rr = r + c.bodyRadius(), rr2 = rr * rr;
        const dx = x - c.x, dy = y - c.y;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr2) continue;
        if (esc) {
          const ex = fx - c.x, ey = fy - c.y;
          const o2 = ex * ex + ey * ey;
          if (o2 < rr2 && d2 > o2) continue;
        }
        return true;
      }
    }
    return false;
  }

  step(dt, input) {
    // Ease the camera before anything else: _walk returns early when idle, so
    // updating this inside the movement branches would freeze the transition
    // whenever the player stands still.
    this._updateShake(dt);
    if (this.hurtCd > 0) this.hurtCd -= dt;
    if (this.hurtFlash > 0) this.hurtFlash -= dt;
    this._drown(dt);
    if (this.reviving) { this._stepRevive(dt); return; }
    if (this.dead) { this._stepDead(dt); return; }
    if (this.trans) { this._stepTrans(dt); return; }
    if (this.watch) this._stepWatch(dt);
    this.aiming = !!(input && input.aimDown) && !this.cfg.showBigMap;
    const target = (this.view === 'third' && !this.aiming) ? 1 : 0;
    const k = Math.min(1, dt * this.cfg.camBlendRate);
    this.camT += (target - this.camT) * k;
    if (Math.abs(this.camT - target) < 0.002) this.camT = target;

    if (this.mode === 'drive') this._drive(dt, input);
    else this._walk(dt, input);
  }

  _walk(dt, input) {
    const cfg = this.cfg;
    let fx = 0, fy = 0;
    if (input.down('KeyW') || input.down('ArrowUp')) fy += 1;
    if (input.down('KeyS') || input.down('ArrowDown')) fy -= 1;
    if (input.down('KeyD') || input.down('ArrowRight')) fx += 1;
    if (input.down('KeyA') || input.down('ArrowLeft')) fx -= 1;
    const len = Math.hypot(fx, fy);
    let sp = (input.down('ShiftLeft') || input.down('ShiftRight')) ? cfg.runSpeed : cfg.walkSpeed;
    if (this.waterDepth > -0.5) sp *= cfg.waterWalkMul;
    this.speed = len > 0 ? sp : 0;
    if (len === 0) { this.bob *= 0.86; return; }
    fx /= len; fy /= len;
    // forward = (cos yaw, sin yaw). Screen-right is the camera plane direction,
    // (-sin yaw, cos yaw) — see the projection note in render.js. Getting this
    // sign wrong is what made A and D swap.
    const cs = Math.cos(this.yaw), sn = Math.sin(this.yaw);
    const vx = cs * fy - sn * fx;
    const vy = sn * fy + cs * fx;
    this._move(this.x + vx * sp * dt, this.y + vy * sp * dt, cfg.playerRadius);
    this.bob += sp * dt * 9.0;
  }

  _drive(dt, input) {
    const cfg = this.cfg, car = this.car;
    let throttle = 0, steer = 0;
    if (input.down('KeyW') || input.down('ArrowUp')) throttle += 1;
    if (input.down('KeyS') || input.down('ArrowDown')) throttle -= 1;
    if (input.down('KeyD') || input.down('ArrowRight')) steer += 1;
    if (input.down('KeyA') || input.down('ArrowLeft')) steer -= 1;

    const tankMul = car.tank ? cfg.tankSpeedMul : 1;
    // An engine in the sea is an engine that has stopped. You can still crawl,
    // which is what gives you a chance of getting back to the beach.
    const wetMul = this.waterDepth > 0 ? cfg.waterDriveMul : 1;
    const maxS = cfg.carMaxSpeed * 1.35 * tankMul * wetMul;
    if (throttle > 0) car.speed += cfg.carAccel * 1.3 * dt;
    else if (throttle < 0) car.speed -= cfg.carBrake * dt;
    else car.speed *= (1 - 1.1 * dt);
    if (car.speed > maxS) car.speed = maxS;
    if (car.speed < -maxS * 0.35) car.speed = -maxS * 0.35;
    if (Math.abs(car.speed) < 0.01) car.speed = 0;

    const grip = Math.min(1, Math.abs(car.speed) / (cfg.carMaxSpeed * 0.45));
    car.heading += steer * cfg.carSteer * (car.tank ? cfg.tankSteerMul : 1)
      * dt * grip * Math.sign(car.speed || 1);

    const nx = car.x + Math.cos(car.heading) * car.speed * dt;
    const ny = car.y + Math.sin(car.heading) * car.speed * dt;

    // Resolve a car-on-car impact BEFORE the move, so the impulse is computed
    // from the velocity we actually had going in rather than post-block.
    const R = car.bodyRadius() + 0.03;
    const struck = this._carAt(nx, ny, R);
    if (struck) this._impact(struck);

    this.x = car.x; this.y = car.y;
    this._move(nx, ny, R);
    const hitX = Math.abs(this.x - nx) > 1e-6, hitY = Math.abs(this.y - ny) > 1e-6;
    car.x = this.x; car.y = this.y;
    if ((hitX || hitY) && !struck) {
      const v = Math.abs(car.speed);
      this.addShake(v * cfg.shakeOnWall);
      if (v > cfg.damageMinSpeed && !car.tank) this.hurt(cfg.damageWallDrive);
      if (v > 1.2) {
        car.hitFlash = 0.14;
        const fx = Math.cos(car.heading), fy = Math.sin(car.heading);
        this.traffic.sparks.burst(car.x + fx * 0.5, car.y + fy * 0.5, 0.4, -fx, -fy,
          Math.min(1, v / cfg.carMaxSpeed), (this.traffic.steps * 17 + 3) | 0);
      }
      car.speed *= 0.35;
    }
    car.vx = Math.cos(car.heading) * car.speed;
    car.vy = Math.sin(car.heading) * car.speed;
    this.speed = Math.abs(car.speed);
    this.bob += Math.abs(car.speed) * dt * 1.5;

    // The camera rides the car. Without this the view stayed wherever the mouse
    // last left it while the car turned underneath, which is what made driving
    // feel like the controls were rotating at random.
    this.lookOffset *= Math.max(0, 1 - cfg.driveLookRecentre * dt);
    if (Math.abs(this.lookOffset) < 0.002) this.lookOffset = 0;
    this.yaw = Player.wrap(car.heading + this.lookOffset);
  }

  /** First car overlapping (x, y), excluding your own and anything that is
   *  already a fireball. */
  _carAt(x, y, r) {
    const cars = this.traffic ? this.traffic.cars : null;
    if (!cars) return null;
    for (let i = 0; i < cars.length; i++) {
      const c = cars[i];
      if (c === this.car || c.state === 'gone' || c.state === 'exploding') continue;
      const rr = r + c.bodyRadius(), rr2 = rr * rr;
      const dx = x - c.x, dy = y - c.y;
      if (dx * dx + dy * dy < rr2) return c;
    }
    return null;
  }

  /** Ram another car.
   *
   *  The throw is along the contact normal — from my centre to theirs — which
   *  is what makes the direction fall out of how you hit them rather than
   *  needing a special case per angle. How far they go scales with the CLOSING
   *  speed along that normal, so a glancing tap barely moves them and a
   *  head-on at speed launches them. The same lateral offset that makes a hit
   *  glancing also decides which way they spin and which way I get deflected. */
  _impact(other) {
    const cfg = this.cfg, car = this.car;
    const dx = other.x - car.x, dy = other.y - car.y;
    const d = Math.hypot(dx, dy) || 1e-4;
    const nx = dx / d, ny = dy / d;

    const rvx = car.vx - (other.vx || 0);
    const rvy = car.vy - (other.vy || 0);
    const closing = rvx * nx + rvy * ny;
    if (closing < cfg.crashMinSpeed) return;      // separating, or a nudge

    // How far off-axis the contact is, in my own frame. Screen-right for a
    // heading h is (-sin h, cos h); see the projection note in render.js.
    const h = car.heading;
    const lateral = (nx * -Math.sin(h) + ny * Math.cos(h));

    // Visible consequences: both cars flash, the paint chars via the existing
    // hit-point wear, sparks come off the contact point and the road keeps a
    // scuff. A hard enough shunt can write the other car off outright.
    const contactX = car.x + nx * 0.45, contactY = car.y + ny * 0.45;
    car.hitFlash = 0.18;
    other.hitFlash = 0.22;
    this.traffic.sparks.burst(contactX, contactY, 0.45, nx, ny,
      Math.min(1, closing / cfg.carMaxSpeed), (this.traffic.steps * 31 + 7) | 0);
    this.w.stainScorch(contactX, contactY, 0.5, 40 + closing * 22);

    let wrecked = false;
    if (car.tank) {
      // A tank does not trade paint. Anything it touches goes up, and it
      // barely notices — no deflection, almost no speed lost, no damage taken.
      other.hp = 0;
      wrecked = other.damage();
    } else if (closing > cfg.crashDamageSpeed) {
      wrecked = other.damage();
    }

    const J = closing * cfg.crashRestitution * (car.tank ? 1.8 : 1);
    if (!wrecked) other.knock(nx * J, ny * J, lateral * closing * cfg.crashSpin);

    car.speed *= (1 - (car.tank ? 0.08 : cfg.crashSpeedLoss));
    if (!car.tank) car.heading -= lateral * closing * cfg.crashDeflect * 0.35;
    car.vx = Math.cos(car.heading) * car.speed;
    car.vy = Math.sin(car.heading) * car.speed;

    // Separate by a hair so we are not still overlapping next frame, but only
    // into space that is actually free.
    const bx = car.x - nx * 0.05, by = car.y - ny * 0.05;
    if (!this._blocked(bx, by, 0.44)) { car.x = bx; car.y = by; this.x = bx; this.y = by; }

    this.addShake(closing * cfg.shakePerCrash * (car.tank ? 0.7 : 1));
    if (!car.tank && closing > cfg.damageMinSpeed) this.hurt(cfg.damageCarDrive);
  }

  /** F starts the get-in or get-out cutscene. */
  toggleVehicle() {
    if (this.dead || this.scripted) return false;
    if (this.mode === 'drive') { this._beginExit(); return true; }
    // A car you summoned parks itself and is unmistakably yours, so it can be
    // claimed from further away — otherwise the cutscene can drop it just
    // outside the ordinary reach and the cheat looks broken.
    let best = null, bestD = Infinity;
    for (const c of this.traffic.cars) {
      if (c.state !== 'alive') continue;
      const R = (c.parked && !c.tank) ? this.cfg.parkedEnterRange : this.cfg.carEnterRange;
      const d = (c.x - this.x) ** 2 + (c.y - this.y) ** 2;
      if (d <= R * R && d < bestD) { bestD = d; best = c; }
    }
    if (!best) return false;
    best.turning = null;
    this._beginEnter(best);
    return true;
  }

};


/* ===== src/07_render.js ============================================== */
// ---------------------------------------------------------------------------
// render.js — the presentation pipeline.
//
// Stages, in order, all writing into the Screen cell buffer:
//   1. column pass  — DDA raycast per glyph column; sky, walls, floor
//   2. sprite pass  — depth-tested glyph billboards for cars and pedestrians
//   3. overlay pass — crosshair, HUD, minimap
//
// Projection. dir is the unit view vector, plane is perpendicular with length
// tan(fovH/2), so ray = dir + plane*camX gives a ray whose march parameter IS
// the perpendicular distance (no cosine correction, no fisheye).
//   projCols = (cols/2) / tan(fovH/2)      columns per (world unit / distance)
//   projRows = projCols * cellW / cellH    rows,   corrected for cell aspect
//   horizon  = rows/2 + tan(pitch)*projRows
//   y(z, d)  = horizon - ((z - eye) / d) * projRows
// ---------------------------------------------------------------------------

AC.Renderer = class Renderer {
  constructor(screen, atlas, world, cfg) {
    this.s = screen; this.a = atlas; this.w = world; this.cfg = cfg;
    this.zbuf = new Float32Array(screen.cols);
    this.sprites = [];
    this._resizeBuffers();
    const idx = atlas.indexOf;
    this.G = {
      space: idx[32], dot: idx[46], colon: idx[58], comma: idx[44],
      quote: idx[34], apos: idx[39], bar: idx[124], dash: idx[45],
      us: idx[95], eq: idx[61], hash: idx[35], plus: idx[43],
      star: idx[42], tilde: idx[126], caret: idx[94], semi: idx[59],
      grave: idx[96], slash: idx[47], back: idx[92], at: idx[64],
      pct: idx[37], amp: idx[38], o: idx[111], O: idx[79], x: idx[120],
    };
    const ext = cfg.useExtendedGlyphs;
    this.gBarOn = ext ? idx['█'.charCodeAt(0)] : idx[35];    // '#'
    this.gBarOff = ext ? idx['░'.charCodeAt(0)] : idx[45];   // '-'
    // Density ramp. Anything that has to read as a filled SURFACE — sky, sea,
    // sand, cloud — has to be drawn with these. A thin glyph leaves most of the
    // cell showing the background, so a '~' sea on a black page is a black sea
    // with white squiggles on it, however bright the colour.
    this.gBlk = ext
      ? ['░', '▒', '▓', '█'].map((c) => idx[c.charCodeAt(0)])
      : [idx[46], idx[58], idx[35], idx[64]];
    this.time = 0;
    this.tod = cfg.startTimeOfDay;      // 0 midnight, 0.25 dawn, 0.5 noon, 0.75 dusk
    this.sun = this._sunState();
  }

  /** Where the sun is and what that does to everything else.
   *
   *  Recomputed once a frame and read all over the column pass. Time of day is
   *  presentation only — nothing in the simulation asks what hour it is, which
   *  is what keeps the determinism guarantee intact while the sky moves. */
  _sunState() {
    const TAU = Math.PI * 2;
    const t = this.tod;
    const ang = (t - 0.25) * TAU;
    const elev = Math.sin(ang);                 // -1 midnight .. +1 noon
    const smooth = (a, b, v) => {
      let u = (v - a) / (b - a);
