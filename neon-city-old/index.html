      if (u < 0) u = 0; else if (u > 1) u = 1;
      return u * u * (3 - 2 * u);
    };
    // Daylight ramps through the horizon rather than at it, so dawn and dusk
    // last long enough to be a time of day rather than a frame.
    const day = smooth(-0.16, 0.30, elev);
    // Dusk peaks when the sun is ON the horizon and dies quickly either side.
    const dusk = Math.exp(-(elev * elev) / (2 * 0.15 * 0.15));
    return {
      t, elev, day, dusk,
      night: 1 - day,
      azim: (t - 0.25) * TAU,                   // 0 = due east at sunrise
      up: Math.asin(Math.max(-1, Math.min(1, elev))),
      // Structures pick up daylight; anything that emits light fades in as it
      // gets dark. At night both are 1, so the night city looks exactly as it
      // did before there was a clock.
      amb: 1 + 0.55 * day,
      emit: 0.32 + 0.68 * (1 - day),
    };
  }

  _resizeBuffers() {
    if (this.zbuf.length !== this.s.cols) this.zbuf = new Float32Array(this.s.cols);
    // Per-CELL depth, not just per column. Aircraft sit above the skyline, so a
    // column-level test would hide them behind any building that happens to be
    // nearer anywhere in that column — which is most of the screen.
    const n = this.s.cols * this.s.rows;
    if (!this.zcell || this.zcell.length !== n) this.zcell = new Float32Array(n);
  }

  /** opts.overlay === false draws the world without HUD/minimap/crosshair,
   *  which is what the intro screen composites its banner over. */
  frame(player, traffic, dtSec, opts) {
    this.time += dtSec;
    if (this.cfg.dayNight) {
      this.tod = (this.tod + dtSec / this.cfg.dayLength) % 1;
      if (this.tod < 0) this.tod += 1;
    }
    this.sun = this._sunState();
    this._resizeBuffers();
    this._columns(player);
    this._spritePass(player, traffic);
    if (!opts || opts.overlay !== false) this._overlay(player, traffic);
    // The veil goes over absolutely everything, HUD included — it is a cut to
    // black, not a tint on the world.
    if (player.veil > 0.004) this._veil(player.veil);
  }

  /** Fade to black, in four steps of glyph density. There is no alpha here:
   *  the only way to darken a cell is to draw a sparser glyph in a darker
   *  colour, which is exactly what the block ramp is for. */
  _veil(v) {
    const s = this.s;
    const cols = s.cols, rows = s.rows;
    // A dissolve, not a tint. Cells are opaque here — overwriting every one of
    // them with a sparser block just gives a slightly different black, so the
    // fade is done by covering a growing FRACTION of the screen, chosen by the
    // same ordered threshold the sky dithers with. The density ramp then
    // handles the last of it so the final frames are solid rather than speckled.
    const th = AC.BAYER8;
    const lvl = v > 0.86 ? 3 : (v > 0.55 ? 2 : 1);
    const g = this.gBlk[lvl];
    const col = AC.pal(AC.PAL.SKY, 0);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        if (v < th[((y & 7) << 3) | ((x + y * 3) & 7)]) continue;
        const i = y * cols + x;
        s.ch[i] = g; s.co[i] = col;
      }
    }
    if (v > 0.5) {
      const txt = 'RESPAWNING';
      s.text((cols - txt.length) >> 1, rows >> 1, txt,
        AC.palf(AC.PAL.HUD_C, 0.35 + (1 - v) * 0.8));
    }
  }

  // -------------------------------------------------------------------------
  // Stage 1 — column pass
  // -------------------------------------------------------------------------
  _columns(p) {
    const s = this.s, a = this.a, w = this.w, cfg = this.cfg;
    const cols = s.cols, rows = s.rows;
    const ch = s.ch, co = s.co;

    // viewYaw/viewPitch carry the camera shake. Movement uses the raw yaw, so a
    // jolt never steers the car.
    const dirX = Math.cos(p.viewYaw), dirY = Math.sin(p.viewYaw);
    const tanH = Math.tan(cfg.fovH / 2);
    const planeX = -dirY * tanH, planeY = dirX * tanH;
    const projCols = (cols / 2) / tanH;
    const projRows = projCols * a.cellW / a.cellH;
    // Rays start at the camera, which in third person is behind and above the
    // player. Everything downstream — walls, floor, sprites — must use this,
    // not the player position; the minimap is the only thing that still wants
    // where the player actually is.
    const cam = p.cameraOrigin();
    const eye = cam.eye;
    const horizon = rows / 2 + Math.tan(p.viewPitch) * projRows;
    const horizonI = Math.ceil(horizon);

    this.projCols = projCols; this.projRows = projRows;
    this.horizon = horizon; this.eye = eye;
    this.dirX = dirX; this.dirY = dirY;
    this.planeX = planeX; this.planeY = planeY;

    const px = cam.x, py = cam.y;
    this.camX = px; this.camY = py;
    const SUN = this.sun;
    const maxDepth = cfg.maxDepth;
    const seaEnd = cfg.seaHorizon;
    // Almost every cell in this world is at ground zero, so the terrain solve
    // is skipped entirely unless there is relief within sight.
    const hasRelief = w.reliefNear(cam.x, cam.y);
    const S = w.size;
    const hits = this._hits || (this._hits = []);
    const zc = this.zcell;

    for (let x = 0; x < cols; x++) {
      const camX = 2 * x / cols - 1;
      const rdx = dirX + planeX * camX;
      const rdy = dirY + planeY * camX;

      let mapX = px | 0, mapY = py | 0;
      const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
      const ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
      let stepX, stepY, sdx, sdy;
      if (rdx < 0) { stepX = -1; sdx = (px - mapX) * ddx; }
      else { stepX = 1; sdx = (mapX + 1 - px) * ddx; }
      if (rdy < 0) { stepY = -1; sdy = (py - mapY) * ddy; }
      else { stepY = 1; sdy = (mapY + 1 - py) * ddy; }

      let limit = rows;              // topmost row still unoccluded, from below
      let nHits = 0;
      let firstDist = Infinity, firstBase = -1;
      let side = 0, dist = 0;
      let guard = 0;

      while (guard++ < 512) {
        if (sdx < sdy) { sdx += ddx; mapX += stepX; side = 0; dist = sdx - ddx; }
        else { sdy += ddy; mapY += stepY; side = 1; dist = sdy - ddy; }
        if (dist > maxDepth) break;
        if (mapX < 0 || mapY < 0 || mapX >= S || mapY >= S) break;
        const ci = mapY * S + mapX;
        if (!w.solid[ci]) continue;

        const h = w.h[ci];
        const yTop = horizon - ((h - eye) / dist) * projRows;
        const yBase = horizon + (eye / dist) * projRows;
        let t0 = Math.ceil(yTop); if (t0 < 0) t0 = 0;
        let t1 = Math.ceil(yBase); if (t1 > limit) t1 = limit;

        if (firstBase < 0) { firstDist = dist; firstBase = Math.ceil(yBase); }
        if (t0 < t1) {
          const hit = hits[nHits] || (hits[nHits] = {});
          hit.d = dist; hit.ci = ci; hit.side = side;
          hit.step = side === 0 ? stepX : stepY;
          hit.y0 = t0; hit.y1 = t1;
          hit.wallX = side === 0 ? py + dist * rdy : px + dist * rdx;
          hit.wallX -= Math.floor(hit.wallX);
          hit.mapX = mapX; hit.mapY = mapY;
          nHits++;
          if (t0 < limit) limit = t0;
          if (limit <= 0) break;
          if (nHits >= 12) break;
        }
      }

      this.zbuf[x] = firstDist;

      // --- sky: everything above the highest silhouette ---------------------
      const skyEnd = Math.min(limit, rows);
      if (skyEnd > 0) {
        const az = Math.atan2(rdy, rdx);
        const azQ = Math.round(az * 173);
        // How far this column is from the sun, in radians of azimuth.
        let dAz = az - SUN.azim;
        while (dAz > Math.PI) dAz -= Math.PI * 2;
        while (dAz < -Math.PI) dAz += Math.PI * 2;
        const towardSun = Math.exp(-(dAz * dAz) / (2 * 0.62 * 0.62));
        for (let y = 0; y < skyEnd; y++) {
          const i = y * cols + x;
          const elev = (horizon - y - 0.5) / projRows;
          const hz = Math.max(0, 1 - elev * 2.6);      // haze rising off the city
          const hs = AC.hash2(azQ, Math.round(elev * 71), 0x5741);
          // A filled block, not a space. The atlas paints coverage-zero cells
          // in the background colour, so the old space-glyph sky was black no
          // matter what colour it was given — which is fine for a night sky and
          // useless for a sunset.
          ch[i] = this.gBarOn; zc[i] = 1e30;

          // The sun itself: a disc that swells and reddens as it sets.
          const dEl = elev - SUN.up;
          const rad = 0.032 + 0.030 * SUN.dusk;
          if (SUN.up > -0.07 && dAz * dAz * 0.32 + dEl * dEl < rad * rad) {
            ch[i] = this.gBlk[3];
            co[i] = AC.pal(AC.mixOrd(AC.PAL.SUN, AC.PAL.DUSK_LO, SUN.dusk * 0.55, x, y), 7);
            continue;
          }

          // Sky colour: a horizon stop and a zenith stop, each of them a
          // blend of the night, day and dusk palettes, then blended into each
          // other by elevation. Every one of those is an ORDERED dither — a
          // hash dither across a whole sky at this contrast is static.
          let lo = AC.mixOrd(AC.PAL.SKY, AC.PAL.DAY_LO, SUN.day, x, y);
          let hi = AC.mixOrd(AC.PAL.NIGHT_HI, AC.PAL.DAY_HI, SUN.day, x + 2, y);
          // The sunset is in the west, but the whole sky takes colour from it.
          // Weighting purely by direction left the eastern half black while the
          // west burned, which is not what a sunset looks like.
          let up = elev * 2.2; if (up > 1) up = 1; else if (up < 0) up = 0;
          // Sunset colour belongs in the LOW sky. Spreading it evenly over the
          // dome dithered orange against deep blue at the zenith, which reads
          // as a plaid rather than as a sunset.
          const duskHere = SUN.dusk * (0.46 + 0.54 * towardSun) * (1 - up * 0.72);
          lo = AC.mixOrd(lo, AC.PAL.DUSK_LO, duskHere, x + 1, y + 2);
          hi = AC.mixOrd(hi, AC.PAL.DUSK_HI, duskHere * 0.55, x + 3, y + 1);
          const base = AC.mixOrd(lo, hi, up, x + 2, y + 3);
          // Night is nearly black on purpose. The sky is a filled surface now,
          // so without this the small-hours sky came out a visible navy where
          // it used to be the background colour — and "the dark sky like
          // before" is a thing people ask for by name.
          let bright = (0.34 + 0.44 * SUN.day) * (1 - up * 0.30)
              * (0.42 + 0.58 * SUN.day)
            + SUN.dusk * (0.20 + 0.34 * towardSun) * (1 - up * 0.5)
            + hz * 0.20 * SUN.day;

          // No clouds. A clear sky lets the gradient and the stars carry the
          // whole dome, and the cloud banks were reading as grubby smears
          // across the one part of the frame that has nothing else in it.
          // Stars, only once it is actually dark.
          if (elev > 0.18 && SUN.night > 0.55 && (hs % 271) === 0) {
            ch[i] = (hs >>> 8) % 3 === 0 ? this.G.plus : this.G.dot;
            co[i] = AC.palf(AC.PAL.HOT, 0.26 + SUN.night * 0.60);
            continue;
          }
          // Haze lying on the city, mixed into the sky rather than speckled
          // over it.
          if (hz > 0.35) {
            // Haze thins out at dusk rather than sitting on top of it: mixing
            // grey-blue haze over the low sky at full strength painted out the
            // one part of the sky the sunset actually lives in.
            co[i] = AC.palf(AC.mixOrd(base, AC.PAL.HAZE,
              hz * 0.55 * (1 - SUN.dusk * 0.75), x, y + 1), bright + hz * 0.10);
            continue;
          }
          co[i] = AC.palf(base, bright);
        }
      }

      // Azimuth offset from the sun, reused by the water for its glitter path.
      let dAzSun = Math.atan2(rdy, rdx) - SUN.azim;
      while (dAzSun > Math.PI) dAzSun -= Math.PI * 2;
      while (dAzSun < -Math.PI) dAzSun += Math.PI * 2;

      // --- walls: painter's order, far to near ------------------------------
      for (let k = nHits - 1; k >= 0; k--) {
        this._wallSpan(hits[k], x, projRows, horizon, eye);
      }

      // --- floor: only below the nearest wall's base ------------------------
      let fy = firstBase >= 0 ? firstBase : horizonI;
      if (fy < horizonI + 1) fy = horizonI + 1;
      if (fy < 0) fy = 0;
      for (let y = fy; y < rows; y++) {
        const denom = (y + 0.5) - horizon;
        if (denom <= 0.0001) continue;
        // Solve for where this ray meets the ground. With a flat world that is
        // one division; with a height field it is the same division iterated,
        // because the answer moves the sample point which moves the answer.
        // Two passes is plenty for slopes as gentle as a bridge ramp.
        let d = (eye * projRows) / denom;
        let g = 0;
        if (hasRelief) {
          for (let it = 0; it < 2; it++) {
            const sx2 = px + rdx * d, sy2 = py + rdy * d;
            const gg = w.groundAt(sx2, sy2);
            if (gg === g) break;
            const nd = ((eye - gg) * projRows) / denom;
            if (nd <= 0.05 || nd > seaEnd) break;
            g = gg; d = nd;
          }
        }
        // The sea is drawn much further than the city is: open water has no
        // silhouette to hide behind, so cutting it at maxDepth left a hard band
        // of sky sitting on top of the ocean. The loop is over rows either way,
        // so the extra reach costs nothing but the shading.
        if (d > seaEnd) continue;
        const wx = px + rdx * d, wy = py + rdy * d;
        const i = y * cols + x;
        if (d > maxDepth && !w.isWaterAt(wx | 0, wy | 0)) continue;
        zc[i] = d;
        this._floorCell(ch, co, i, wx, wy, d, dAzSun);
      }
    }
  }

  /** Shade one wall's visible span in one column. */
  _wallSpan(hit, x, projRows, horizon, eye) {
    const s = this.s, a = this.a, w = this.w, cfg = this.cfg;
    const ch = s.ch, co = s.co, cols = s.cols;
    const d = hit.d, ci = hit.ci;
    const mat = w.mat[ci], accent = w.accent[ci];
    const roof = w.h[ci];
    // Two global light multipliers. AMB lifts anything lit by the sky, EMIT
    // fades anything that emits its own light. Both are 1 at night, so the
    // night city looks exactly as it always did.
    const AMB = this.sun.amb, EMIT = this.sun.emit;

    // Distance fog, 1 near -> 0 at fogEnd.
    let fog = (cfg.fogEnd - d) / (cfg.fogEnd - cfg.fogStart);
    if (fog > 1) fog = 1; else if (fog < 0) fog = 0;
    fog = fog * fog * (3 - 2 * fog);

    // Face lighting: four distinct values so corners read as corners.
    const faceKey = hit.side * 2 + (hit.step > 0 ? 1 : 0);
    const light = [0.98, 0.70, 0.86, 0.60][faceKey];

    // Corner posts. Only where the wall genuinely ends — a shared face between
    // two cells of the same building is not an edge — and only about one
    // column wide, so close-up walls do not grow fat black bars.
    const u = hit.wallX;
    const cellCols = this.projCols / d;                 // columns per world unit
    const eps = Math.min(0.22, 0.85 / Math.max(1, cellCols));
    let edge = false;
    if (u < eps || u > 1 - eps) {
      const ax = hit.side === 0 ? 0 : 1;
      const nx2 = hit.mapX + (ax ? (u < eps ? -1 : 1) : 0);
      const ny2 = hit.mapY + (ax ? 0 : (u < eps ? -1 : 1));
      const same = w.inBounds(nx2, ny2)
        && w.solid[ny2 * w.size + nx2] === 1
        && Math.abs(w.h[ny2 * w.size + nx2] - roof) < 0.05;
      edge = !same;
    }

    // Material base colour.
    let baseCol;
    switch (mat) {
      case AC.MAT.CONCRETE_W: baseCol = AC.PAL.CONCRETE_W; break;
      case AC.MAT.GLASS_C: baseCol = AC.PAL.GLASS_C; break;
      case AC.MAT.GLASS_M: baseCol = AC.PAL.GLASS_M; break;
      case AC.MAT.FOLIAGE: baseCol = AC.PAL.FOLIAGE; break;
      case AC.MAT.DARK: baseCol = AC.PAL.ASPHALT; break;
      default: baseCol = AC.PAL.CONCRETE;
    }

    const sign = accent !== 255 ? w.signAt(hit.mapX, hit.mapY, faceKey) : null;
    const signSpan = sign ? sign.word.length * sign.charH : 0;
    const blinkOn = !sign || !sign.blink || ((this.time * 2) % 2) < 1.4;

    const fh = cfg.floorHeight;
    const isFoliage = mat === AC.MAT.FOLIAGE;
    const F = w.facade(w.lot[ci]);

    const zc = this.zcell;
    for (let y = hit.y0; y < hit.y1; y++) {
      const z = eye + (horizon - y - 0.5) * d / projRows;
      const i = y * cols + x;
      zc[i] = d;
      let g, c;

      if (isFoliage) {
        const n = AC.hash2(hit.mapX * 7 + (u * 6) | 0, hit.mapY * 13 + (z * 5) | 0, 0x1E2F);
        g = [this.G.star, this.G.amp, this.G.hash, this.G.pct][n & 3];
        c = AC.palf(AC.PAL.FOLIAGE, (0.22 + fog * 0.62 + ((n >>> 5) & 3) * 0.03) * AMB);
        ch[i] = g; co[i] = c;
        continue;
      }

      // Neon sign takes priority over the facade.
      if (sign && blinkOn && u > 0.22 && u < 0.78 && z <= sign.zTop && z > sign.zTop - signSpan) {
        const ci2 = Math.floor((sign.zTop - z) / sign.charH);
        const chr = sign.word.charCodeAt(Math.min(sign.word.length - 1, Math.max(0, ci2)));
        const gi = a.indexOf[chr];
        if (gi >= 0) {
          ch[i] = gi;
          co[i] = AC.palf(sign.base, (0.62 + fog * 0.38) * EMIT);
          continue;
        }
      }

      if (edge) {
        ch[i] = this.G.bar;
        co[i] = AC.palf(baseCol, (0.10 + fog * light * 0.45) * AMB);
        continue;
      }

      // Crisp roofline.
      if (y === hit.y0 && z > 1.0) {
        ch[i] = this.G.dash;
        co[i] = AC.palf(baseCol, (0.28 + fog * 0.55) * AMB);
        continue;
      }

      if (z < 0) { ch[i] = this.G.space; co[i] = AC.palf(AC.PAL.ASPHALT, 0.1); continue; }

      const floorIdx = (z / fh) | 0;
      const fv = z / fh - floorIdx;
      const wu = u * F.winCols;
      const wcol = wu | 0;
      const fu = wu - wcol;

      // Ground floor: shopfronts, lit from the street.
      if (z < fh * 1.0) {
        const n = AC.hash2(hit.mapX, hit.mapY * 3 + faceKey, 0x9AB1 + wcol);
        const glow = accent !== 255 ? accent : AC.PAL.NEON_A;
        if (fv > 0.18 && fv < 0.82 && fu > 0.15 && fu < 0.85 && (n & 3) !== 0) {
          ch[i] = (n & 4) ? this.G.hash : this.G.eq;
          co[i] = AC.palf(glow, (0.48 + fog * 0.5) * EMIT);
        } else {
          ch[i] = this.G.colon;
          co[i] = AC.palf(baseCol, (0.18 + fog * light * 0.45) * AMB);
        }
        continue;
      }

      // Setback ledge: a horizontal band every few floors on some buildings.
      if (F.ledge && floorIdx % F.ledge === 0 && fv < 0.13) {
        ch[i] = this.G.eq;
        co[i] = AC.palf(baseCol, (0.30 + fog * light * 0.55) * AMB);
        continue;
      }
      // Vertical mullions between window columns.
      if (F.mullion && (fu < 0.07 || fu > 0.93)) {
        ch[i] = this.G.bar;
        co[i] = AC.palf(baseCol, (0.16 + fog * light * 0.4) * AMB);
        continue;
      }

      const inWin = fv > F.vlo && fv < F.vhi && fu > F.hlo && fu < F.hhi;
      if (inWin) {
        const n = AC.hash2(ci + faceKey * 7919, floorIdx * 8 + wcol, 0x2C7D);
        // Fewer offices leave the lights on at noon, and the ones that do are
        // dimmer — that is EMIT's job.
        const lit = (n % 1000) < F.lit * 1000 * (0.30 + 0.70 * this.sun.night);
        if (lit) {
          const flick = ((n >>> 9) & 15) === 0
            ? 0.55 + 0.45 * Math.sin(this.time * 7.3 + (n & 255))
            : 1;
          let wc;
          if ((n & 24) === 0 && accent !== 255) wc = accent;
          else if (mat === AC.MAT.GLASS_M) wc = AC.PAL.GLASS_M;
          else if (F.warm) wc = ((n >>> 5) & 3) ? AC.PAL.NEON_A : AC.PAL.GLASS_C;
          else wc = ((n >>> 5) & 3) ? AC.PAL.GLASS_C : AC.PAL.NEON_A;
          ch[i] = ((n >>> 3) & 1) ? this.G.hash : this.G.eq;
          co[i] = AC.palf(wc, (0.38 + fog * 0.58) * flick * EMIT);
        } else {
          ch[i] = ((n >>> 7) & 3) === 0 ? this.G.colon : this.G.dot;
          co[i] = AC.palf(baseCol, (0.10 + fog * light * 0.28) * AMB);
        }
        continue;
      }

      // Solid facade: block ramp keyed on light * fog.
      const t = light * (0.28 + fog * 0.60) * AMB;
      ch[i] = a.rampBlockAt(Math.min(1, t) * 0.85);
      co[i] = AC.palf(baseCol, t);
    }

    // Roof cap: a bright rim so skylines separate from the sky.
    if (hit.y0 > 0 && roof > 2 && hit.y0 < s.rows) {
      const i = hit.y0 * cols + x;
      if (ch[i] === this.G.dash) co[i] = AC.palf(baseCol, (0.42 + fog * 0.5) * AMB);
    }
  }

  /** Shade one floor cell from its world position. */
  /** Open water. Two crossing wave trains give the swell, a third short one
   *  gives the chop, and the shoreline gets foam. The sun lays a glitter path
   *  down the water toward the camera, which is the single thing that makes an
   *  ASCII sea read as wet rather than as texture. */
  _water(ch, co, i, wx, wy, d, dAzSun) {
    const w = this.w, cfg = this.cfg;
    const SUN = this.sun;
    let fog = (cfg.fogEnd * 2.2 - d) / (cfg.fogEnd * 2.2 - cfg.fogStart);
    if (fog > 1) fog = 1; else if (fog < 0) fog = 0;

    const t = this.time * cfg.waveSpeed;
    const s1 = Math.sin(wx * 0.42 + wy * 0.17 - t * 2.3);
    const s2 = Math.sin(wx * 0.11 - wy * 0.37 - t * 1.6);
    const s3 = Math.sin(wx * 0.93 + wy * 0.71 - t * 4.1);
    const swell = s1 * 0.5 + s2 * 0.34 + s3 * 0.16;

    // How far out to sea, for the shallow-to-deep ramp.
    const off = w.shoreDist(wx, wy) - w.shoreAt(wx, wy);
    let deep = off / 26; if (deep > 1) deep = 1; else if (deep < 0) deep = 0;
    const h = AC.hash2(wx * 3 | 0, wy * 3 | 0, 0x1EA7);

    // Surf: a band of foam that breaks along the shoreline.
    if (off < 2.2 + swell * 1.5) {
      const on = Math.sin(off * 2.1 - t * 3.4) + swell;
      if (on > 0.15) {
        ch[i] = this.gBlk[on > 0.95 ? 3 : 2];
        co[i] = AC.palf(AC.PAL.FOAM, (0.40 + fog * 0.50) * (0.55 + 0.45 * SUN.amb));
        return;
      }
    }

    const sx = i % this.s.cols, sy = (i / this.s.cols) | 0;
    let base = AC.mixOrd(AC.PAL.WATER_S, AC.PAL.WATER_D, deep, sx, sy);
    // Water takes the sunset's colour where the light is coming from.
    base = AC.mixOrd(base, AC.PAL.DUSK_LO,
      SUN.dusk * Math.exp(-(dAzSun * dAzSun) / (2 * 0.9 * 0.9)) * 0.55, sx + 2, sy + 1);
    let bright = (0.26 + fog * 0.44) * (0.45 + 0.55 * SUN.day) + 0.17;

    // Glitter: a cone of light on the water pointing back at the sun, widest
    // and warmest when the sun is on the horizon.
    const glint = Math.exp(-(dAzSun * dAzSun) / (2 * 0.28 * 0.28))
      * (0.35 + 0.65 * SUN.dusk) * Math.max(0, SUN.elev + 0.18);
    if (SUN.up > -0.05 && glint > 0.05 && swell > 0.62 - glint) {
      ch[i] = swell > 0.9 ? this.G.star : this.G.apos;
      co[i] = AC.palf(AC.mixBase(AC.PAL.SUN, AC.PAL.FOAM, 0.35, h), 0.55 + glint * 0.45);
      return;
    }
    // At night the city throws its own light onto the near water.
    if (SUN.night > 0.5 && d < 40 && (h % 47) === 0) {
      ch[i] = this.G.apos;
      co[i] = AC.palf([AC.PAL.NEON_M, AC.PAL.NEON_C, AC.PAL.NEON_A][(h >>> 9) % 3],
        (0.30 + fog * 0.40) * SUN.night);
      return;
    }

    // The swell is carried by SHADE across a filled surface, with the odd '~'
    // riding a crest for texture. Drawing the waves as line glyphs on the
    // background is what made the sea read as black with squiggles on it.
    if (swell > 0.80 && (h & 3) === 0) { ch[i] = this.G.tilde; bright += 0.26; }
    else if (swell > 0.62) { ch[i] = this.gBlk[3]; bright += 0.22; }
    else if (swell > 0.10) { ch[i] = this.gBlk[2]; bright += 0.10; }
    else if (swell > -0.55) { ch[i] = this.gBlk[2]; bright -= 0.02; }
    else { ch[i] = this.gBlk[1]; bright -= 0.06; base = AC.PAL.WATER_D; }
    co[i] = AC.palf(base, bright);
  }

  _floorCell(ch, co, i, wx, wy, d, dAzSun) {
    const w = this.w, cfg = this.cfg, a = this.a;
    const AMB = this.sun.amb, EMIT = this.sun.emit;
    const AMBDAY = this.sun.day > 0.12;
    const cx = wx | 0, cy = wy | 0;
    let fog = (cfg.fogEnd - d) / (cfg.fogEnd - cfg.fogStart);
    if (fog > 1) fog = 1; else if (fog < 0) fog = 0;
    fog = fog * fog * (3 - 2 * fog);

    // Off the edge of the grid is open sea, all the way to the horizon.
    if (cx < 0 || cy < 0 || cx >= w.size || cy >= w.size) {
      this._water(ch, co, i, wx, wy, d, dAzSun || 0);
      return;
    }
    const di = cy * w.size + cx;
    const k = w.kind[di];
    const fx = wx - cx, fy = wy - cy;

    if (k === AC.KIND.WATER) { this._water(ch, co, i, wx, wy, d, dAzSun || 0); return; }

    if (k === AC.KIND.SAND) {
      // Wet sand where the tide reaches, dry and grainy further up.
      const off = w.shoreAt(wx, wy) - w.shoreDist(wx, wy);
      const n = AC.hash2((wx * 3) | 0, (wy * 3) | 0, 0x6D31);
      const wet = off < 1.6;
      ch[i] = wet ? this.gBlk[(n & 1) ? 2 : 3]
        : this.gBlk[[1, 1, 1, 0][n & 3]];
      co[i] = AC.palf(wet ? AC.PAL.FOAM : AC.PAL.SAND,
        ((wet ? 0.24 : 0.30) + fog * 0.46) * AMB);
      return;
    }

    if (k === AC.KIND.BRIDGE) {
      // Deck planks, with a rail wherever the next cell along is not deck.
      const edge = w.kind[Math.min(w.size - 1, cy + 1) * w.size + cx] !== AC.KIND.BRIDGE
        || w.kind[Math.max(0, cy - 1) * w.size + cx] !== AC.KIND.BRIDGE;
      const n = AC.hash2(cx, cy, 0x5E21);
      if (edge) {
        ch[i] = (n & 1) ? this.G.hash : this.G.eq;
        co[i] = AC.palf(AC.PAL.CONCRETE, (0.34 + fog * 0.46) * AMB);
        return;
      }
      const lane = Math.abs(wy - (cy + 0.5)) < 0.12;
      ch[i] = lane ? this.G.dash : (((wx * 1.4) | 0) & 1 ? this.G.eq : this.G.us);
      co[i] = AC.palf(lane ? AC.PAL.MARKING : AC.PAL.CONCRETE,
        ((lane ? 0.34 : 0.20) + fog * 0.46) * AMB);
      return;
    }

    if (k === AC.KIND.FIELD) {
      // Crop rows, with a furrow between every few of them.
      const row = ((wy * 0.55) | 0) % 4;
      const n = AC.hash2((wx * 2) | 0, (wy * 2) | 0, 0x3F19);
      if (row === 3) {
        ch[i] = this.G.dash;
        co[i] = AC.palf(AC.PAL.SAND, (0.16 + fog * 0.38) * AMB);
        return;
      }
      ch[i] = [this.G.quote, this.G.apos, this.G.semi, this.G.comma][n & 3];
      co[i] = AC.palf(AC.PAL.FOLIAGE, (0.20 + fog * 0.50) * AMB);
      return;
    }

    if (k === AC.KIND.PIER) {
      // Planking runs across the pier, with a gap you can see the sea through.
      const plank = ((wx * 1.6) | 0) & 1;
      const n = AC.hash2(cx, cy, 0x7C41);
      ch[i] = plank ? this.G.eq : ((n & 3) === 0 ? this.G.dash : this.G.us);
      co[i] = AC.palf(AC.PAL.TIMBER, ((plank ? 0.30 : 0.20) + fog * 0.46) * AMB);
      return;
    }

    // Runtime decals sit on top of whatever surface is underneath.
    const blood = w.blood[di];
    if (blood > 10) {
      const n = AC.hash2((wx * 4) | 0, (wy * 4) | 0, 0x8B10);
      const t = blood / 255;
      ch[i] = t > 0.62 ? ((n & 1) ? this.G.at : this.G.hash)
        : ((n & 3) ? this.G.comma : this.G.semi);
      co[i] = AC.palf(AC.PAL.BLOOD, 0.18 + t * 0.42 + fog * 0.34);
      return;
    }
    const scorch = w.scorch[di];
    if (scorch > 10) {
      const n = AC.hash2((wx * 4) | 0, (wy * 4) | 0, 0x2D77);
      const t = scorch / 255;
      ch[i] = t > 0.55 ? ((n & 1) ? this.G.hash : this.G.star) : this.G.dot;
      co[i] = AC.palf(AC.PAL.ASPHALT, 0.05 + (1 - t) * 0.2 + fog * 0.2);
      return;
    }

    // The route, painted on the tarmac. Drawn before anything else the road
    // surface would otherwise put here, because a navigation line you have to
    // pick out from between the lane markings is not navigation.
    if (this.navMask && this.navMask[di]) {
      // A painted line down the lane, not a carpet over it. The first attempt
      // filled the whole corridor and turned the bottom half of the screen
      // into a sheet of amber — at eye height the cell right at your feet is
      // a couple of hundred pixels tall, so anything wide reads as a flood.
      // The dashes crawl forward, which is what makes it read as a direction
      // rather than as a stripe.
      let ph = ((wx + wy) * 0.9 - this.time * 2.2) % 3;
      if (ph < 0) ph += 3;
      ch[i] = ph < 1.7 ? this.gBlk[3] : this.gBlk[1];
      co[i] = AC.palf(AC.PAL.HUD_A, (ph < 1.7 ? 0.34 : 0.16) + fog * 0.5);
      return;
    }

    if (k === AC.KIND.ROAD) {
      const rx = w.axisRoadX(cx), ry = w.axisRoadY(cy);
      const P = w.P, W = w.W;
      const centre = (W - 1) / 2 + 0.5;
      const px = ((cx % P) + P) % P + fx, py = ((cy % P) + P) % P + fy;

      if (rx && ry) {
        // Intersection: box junction hatching.
        const hatch = (((wx + wy) * 2) | 0) & 1;
        ch[i] = hatch ? this.G.slash : (AMBDAY ? this.gBlk[0] : this.G.space);
        co[i] = AC.palf(hatch ? AC.PAL.MARKING : AC.PAL.ASPHALT, (0.12 + fog * (hatch ? 0.42 : 0.34)) * AMB);
        return;
      }
      // Centre line, dashed along the corridor.
      const off = rx ? Math.abs(px - centre) : Math.abs(py - centre);
      const runv = rx ? wy : wx;
      if (off < 0.10 && (((runv * 0.8) | 0) & 1) === 0) {
        ch[i] = this.G.bar; co[i] = AC.palf(AC.PAL.MARKING, (0.35 + fog * 0.55) * AMB);
        return;
      }
      // Street lighting. Lamp pools repeat every 6 units along the kerb on both
      // sides of the carriageway. Solved analytically from the cell's position
      // in the corridor rather than looked up, so it costs two exps and no
      // memory — and it stops the lower half of the frame reading as a void.
      const along = rx ? wy : wx;
      const across = rx ? (px - centre) : (py - centre);
      const ls = Math.round((along - 3) / 6) * 6 + 3;
      const ds = along - ls;
      const dt = Math.abs(across) - 1.6;
      const glow = Math.exp(-(ds * ds * 0.5 + dt * dt * 1.7));

      const n = AC.hash2(((wx * 3) | 0), ((wy * 3) | 0), 0x77A1);
      if (glow > 0.06 && EMIT > 0.45) {
        const b = (0.16 + fog * 0.34) * AMB + glow * 0.62 * EMIT;
        ch[i] = glow > 0.45 ? this.G.colon : ((n & 3) === 0 ? this.G.dot : this.G.grave);
        co[i] = AC.palf(glow > 0.30 ? AC.PAL.NEON_A : AC.PAL.ASPHALT, b);
        return;
      }
      // Wet asphalt: sparse neon speckle that reads as reflected signage.
      if ((n % 61) === 0 && d < 26) {
        ch[i] = this.G.apos;
        co[i] = AC.palf([AC.PAL.NEON_M, AC.PAL.NEON_C, AC.PAL.NEON_A][(n >>> 7) % 3], (0.25 + fog * 0.45) * EMIT);
        return;
      }
      // In daylight the carriageway needs a glyph with some coverage in it, or
      // no amount of brightness helps: a cell of ' ' is painted in the
      // background colour whatever colour it is nominally given. At night the
      // sparse dots are left alone, which is what the street has always been.
      ch[i] = AMBDAY ? this.gBlk[0] : ((n & 7) === 0 ? this.G.dot : this.G.space);
      co[i] = AC.palf(AC.PAL.ASPHALT, (0.18 + fog * 0.46) * AMB);
      return;
    }

    if (k === AC.KIND.RUNWAY || k === AC.KIND.APRON || k === AC.KIND.HELIPAD) {
      const A = w.airport;
      const n = AC.hash2(cx, cy, 0x4A17);
      if (k === AC.KIND.RUNWAY) {
        const onCentre = Math.abs(wy - (A.rwY + 0.5)) < 0.16;
        if (onCentre && (((wx * 0.55) | 0) & 1) === 0) {
          ch[i] = this.G.dash;
          co[i] = AC.palf(AC.PAL.CAR_W, 0.30 + fog * 0.62);
          return;
        }
        const edge = Math.abs(wy - (A.rwY - A.rwHalf)) < 0.2
          || Math.abs(wy - (A.rwY + A.rwHalf + 1)) < 0.2;
        const thresh = (wx < A.rwX0 + 3 || wx > A.rwX1 - 2) && (((wy * 1.6) | 0) & 1) === 0;
        if (edge || thresh) {
          ch[i] = this.G.bar;
          co[i] = AC.palf(AC.PAL.CAR_W, 0.20 + fog * 0.50);
          return;
        }
        ch[i] = AMBDAY ? this.gBlk[0] : ((n & 7) === 0 ? this.G.dot : this.G.space);
        co[i] = AC.palf(AC.PAL.ASPHALT, (0.18 + fog * 0.40) * AMB);
        return;
      }
      if (k === AC.KIND.HELIPAD) {
        ch[i] = ((wx - cx) < 0.5 && (wy - cy) < 0.5) ? this.a.indexOf[72] : this.G.o;
        co[i] = AC.palf(AC.PAL.NEON_A, 0.34 + fog * 0.55);
        return;
      }
      const seam = (wx - cx) < 0.10 || (wy - cy) < 0.10;
      ch[i] = seam ? this.G.dash : ((n & 3) === 0 ? this.G.colon : this.G.dot);
      co[i] = AC.palf(AC.PAL.CONCRETE, (seam ? 0.22 : 0.12) + fog * 0.42);
      return;
    }

    if (k === AC.KIND.SIDEWALK) {
      const seam = (fx < 0.08 || fy < 0.08);
      const n = AC.hash2(cx, cy, 0x3311);
      ch[i] = seam ? this.G.dash : ((n & 3) === 0 ? this.G.colon : this.G.dot);
      co[i] = AC.palf(AC.PAL.SIDEWALK, ((seam ? 0.28 : 0.18) + fog * 0.5) * AMB);
      return;
    }

    if (k === AC.KIND.PARK) {
      const n = AC.hash2(((wx * 4) | 0), ((wy * 4) | 0), 0x51F3);
      ch[i] = [this.G.comma, this.G.quote, this.G.apos, this.G.semi][n & 3];
      co[i] = AC.palf(AC.PAL.FOLIAGE, (0.18 + fog * 0.52) * AMB);
      return;
    }

    // Plaza / anything else.
    const n = AC.hash2(cx, cy, 0x2B7C);
    ch[i] = AMBDAY ? this.gBlk[0] : ((n & 15) === 0 ? this.G.dot : this.G.space);
    co[i] = AC.palf(AC.PAL.CONCRETE, (0.16 + fog * 0.40) * AMB);
  }

  // -------------------------------------------------------------------------
  // Stage 2 — sprites
  // -------------------------------------------------------------------------
  _spritePass(p, traffic) {
    const list = this.sprites;
    list.length = 0;
    // Screen-space picking: whatever the crosshair is over. Sprites draw
    // far-to-near, so the last writer wins and `aim` ends up as the nearest
    // unoccluded target. This is deliberately a presentation-side query — the
    // player is aiming at what they can see, not at a simulation ray.
    this.aim = null;
    this.aimX = this.s.cols >> 1;
    this.aimY = this.s.rows >> 1;
    const px = this.camX, py = this.camY;
    const dirX = this.dirX, dirY = this.dirY;
    const cull = this.cfg.maxDepth * this.cfg.maxDepth;
    const third = p.thirdPerson;

    // Ground-borne sprites carry the height of whatever they are standing on,
    // so a car crossing a bridge is drawn on the deck and not in the river.
    const relief = this.w.reliefNear(px, py);
    for (const c of traffic.cars) {
      // Your own car is invisible from inside it, and drawn from behind it.
      if (p.mode === 'drive' && c === p.car && !third) continue;
      const dx = c.x - px, dy = c.y - py;
      const dsq = dx * dx + dy * dy;
      if (dsq > cull) continue;
      if (dx * dirX + dy * dirY <= 0.2) continue;
      c.z = relief ? this.w.groundAt(c.x, c.y) : 0;
      list.push(c);
    }
    for (const q of traffic.peds) {
      const dx = q.x - px, dy = q.y - py;
      const dsq = dx * dx + dy * dy;
      if (dsq > 2600) continue;
      if (dx * dirX + dy * dirY <= 0.2) continue;
      q.z = relief ? this.w.groundAt(q.x, q.y) : 0;
      list.push(q);
    }
    if (this.cfg.showSignals) this._collectSignals(traffic, list);
    if (this.cfg.showAirspace && traffic.air) this._collectAir(traffic.air, list);
    if (traffic.sea) {
      const cullS = this.cfg.seaHorizon * this.cfg.seaHorizon;
      for (const b of traffic.sea.boats) {
        const dx = b.x - px, dy = b.y - py;
        if (dx * dx + dy * dy > cullS) continue;
        if (dx * dirX + dy * dirY <= 0.2) continue;
        list.push(b);
      }
    }

    // The player's own body, once the camera is far enough back to see it.
    if (p.avatarVisible && (third || p.scripted)) {
      const av = this._avatar || (this._avatar = { __avatar: true, alive: false });
      av.x = p.x; av.y = p.y; av.heading = p.yaw; av.bob = p.bob; av.speed = p.speed;
      // The gait's vertical bob lives here rather than in the art: lifting the
      // billboard reads as weight shifting, which is what made the old
      // frame-swap-only animation look like a puppet sliding along the ground.
      av.z = (p.speed > 0.05 ? Math.abs(Math.sin(p.bob)) * 0.055 : 0)
        + this.w.groundAt(p.x, p.y);
      list.push(av);
    }

    list.sort((m, n) =>
      ((n.x - px) ** 2 + (n.y - py) ** 2) - ((m.x - px) ** 2 + (m.y - py) ** 2));

    if (traffic.sea) {
      for (const b of traffic.sea.boats) this._drawWake(b);
      this._drawFunfair(traffic.sea);
    }
    if (traffic.sparks) this._drawSparks(traffic.sparks);

    for (const e of list) {
      if (e.__signal) this._drawSignal(e);
      // ONLY a car that is actually exploding gets the fireball. This used to
      // read `state !== 'alive'`, which was correct when 'exploding' was the
      // only other state — adding 'knocked'/'recover' silently started drawing
      // every tumbling car as an expanding orb for the length of its knock.
      else if (e instanceof AC.Car && e.state === 'exploding') this._drawBoom(p, e);
      else this._drawSprite(p, e);
    }
  }

  _drawSprite(p, e) {
    const s = this.s, a = this.a;
    const cols = s.cols, rows = s.rows;
    const ch = s.ch, co = s.co;
    const dirX = this.dirX, dirY = this.dirY;
    const planeX = this.planeX, planeY = this.planeY;

    const rx = e.x - this.camX, ry = e.y - this.camY;
    const invDet = 1 / (planeX * dirY - dirX * planeY);
    const tx = invDet * (dirY * rx - dirX * ry);
    const ty = invDet * (-planeY * rx + planeX * ry);   // perpendicular depth
    if (ty < 0.16) return;
    // If a wall has shoved the camera up against the player, drawing the body
    // just fills the screen with it.
    if (e.__avatar && ty < 0.85) return;

    const art = e.__avatar ? this._avatarArt(e)
      : e.kindTag === 'boat' ? this._boatArt(e)
      : e.kindTag === 'heli' ? this._heliArt(e)
      : (e instanceof AC.Car ? (e.tank ? this._tankArt(e) : this._carArt(e))
        : this._pedArt(e));
    const projCols = this.projCols, projRows = this.projRows;
    const horizon = this.horizon, eye = this.eye;

    const wWorld = art.w;
    const hWorld = art.h;
    const zBase = e.z || 0;                    // altitude of the sprite's feet
    const halfCols = (wWorld / 2 / ty) * projCols;
    const cxs = (cols / 2) * (1 + tx / ty);
    const yBase = horizon - ((zBase - eye) / ty) * projRows;
    const yTop = horizon - ((zBase + hWorld - eye) / ty) * projRows;

    let x0 = Math.floor(cxs - halfCols), x1 = Math.ceil(cxs + halfCols);
    let y0 = Math.floor(yTop), y1 = Math.ceil(yBase);
    if (x1 <= 0 || x0 >= cols || y1 <= 0 || y0 >= rows) return;
    const spanX = (x1 - x0), spanY = (y1 - y0);
    if (spanX <= 0 || spanY <= 0) return;

    let fog = (this.cfg.fogEnd - ty) / (this.cfg.fogEnd - this.cfg.fogStart);
    if (fog > 1) fog = 1; else if (fog < 0) fog = 0;
    // Things in the sky read against the sky, not through the haze — without a
    // floor they simply vanish at the distances aircraft actually fly at.
    if (art.minFog && fog < art.minFog) fog = art.minFog;

    // Is the crosshair over this sprite, and is it actually visible there?
    if (e.alive && e !== p.car && ty <= this.cfg.shootRange) {
      const ax = this.aimX, ay = this.aimY;
      if (ax >= x0 && ax < x1 && ay >= y0 && ay < y1 && ty < this.zbuf[ax]) this.aim = e;
    }

    const pat = art.pat, rol = art.rol;
    const pw = art.pw, ph = art.ph;
    const zc = this.zcell;

    for (let x = Math.max(0, x0); x < Math.min(cols, x1); x++) {
      const u = ((x - x0 + 0.5) / spanX * pw) | 0;
      if (u < 0 || u >= pw) continue;
      for (let y = Math.max(0, y0); y < Math.min(rows, y1); y++) {
        const i = y * cols + x;
        if (ty >= zc[i]) continue;
        const v = ((y - y0 + 0.5) / spanY * ph) | 0;
        if (v < 0 || v >= ph) continue;
        const cc = pat[v].charCodeAt(u);
        // ' ' is always a hole. '.' is a hole in the older plates, which use it
        // for transparency, and ink in the aircraft plates, which draw curved
        // outlines with it — hence the per-art flag rather than one convention.
        if (cc === 32 || (cc === 46 && !art.dotSolid)) continue;
        const gi = a.indexOf[cc];
        if (gi < 0) continue;
        const role = rol[v].charCodeAt(u);
        let base = art.base, bright = (0.30 + fog * 0.60) * (1 - (art.fade || 0) * 0.85);
        if (role === 76) { base = art.light; bright = 0.72 + fog * 0.28; }        // L
        else if (role === 71) { base = AC.PAL.SKY; bright = 0.30 + fog * 0.45; }  // G glass
        else if (role === 87) { base = AC.PAL.ASPHALT; bright = 0.14 + fog * 0.3; } // W wheel
        else if (role === 82) {                                                  // R port nav
          // Pulses rather than disappearing: skipping the cell punched a hole
          // in the wingtip and broke the silhouette every other beat.
          base = AC.PAL.NEON_R; bright = art.beaconOn ? 0.95 : 0.42;
        } else if (role === 78) {                                                // N starboard nav
          base = AC.PAL.NEON_G; bright = art.beaconOn ? 0.42 : 0.92;
        } else if (role === 83) {                                                // S strobe
          if (!art.strobeOn) continue;      // a flash; absence IS the effect
          base = AC.PAL.HOT; bright = 1.0;
        }
        ch[i] = gi;
        co[i] = AC.palf(base, bright);
      }
    }
  }

  _collectAir(air, list) {
    const px = this.camX, py = this.camY;
    const dirX = this.dirX, dirY = this.dirY;
    const cull = this.cfg.maxDepth * this.cfg.maxDepth;
    const push = (e) => {
      const dx = e.x - px, dy = e.y - py;
      if (dx * dx + dy * dy > cull) return;
      if (dx * dirX + dy * dirY <= 0.2) return;
      list.push(e);
    };
    for (const h of air.helis) push(h);
  }

  /** A boat's wake: a widening V of foam behind it, oldest first. */
  _drawWake(b) {
    const t = b.wake;
    if (!t.length) return;
    const s = this.s, cols = s.cols, rows = s.rows;
    const ch = s.ch, co = s.co, zc = this.zcell;
    const invDet = 1 / (this.planeX * this.dirY - this.dirX * this.planeY);
    const n = t.length / 2;
    const rx0 = -Math.sin(b.heading), ry0 = Math.cos(b.heading);
    for (let k = 0; k < n; k++) {
      const age = k / n;                            // 0 oldest .. 1 newest
      const spread = (1 - age) * 2.4 + 0.25;
      for (let side = -1; side <= 1; side += 2) {
        const wx = t[k * 2] + rx0 * side * spread;
        const wy = t[k * 2 + 1] + ry0 * side * spread;
        const rx = wx - this.camX, ry = wy - this.camY;
        const tx = invDet * (this.dirY * rx - this.dirX * ry);
        const ty = invDet * (-this.planeY * rx + this.planeX * ry);
        if (ty < 0.5) continue;
        const sx = Math.round((cols / 2) * (1 + tx / ty));
        const sy = Math.round(this.horizon + (this.eye / ty) * this.projRows);
        if (sx < 0 || sx >= cols || sy < 0 || sy >= rows) continue;
        const i = sy * cols + sx;
        if (ty >= zc[i]) continue;
        ch[i] = age > 0.6 ? this.gBlk[2] : this.gBlk[1];
        co[i] = AC.palf(AC.PAL.FOAM, 0.22 + age * 0.46);
      }
    }
  }

  // -------------------------------------------------------------------------
  // the funfair
  //
  // A ferris wheel is a disc standing on its edge and a coaster is a space
  // curve. Neither is expressible as a column of a height field, which is what
  // the whole rest of this renderer draws — so they are kept as parametric
  // geometry in the world and projected here, point by point, against the same
  // per-cell depth buffer everything else uses.
  // -------------------------------------------------------------------------

  /** Project a world point. Returns null behind the camera. */
  _proj3(wx, wy, wz, out) {
    const invDet = 1 / (this.planeX * this.dirY - this.dirX * this.planeY);
    const rx = wx - this.camX, ry = wy - this.camY;
    const tx = invDet * (this.dirY * rx - this.dirX * ry);
    const ty = invDet * (-this.planeY * rx + this.planeX * ry);
    if (ty < 0.35) return null;
    out.x = (this.s.cols / 2) * (1 + tx / ty);
    out.y = this.horizon - ((wz - this.eye) / ty) * this.projRows;
    out.d = ty;
    return out;
  }

  _plot(px, py, d, glyph, base, bright) {
    const s = this.s, x = Math.round(px), y = Math.round(py);
    if (x < 0 || y < 0 || x >= s.cols || y >= s.rows) return;
    const i = y * s.cols + x;
    if (d >= this.zcell[i]) return;
    this.zcell[i] = d;
    s.ch[i] = glyph;
    s.co[i] = AC.palf(base, bright);
  }

  /** Draw a 3D segment as a run of cells. Interpolating in SCREEN space keeps
   *  the structure continuous at any distance — sampling the curve at a fixed
   *  parametric rate leaves visible gaps the moment you stand next to it. */
  _seg3(ax, ay, az, bx, by, bz, glyph, base, bright) {
    const A = this._proj3(ax, ay, az, this._pA || (this._pA = {}));
    if (!A) return;
    const a = { x: A.x, y: A.y, d: A.d };
    const B = this._proj3(bx, by, bz, this._pB || (this._pB = {}));
    if (!B) return;
    const n = Math.min(90, Math.max(1, Math.round(Math.hypot(B.x - a.x, B.y - a.y))));
    for (let k = 0; k <= n; k++) {
      const u = k / n;
      this._plot(a.x + (B.x - a.x) * u, a.y + (B.y - a.y) * u,
        a.d + (B.d - a.d) * u, glyph, base, bright);
    }
  }

  _drawFunfair(sea) {
    const w = this.w, cfg = this.cfg, F = w.funfair;
    if (!F) return;
    const SUN = this.sun;
    // Cull on the pier as a whole: the rides are one landmark, and either you
    // can see the pier or you cannot.
    const cx = (F.deck.x0 + F.deck.x1) / 2, cy = (F.deck.y0 + F.deck.y1) / 2;
    const dd = (cx - this.camX) ** 2 + (cy - this.camY) ** 2;
    if (dd > cfg.seaHorizon * cfg.seaHorizon) return;

    const struct = AC.palf(AC.PAL.TIMBER, 0);       // placeholder, unused
    void struct;
    const lit = 0.40 + 0.60 * SUN.night;            // the fair lights up at dusk
    const frame = 0.26 + 0.34 * SUN.day;

    // --- ferris wheel ---
    const W = F.wheel, ang = sea.wheelAngle;
    const rimN = 48;
    let prev = null;
    for (let k = 0; k <= rimN; k++) {
      const a = (k / rimN) * Math.PI * 2;
      const p = { x: W.x, y: W.y + Math.cos(a) * W.r, z: W.z + Math.sin(a) * W.r };
      if (prev) {
        this._seg3(prev.x, prev.y, prev.z, p.x, p.y, p.z,
          this.G.o, AC.PAL.TIMBER, frame + 0.24);
      }
      prev = p;
    }
    // Spokes and gondolas.
    for (let g = 0; g < W.cars; g++) {
      const a = ang + (g / W.cars) * Math.PI * 2;
      const gx = W.x, gy = W.y + Math.cos(a) * W.r, gz = W.z + Math.sin(a) * W.r;
      this._seg3(W.x, W.y, W.z, gx, gy, gz, this.G.dot, AC.PAL.TIMBER, frame + 0.10);
      // The gondola itself: a lit box, colour cycling around the rim.
      const col = [AC.PAL.NEON_M, AC.PAL.NEON_C, AC.PAL.NEON_A, AC.PAL.NEON_G][g & 3];
      const p = this._proj3(gx, gy, gz - 0.55, this._pC || (this._pC = {}));
      if (p) {
        this._plot(p.x, p.y, p.d, this.gBlk[3], col, 0.45 + lit * 0.55);
        this._plot(p.x - 1, p.y, p.d, this.G.bar, col, 0.35 + lit * 0.45);
        this._plot(p.x + 1, p.y, p.d, this.G.bar, col, 0.35 + lit * 0.45);
      }
    }
    // Hub and the two A-frame legs down to the deck.
    this._seg3(W.x, W.y - W.r * 0.72, 0, W.x, W.y, W.z, this.G.slash, AC.PAL.TIMBER, frame + 0.30);
    this._seg3(W.x, W.y + W.r * 0.72, 0, W.x, W.y, W.z, this.G.back, AC.PAL.TIMBER, frame + 0.30);
    const hub = this._proj3(W.x, W.y, W.z, this._pD || (this._pD = {}));
    if (hub) this._plot(hub.x, hub.y, hub.d, this.G.at, AC.PAL.CONCRETE, 0.5);

    // --- roller coaster ---
    const steps = 96;
    const a0 = {}, b0 = {};
    for (let k = 0; k < steps; k++) {
      const p0 = w.coasterPoint(k / steps, a0);
      const p1 = w.coasterPoint((k + 1) / steps, b0);
      this._seg3(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z,
        this.G.eq, AC.PAL.TIMBER, frame + 0.28);
      // Trestles every few sleepers, down to the deck.
      if ((k & 7) === 0) {
        this._seg3(p0.x, p0.y, 0, p0.x, p0.y, p0.z,
          this.G.bar, AC.PAL.TIMBER, frame + 0.12);
      }
    }
    // The train.
    const cp = {};
    for (let c = 0; c < cfg.coasterCars; c++) {
      const u = (sea.coasterU - c * 0.012 + 1) % 1;
      const q = w.coasterPoint(u, cp);
      const p = this._proj3(q.x, q.y, q.z + 0.45, this._pE || (this._pE = {}));
      if (!p) continue;
      const col = c === 0 ? AC.PAL.NEON_R : AC.PAL.NEON_A;
      this._plot(p.x, p.y, p.d, this.gBlk[3], col, 0.55 + lit * 0.45);
      this._plot(p.x, p.y - 1, p.d, this.G.o, AC.PAL.PED, 0.40 + lit * 0.40);
    }
  }

  /** Impact sparks: one glyph each, cooling from white through amber to red as
   *  they age. Same single-cell path as the contrail. */
  _drawSparks(sp) {
    if (!sp.n) return;
    const s = this.s, cols = s.cols, rows = s.rows;
    const ch = s.ch, co = s.co, zc = this.zcell;
    const invDet = 1 / (this.planeX * this.dirY - this.dirX * this.planeY);
    const life = this.cfg.sparkLife;
    const G = this.G;

    for (let k = 0; k < sp.n; k++) {
      const rx = sp.x[k] - this.camX, ry = sp.y[k] - this.camY;
      const tx = invDet * (this.dirY * rx - this.dirX * ry);
      const ty = invDet * (-this.planeY * rx + this.planeX * ry);
      if (ty < 0.30) continue;
      const px = Math.round((cols / 2) * (1 + tx / ty));
      const py = Math.round(this.horizon - ((sp.z[k] - this.eye) / ty) * this.projRows);
      if (px < 0 || px >= cols || py < 0 || py >= rows) continue;
      const i = py * cols + px;
      if (ty >= zc[i]) continue;
      const age = sp.t[k] / life;                 // 0 fresh .. 1 spent
      let base, glyph;
      if (age < 0.25) { base = AC.PAL.HOT; glyph = G.star; }
      else if (age < 0.55) { base = AC.PAL.FIRE; glyph = G.plus; }
      else if (age < 0.8) { base = AC.PAL.NEON_A; glyph = G.apos; }
      else { base = AC.PAL.NEON_R; glyph = G.dot; }
      ch[i] = glyph;
      co[i] = AC.palf(base, 0.95 - age * 0.45);
    }
  }

  /** Which face of an aircraft the camera is looking at.
   *
   *  Same rule as a car: the heading relative to the line of sight picks front,
   *  rear or side, and for the side the nose has to point the way it is
   *  actually travelling, so the plate is mirrored on the camera-plane dot. */
  _facing(e, front, rear, side, sideR) {
    const view = Math.atan2(e.y - this.camY, e.x - this.camX);
    let rel = e.heading - view;
    while (rel > Math.PI) rel -= Math.PI * 2;
    while (rel < -Math.PI) rel += Math.PI * 2;
    const ar = Math.abs(rel);
    if (ar > 2.35) return { art: front, lateral: Math.abs(Math.sin(rel)), face: 'front' };
    if (ar < 0.80) return { art: rear, lateral: Math.abs(Math.sin(rel)), face: 'rear' };
    const dot = Math.cos(e.heading) * this.planeX + Math.sin(e.heading) * this.planeY;
    return { art: dot > 0 ? sideR : side, lateral: Math.abs(Math.sin(rel)), face: 'side' };
  }

  _boatArt(b) {
    const A = AC.SPRITE;
    const f = b.big ? A.ship : A.boat;
    // Broadside boats are wider than end-on ones, same rule as a car.
    const view = Math.atan2(b.y - this.camY, b.x - this.camX);
    const lateral = Math.abs(Math.sin(b.heading - view));
    const w = b.big ? 2.4 + 3.4 * lateral : 1.3 + 1.9 * lateral;
    return {
      pat: f.pat, rol: f.rol, pw: f.pw, ph: f.ph,
      w, h: b.big ? 3.2 : 1.9, base: b.base, light: AC.PAL.HEADLIGHT,
      fade: 0, minFog: 0.40,
      beaconOn: (this.time * 1.3 + b.bob) % 1.4 < 0.6,
      strobeOn: false,
    };
  }

  _heliArt(hc) {
    const A = AC.SPRITE;
    const k = (Math.sin(hc.rotor) > 0) ? '_A' : '_B';
    const f = this._facing(hc, A['heliFront' + k], A['heliRear' + k],
      A['heliSide' + k], A['heliSideR' + k]);
    const art = f.art;
    const w = f.face === 'side' ? 5.0 + 3.5 * f.lateral : 6.5;
    const h = (w * art.ph / art.pw) / 0.571;
    return {
      pat: art.pat, rol: art.rol, pw: art.pw, ph: art.ph,
      w, h, base: hc.base, light: AC.PAL.NEON_A,
      fade: 0, minFog: 0.74, dotSolid: true,
      strobeOn: (hc.blink % 1.3) < 0.10,
      beaconOn: (hc.blink % 0.9) < 0.38,
    };
  }

  /** Signal heads for every intersection in range, one per approach, standing
   *  on the near-right kerb where the traffic they govern can see them.
   *  Pooled: this runs every frame and would otherwise allocate ~100 objects. */
  _collectSignals(traffic, list) {
    const w = this.w, cfg = this.cfg;
    const P = w.P, N = w.blocksPerSide;
    const R = cfg.signalDrawRange, R2 = R * R;
    const camX = this.camX, camY = this.camY;
    const dirX = this.dirX, dirY = this.dirY;
    const pool = this._sigPool || (this._sigPool = []);
    let used = 0;

    const k0x = Math.max(1, Math.floor((camX - R) / P));
    const k1x = Math.min(N - 2, Math.ceil((camX + R) / P));
    const k0y = Math.max(1, Math.floor((camY - R) / P));
    const k1y = Math.min(N - 2, Math.ceil((camY + R) / P));
    const half = cfg.roadWidth / 2 + 0.35;

    for (let ky = k0y; ky <= k1y; ky++) {
      const cy = w.corridorCentre(ky);
      for (let kx = k0x; kx <= k1x; kx++) {
        const cx = w.corridorCentre(kx);
        if ((cx - camX) * (cx - camX) + (cy - camY) * (cy - camY) > R2) continue;
        // No signals on a junction that no longer exists. Since the city became
        // an island the outer nodes are under water, and the heads were still
        // being planted out at sea.
        if (w.nodeBlocked(kx, ky)) continue;
        for (let di = 0; di < 4; di++) {
          const d = AC.DIRS[di];
          const rgt = [d[1], -d[0]];
          const sx = cx - d[0] * (half + 0.45) + rgt[0] * 1.35;
          const sy = cy - d[1] * (half + 0.45) + rgt[1] * 1.35;
          const rx = sx - camX, ry = sy - camY;
          if (rx * dirX + ry * dirY <= 0.2) continue;          // behind us
          const sig = pool[used] || (pool[used] = { __signal: true, alive: false });
          sig.x = sx; sig.y = sy;
          sig.state = traffic.signal(kx, ky, (di & 1) === 0 ? 0 : 1);
          list.push(sig);
          used++;
        }
      }
    }
  }

  /** One signal head: a three-lamp box on a post. Drawn directly rather than
   *  through the pattern sampler because the colour varies per row. */
  _drawSignal(sig) {
    const s = this.s, a = this.a;
    const cols = s.cols, rows = s.rows;
    const ch = s.ch, co = s.co;
    const rx = sig.x - this.camX, ry = sig.y - this.camY;
    const invDet = 1 / (this.planeX * this.dirY - this.dirX * this.planeY);
    const tx = invDet * (this.dirY * rx - this.dirX * ry);
    const ty = invDet * (-this.planeY * rx + this.planeX * ry);
    if (ty < 0.4) return;

    const hWorld = 2.15, wWorld = 0.46;
    const halfCols = (wWorld / 2 / ty) * this.projCols;
    const cxs = (cols / 2) * (1 + tx / ty);
    const yBase = this.horizon + (this.eye / ty) * this.projRows;
    const yTop = this.horizon - ((hWorld - this.eye) / ty) * this.projRows;

    const x0 = Math.floor(cxs - halfCols), x1 = Math.ceil(cxs + halfCols);
    const y0 = Math.floor(yTop), y1 = Math.ceil(yBase);
    const spanX = x1 - x0, spanY = y1 - y0;
    if (spanX <= 0 || spanY <= 0) return;
    if (x1 <= 0 || x0 >= cols || y1 <= 0 || y0 >= rows) return;

    let fog = (this.cfg.fogEnd - ty) / (this.cfg.fogEnd - this.cfg.fogStart);
    if (fog > 1) fog = 1; else if (fog < 0) fog = 0;

    const PAT = AC.SIGNAL_ART;
    const lit = sig.state;                       // 0 red, 1 yellow, 2 green
    const lamp = [AC.PAL.NEON_R, AC.PAL.NEON_A, AC.PAL.NEON_G];

    const zc = this.zcell;
    for (let x = Math.max(0, x0); x < Math.min(cols, x1); x++) {
      const u = ((x - x0 + 0.5) / spanX * 3) | 0;
      if (u < 0 || u > 2) continue;
      for (let y = Math.max(0, y0); y < Math.min(rows, y1); y++) {
        if (ty >= zc[y * cols + x]) continue;
        const v = ((y - y0 + 0.5) / spanY * PAT.length) | 0;
        if (v < 0 || v >= PAT.length) continue;
        const cc = PAT[v].charCodeAt(u);
        if (cc === 32) continue;
        const gi = a.indexOf[cc];
        if (gi < 0) continue;
        let base, bright, glyph = gi;
        if (v < 3 && cc === 111) {               // 'o' — a lamp
          if (v === lit) {
            base = lamp[v]; bright = 0.80 + fog * 0.20;
          } else {
            // A dark lamp drawn as 'o' reads as another lit one once the head
            // is only a couple of cells tall. Drop it to a dot.
            glyph = this.G.dot;
            base = lamp[v]; bright = 0.04 + fog * 0.08;
          }
        } else {
          base = AC.PAL.ASPHALT; bright = 0.14 + fog * 0.34;
        }
        const i = y * cols + x;
        ch[i] = glyph;
        co[i] = AC.palf(base, bright);
      }
    }
  }

  /** Expanding fireball for a destroyed car. Drawn procedurally rather than
   *  from pattern art: the shape is a disc whose radius grows and whose core
   *  burns out, which no fixed glyph grid would express. */
  _drawBoom(p, car) {
    const s = this.s, cfg = this.cfg;
    const cols = s.cols, rows = s.rows;
    const ch = s.ch, co = s.co;
    const rx = car.x - this.camX, ry = car.y - this.camY;
    const invDet = 1 / (this.planeX * this.dirY - this.dirX * this.planeY);
    const tx = invDet * (this.dirY * rx - this.dirX * ry);
    const ty = invDet * (-this.planeY * rx + this.planeX * ry);
    if (ty < 0.16) return;

    const k = Math.min(1, car.boomT / cfg.carExplodeTime);
    const radius = 0.55 + k * 2.6;                       // world units
    const radCols = (radius / ty) * this.projCols;
    const radRows = radCols * this.a.cellW / this.a.cellH;
    const cx = (cols / 2) * (1 + tx / ty);
    const cy = this.horizon - ((0.55 - this.eye) / ty) * this.projRows;
    if (radCols < 0.6) return;

    const x0 = Math.max(0, Math.floor(cx - radCols));
    const x1 = Math.min(cols, Math.ceil(cx + radCols));
    const y0 = Math.max(0, Math.floor(cy - radRows));
    const y1 = Math.min(rows, Math.ceil(cy + radRows));
    const hollow = k * 0.72;                             // core burns out
    const G = this.G;

    const zc = this.zcell;
    for (let x = x0; x < x1; x++) {
      const dx = (x + 0.5 - cx) / radCols;
      for (let y = y0; y < y1; y++) {
        if (ty >= zc[y * cols + x]) continue;
        const dy = (y + 0.5 - cy) / radRows;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > 1 || d < hollow) continue;
        const n = AC.hash2(x * 3 + (car.boomT * 40) | 0, y * 7, 0x60F1);
        if (d > 0.72 && (n & 3) === 0) continue;         // ragged edge
        let base, bright;
        if (d < 0.34) { base = AC.PAL.HOT; bright = 0.95; }
        else if (d < 0.58) { base = AC.PAL.FIRE; bright = 0.85; }
        else if (d < 0.82) { base = AC.PAL.NEON_R; bright = 0.70; }
        else { base = AC.PAL.ASPHALT; bright = 0.45; }
        bright *= (1 - k * 0.55);
        const i = y * cols + x;
        ch[i] = [G.at, G.hash, G.star, G.amp, G.pct][n % 5];
        co[i] = AC.palf(base, bright);
      }
    }
  }

  _carArt(car) {
    // Pick front / rear / side art from the car's heading relative to the view.
    const view = Math.atan2(car.y - this.camY, car.x - this.camX);
    let rel = car.heading - view;
    while (rel > Math.PI) rel -= Math.PI * 2;
    while (rel < -Math.PI) rel += Math.PI * 2;
    const ar = Math.abs(rel);
    const A = AC.SPRITE;
    let art;
    if (ar > 2.35) art = A.carFront;            // coming at us
    else if (ar < 0.8) art = A.carRear;         // going away
    else art = A.carSide;
    const lateral = Math.abs(Math.sin(rel));
    const w = 0.62 + 0.95 * lateral;            // 2.0m wide, 4.5m long
    // Bullet feedback: a white flash on impact, and the paint chars toward
    // asphalt as the hit points run down, so damage is legible at a glance.
    const wear = 1 - car.hp / this.cfg.carHitPoints;
    const base = car.hitFlash > 0 ? AC.PAL.HOT
      : (wear > 0.55 ? AC.PAL.ASPHALT : car.base);
    return {
      pat: art.pat, rol: art.rol, pw: art.pw, ph: art.ph,
      w, h: 0.52, base,
      light: art === A.carRear ? AC.PAL.TAILLIGHT : AC.PAL.HEADLIGHT,
      fade: 0,
    };
  }

  /** A tank. Same view-relative frame choice as a car, but wider, taller, and
   *  with the paint left alone — a tank does not visibly take damage here,
   *  because nothing in the city can scratch it. */
  _tankArt(t) {
    const view = Math.atan2(t.y - this.camY, t.x - this.camX);
    let rel = t.heading - view;
    while (rel > Math.PI) rel -= Math.PI * 2;
    while (rel < -Math.PI) rel += Math.PI * 2;
    const ar = Math.abs(rel);
    const A = AC.SPRITE;
    let art;
    if (ar > 2.35) art = A.tankFront;
    else if (ar < 0.8) art = A.tankRear;
    else {
      // Nose pointing screen-right takes the mirrored plate, so the gun always
      // points the way the tank is actually travelling.
      const dot = Math.cos(t.heading) * this.planeX + Math.sin(t.heading) * this.planeY;
      art = dot > 0 ? A.tankSideR : A.tankSide;
    }
    const lateral = Math.abs(Math.sin(rel));
    const w = 1.05 + 1.55 * lateral;            // 3 m across, 7.4 m long
    return {
      pat: art.pat, rol: art.rol, pw: art.pw, ph: art.ph,
      w, h: (art === A.tankSide || art === A.tankSideR) ? 0.98 : 1.15,
      base: t.hitFlash > 0 ? AC.PAL.HOT : t.base,
      light: art === A.tankRear ? AC.PAL.TAILLIGHT : AC.PAL.HEADLIGHT,
      fade: 0,
    };
  }

  /** The player's own body in third person. Same silhouette as a pedestrian so
   *  the scale reads consistently, but in the HUD colour so "you" is obvious. */
  _avatarArt(av) {
    const A = AC.SPRITE;
    const running = av.speed > this.cfg.walkSpeed * 1.25;
    const set = av.speed < 0.05 ? null : (running ? A.runCycle : A.walkCycle);
    // A gait is contact / pass / contact / pass — four slots off three frames.
    // Playing the two contacts back to back is what made the old two-frame
    // swap read as a twitch rather than a step.
    const f = set ? set[((av.bob / (Math.PI / 2)) | 0) & 3] : A.avatarIdle;
    return {
      pat: f.pat, rol: f.rol, pw: f.pw, ph: f.ph,
      w: 0.44, h: 0.86, base: AC.PAL.HUD_C, light: AC.PAL.NEON_C, fade: 0,
    };
  }

  _pedArt(ped) {
    const A = AC.SPRITE;
    if (ped.state !== 'alive') {
      const k = ped.fallT;
      // Collapse in two stages, and shrink the billboard's world height as it
      // goes: that is what sells the fall, more than the frame swap does.
      if (k < 0.55) {
        return {
          pat: A.pedFall.pat, rol: A.pedFall.rol, pw: A.pedFall.pw, ph: A.pedFall.ph,
          w: 0.34 + k * 0.20, h: 0.56 - k * 0.62, base: ped.base, light: AC.PAL.BLOOD,
          fade: ped.fadeT,
        };
      }
      return {
        pat: A.pedDown.pat, rol: A.pedDown.rol, pw: A.pedDown.pw, ph: A.pedDown.ph,
        w: 0.78, h: 0.17, base: ped.base, light: AC.PAL.BLOOD,
        fade: ped.fadeT,
      };
    }
    const f = (Math.sin(ped.phase) > 0) ? A.pedA : A.pedB;
    return {
      pat: f.pat, rol: f.rol, pw: f.pw, ph: f.ph,
      w: 0.30, h: 0.56, base: ped.base, light: AC.PAL.NEON_C, fade: 0,
    };
  }

  // -------------------------------------------------------------------------
  // Stage 3 — overlay
  // -------------------------------------------------------------------------
  _overlay(p, traffic) {
    const s = this.s, cfg = this.cfg, a = this.a;
    const cols = s.cols, rows = s.rows;
    if (cfg.showBigMap) { this._bigMap(p, traffic); return; }

    // Crosshair. Turns hot when it is over something that can be shot, and
    // a car shows its remaining hit points as pips — without that the 5-hit
    // rule is invisible and shooting a car feels like nothing is happening.
    const cx = cols >> 1, cy = rows >> 1;
    const aim = p.dead ? null : this.aim;
    if (!p.dead) {
    if (this.hitMarker > 0) {
      this.hitMarker -= 1 / 60;
      s.set(cx - 1, cy - 1, a.indexOf[92], AC.pal(AC.PAL.HOT, 7));
      s.set(cx + 1, cy - 1, a.indexOf[47], AC.pal(AC.PAL.HOT, 7));
      s.set(cx - 1, cy + 1, a.indexOf[47], AC.pal(AC.PAL.HOT, 7));
      s.set(cx + 1, cy + 1, a.indexOf[92], AC.pal(AC.PAL.HOT, 7));
    }
    s.set(cx, cy, a.indexOf[aim ? 111 : 43],
      AC.pal(aim ? AC.PAL.NEON_R : AC.PAL.HUD_C, aim ? 7 : 6));
    if (aim instanceof AC.Car) {
      let pips = '';
      for (let i = 0; i < this.cfg.carHitPoints; i++) pips += (i < aim.hp ? '#' : '.');
      s.text(cx - (pips.length >> 1), cy + 2, pips, AC.pal(AC.PAL.NEON_R, 6));
    }
    }

    if (this.nav && this.nav.guide && !p.dead) this._navBanner();
    // The health bar lives under the minimap and toggles with it.
    if (cfg.showMinimap) { this._minimap(p, traffic); this._healthBar(p); }
    if (p.hurtFlash > 0) this._hurtVignette(p);
    if (p.drowning && !p.dead) this._drowning(p);
    if (this.notice) this._notice();
    if (p.dead) { this._wasted(p); this._deadHud(p); }
    if (!cfg.showHud) return;

    const kmh = (p.speed * AC.METRES_PER_UNIT * 3.6);
    const heading = ((p.yaw * 180 / Math.PI) + 360) % 360;
    const compass = ['E', 'SE', 'S', 'SW', 'W', 'NW', 'N', 'NE'][Math.round(heading / 45) % 8];

    const view = p.aiming ? 'ADS' : (p.thirdPerson ? '3P ' : '1P ');
    const hh = Math.floor(this.tod * 24);
    const mm = Math.floor((this.tod * 24 - hh) * 60);
    const clock = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    const l1 = ' ' + (p.mode === 'drive' ? 'DRIVE' : 'FOOT ') + ' ' + view
      + ' | ' + (cfg.dayNight ? clock : 'NIGHT')
      + ' | ' + kmh.toFixed(0).padStart(3) + ' km/h'
      + ' | ' + compass.padEnd(2)
      + ' | X ' + (p.x * AC.METRES_PER_UNIT).toFixed(0).padStart(5)
      + '  Y ' + (p.y * AC.METRES_PER_UNIT).toFixed(0).padStart(5)
      + ' m | seed 0x' + (cfg.seed >>> 0).toString(16).toUpperCase();

    const st = this.stats || {};
    const l2 = ' ' + (st.fps || 0).toFixed(0).padStart(3) + ' fps'
      + ' | sim ' + (st.sim || 0).toFixed(2) + ' ms'
      + ' | render ' + (st.render || 0).toFixed(2) + ' ms'
      + ' | blit ' + (st.blit || 0).toFixed(2) + ' ms'
      + ' | ' + cols + 'x' + rows
      + ' | cells ' + String(st.cells || 0).padStart(6)
      + ' | WASD  SHIFT run  F ' + (p.mode === 'drive' ? 'exit car' : 'enter car')
      + '  V view  RMB aim  LMB shoot  M minimap  ESC map  N sky  T time  ? help';

    const bar = AC.pal(AC.PAL.HUD_C, 5);
    for (let x = 0; x < cols; x++) {
      s.set(x, rows - 2, a.indexOf[32], bar);
      s.set(x, rows - 1, a.indexOf[32], bar);
    }
    s.text(0, rows - 2, l1.slice(0, cols), AC.pal(AC.PAL.HUD_A, 6));
    s.text(0, rows - 1, l2.slice(0, cols), AC.pal(AC.PAL.HUD_C, 5));
  }

  /** The satnav card: next manoeuvre top-left, trip summary under it.
   *
   *  Laid out the way every phone does it, because that layout is now the one
   *  everybody reads without thinking: a big arrow, the distance to the turn,
   *  the road it puts you on, and the journey total on its own line. */
  _navBanner() {
    const s = this.s, a = this.a, g = this.nav.guide;
    const idx = a.indexOf;
    const ARROW = {
      LEFT: ['  __', ' /', '<', ' \\__'],
      RIGHT: ['__', '  \\', '   >', '__/'],
    };
    // Distances round the way a satnav rounds them: to the nearest ten under a
    // kilometre, to a tenth of a kilometre above it. "487 m" is false precision.
    const fmt = (m) => (m >= 1000 ? (m / 1000).toFixed(1) + ' km'
      : (Math.round(m / 10) * 10) + ' m');
    const mins = Math.max(1, Math.round(g.eta / 60));

    const l1 = g.turn === 'ARRIVE' ? 'CONTINUE ' + fmt(g.dist)
      : g.turn + ' in ' + fmt(g.dist);
    const l2 = g.turn === 'ARRIVE' ? 'TO ' + g.onto : 'ONTO ' + g.onto;
    const l3 = mins + ' min  ' + fmt(g.total) + '  on ' + g.street;
    const w = Math.max(l1.length, l2.length, l3.length) + 8;
    const h = 5;
    const x0 = 2, y0 = 1;

    const panel = AC.pal(AC.PAL.HUD_C, 2);
    for (let y = y0; y < y0 + h; y++) {
      for (let x = x0; x < x0 + w; x++) {
        if (x >= s.cols || y >= s.rows) continue;
        s.set(x, y, this.gBlk[3], panel);
      }
    }
    // Turn glyph: a chevron drawn big enough to read at a glance, in the same
    // amber as the line painted on the road so the two obviously belong.
    const gl = g.turn === 'LEFT' ? '<' : (g.turn === 'RIGHT' ? '>' : (g.turn === 'U-TURN' ? 'U' : '^'));
    const acc = AC.pal(AC.PAL.HUD_A, 7);
    for (let y = 0; y < 3; y++) {
      s.set(x0 + 2, y0 + 1 + y, idx[y === 1 ? gl.charCodeAt(0) : 124], acc);
    }
    s.set(x0 + 3, y0 + 2, idx[gl.charCodeAt(0)], acc);
    void ARROW;

    s.text(x0 + 6, y0 + 1, l1.slice(0, w - 7), AC.pal(AC.PAL.HUD_A, 7));
    s.text(x0 + 6, y0 + 2, l2.slice(0, w - 7), AC.pal(AC.PAL.CAR_W, 6));
    s.text(x0 + 6, y0 + 3, l3.slice(0, w - 7), AC.pal(AC.PAL.HUD_C, 6));
  }

  // -------------------------------------------------------------------------
  // the city map
  // -------------------------------------------------------------------------

  /** Screen geometry for the full map, recomputed each frame so a resize needs
   *  no invalidation. A glyph cell is taller than it is wide, so a square city
   *  needs proportionally more columns than rows or the map comes out squashed. */
  _mapLayout() {
    const s = this.s, a = this.a;
    const nr = Math.max(8, s.rows - 5);
    const nc = Math.max(12, Math.min(s.cols - 4,
      Math.round(nr * (a.cellH / a.cellW))));
    return {
      nc, nr,
      ox: (s.cols - nc) >> 1,
      oy: 2,
      scale: this.w.size / nc,          // world cells per map column
      scaleY: this.w.size / nr,
    };
  }

  /** Mouse input while the map is open. Under pointer lock there is no system
   *  cursor to borrow, so the map keeps its own and drives it from the same
   *  relative deltas that would otherwise turn the camera. */
  moveMapCursor(dx, dy) {
    const L = this._mapLayout();
    const rate = this.cfg.mapCursorRate;
    if (!this.mapCur) return;                    // placed on the first draw
    this.mapCur.x = Math.max(0, Math.min(L.nc - 1, this.mapCur.x + dx * rate));
    this.mapCur.y = Math.max(0, Math.min(L.nr - 1, this.mapCur.y + dy * rate));
  }

  /** Put the map cursor at an absolute fraction of the viewport.
   *
   *  ESC opens the map, and ESC is also what gives the mouse back — so while
   *  the map is up there IS a real cursor, and driving the reticle from where
   *  it actually is beats integrating relative deltas it no longer produces. */
  setMapCursor(fx, fy) {
    const L = this._mapLayout();
    const mx = fx * this.s.cols - L.ox;
    const my = fy * this.s.rows - L.oy;
    this.mapCur = {
      x: Math.max(0, Math.min(L.nc - 1, mx)),
      y: Math.max(0, Math.min(L.nr - 1, my)),
    };
  }

  /** Reset the cursor onto the player. Called when the map is opened. */
  centreMapCursor(p) { this.mapCur = null; this.mapAim = null; void p; }

  /** The map's static layer, rasterised once and kept.
   *
   *  At 1024 cells a side there are a million world cells behind this picture,
   *  and none of them move. Rebuilding it every frame cost 41 ms — nearly three
   *  frames — for an image identical to the last one. It is built on the first
   *  open and on a resize, and everything that actually changes (traffic, the
   *  route, the pin, the cursor) is drawn over the top. */
  _bigMapBase() {
    const s = this.s, a = this.a, w = this.w;
    const L = this._mapLayout();
    const key = L.nc + 'x' + L.nr;
    if (this._mapBase && this._mapBase.key === key) return this._mapBase;

    const idx = a.indexOf, K = AC.KIND;
    const NK = AC.KIND_COUNT;
    const RANK = new Int32Array(NK);
    RANK[K.BRIDGE] = 11; RANK[K.PIER] = 10; RANK[K.HELIPAD] = 9; RANK[K.RUNWAY] = 9;
    RANK[K.APRON] = 8; RANK[K.FIELD] = 7; RANK[K.PARK] = 6; RANK[K.PLAZA] = 5;
    RANK[K.BUILDING] = 4; RANK[K.SAND] = 3; RANK[K.SIDEWALK] = 2;
    RANK[K.WATER] = 1; RANK[K.ROAD] = 0;

    const ch = new Uint8Array(L.nc * L.nr);
    const co = new Uint16Array(L.nc * L.nr);
    const count = new Int32Array(NK);
    // Sample on a stride rather than every cell: a majority vote does not need
    // all 170 world cells behind a map cell to reach the same answer.
    const stepX = Math.max(1, Math.round(L.scale / 4));
    const stepY = Math.max(1, Math.round(L.scaleY / 4));

    for (let my = 0; my < L.nr; my++) {
      const wy0 = Math.floor(my * L.scaleY), wy1 = Math.floor((my + 1) * L.scaleY);
      for (let mx = 0; mx < L.nc; mx++) {
        const wx0 = Math.floor(mx * L.scale), wx1 = Math.floor((mx + 1) * L.scale);
        count.fill(0);
        let any = false, tall = 0;
        for (let wy = wy0; wy <= wy1; wy += stepY) {
          for (let wx = wx0; wx <= wx1; wx += stepX) {
            if (!w.inBounds(wx, wy)) continue;
            any = true;
            const i2 = wy * w.size + wx;
            const k = w.kind[i2];
            count[k]++;
            if (k === K.BUILDING && w.h[i2] > tall) tall = w.h[i2];
          }
        }
        let kind = K.ROAD, best = -1;
        for (let k = 0; k < NK; k++) {
          if (count[k] > best || (count[k] === best && RANK[k] > RANK[kind])) {
            best = count[k]; kind = k;
          }
        }
        // A bridge overrides the vote. It is nine cells of deck inside a map
        // cell covering seventeen rows of river, so it loses a majority every
        // time — and a map that hides the only six ways across the water is
        // wrong in the one way a map must not be.
        if (count[K.BRIDGE] > 0) kind = K.BRIDGE;
        let g = idx[32], c = AC.pal(AC.PAL.SKY, 0);
        // Water is a filled surface here, not a sparse speckle. The open sea
        // reads either way, but the river is only three map cells across, and
        // drawn as one-in-four tildes it was invisible against the blank field
        // that roads are drawn as.
        if (!any) { g = this.gBlk[1]; c = AC.pal(AC.PAL.WATER_D, 2); }
        else if (kind === K.WATER) {
          g = ((mx + my) & 3) === 0 ? idx[126] : this.gBlk[1];
          c = AC.pal(AC.PAL.WATER_D, 4);
        } else if (kind === K.BRIDGE) { g = idx[61]; c = AC.pal(AC.PAL.HUD_A, 7); }
        else if (kind === K.SAND) { g = idx[58]; c = AC.pal(AC.PAL.SAND, 5); }
        else if (kind === K.PIER) { g = idx[61]; c = AC.pal(AC.PAL.TIMBER, 6); }
        else if (kind === K.RUNWAY) { g = idx[61]; c = AC.pal(AC.PAL.CAR_W, 6); }
        else if (kind === K.HELIPAD) { g = idx[72]; c = AC.pal(AC.PAL.NEON_A, 7); }
        else if (kind === K.APRON) { g = idx[45]; c = AC.pal(AC.PAL.CONCRETE, 3); }
        else if (kind === K.FIELD) { g = idx[39]; c = AC.pal(AC.PAL.NEON_G, 4); }
        else if (kind === K.PARK) { g = idx[34]; c = AC.pal(AC.PAL.FOLIAGE, 5); }
        else if (kind === K.PLAZA) { g = idx[39]; c = AC.pal(AC.PAL.CONCRETE, 4); }
        else if (kind === K.BUILDING) {
          g = idx[tall > 16 ? 35 : 61];
          c = AC.pal(AC.PAL.CONCRETE, tall > 16 ? 6 : 4);
        } else if (kind === K.SIDEWALK) { g = idx[58]; c = AC.pal(AC.PAL.ASPHALT, 3); }
        else { g = idx[32]; c = AC.pal(AC.PAL.SKY, 0); }     // road: left blank
        const o = my * L.nc + mx;
        ch[o] = g; co[o] = c;
      }
    }

    // District names, baked in: they never move either.
    const put = (mx, my, g, c) => {
      if (mx < 0 || my < 0 || mx >= L.nc || my >= L.nr) return;
      ch[my * L.nc + mx] = g; co[my * L.nc + mx] = c;
    };
    for (const d of (w.districts || [])) {
      const mx = Math.floor(d.x / L.scale), my = Math.floor(d.y / L.scaleY);
      const label = d.name.length > 16 ? d.name.slice(0, 16) : d.name;
      const lx = Math.max(0, Math.min(L.nc - label.length, mx - (label.length >> 1)));
      const ly = Math.max(0, Math.min(L.nr - 1, my + 1));
      for (let i2 = 0; i2 < label.length; i2++) {
        const gi = idx[label.charCodeAt(i2)];
        if (gi >= 0) put(lx + i2, ly, gi, AC.pal(AC.PAL.HUD_A, 7));
      }
      put(mx, my, idx[42], AC.pal(AC.PAL.NEON_A, 7));       // '*' marker
    }

    this._mapBase = { key, ch, co, nc: L.nc, nr: L.nr };
    return this._mapBase;
  }

  _bigMap(p, traffic) {
    const s = this.s, a = this.a, w = this.w, cfg = this.cfg;
    const idx = a.indexOf, L = this._mapLayout();
    const base = this._bigMapBase();

    const bg = AC.pal(AC.PAL.SKY, 0);
    for (let y = 0; y < s.rows; y++) {
      for (let x = 0; x < s.cols; x++) s.set(x, y, idx[32], bg);
    }
    for (let my = 0; my < L.nr; my++) {
      for (let mx = 0; mx < L.nc; mx++) {
        const o = my * L.nc + mx;
        s.set(L.ox + mx, L.oy + my, base.ch[o], base.co[o]);
      }
    }

    const toMapX = (wx) => L.ox + wx / L.scale;
    const toMapY = (wy) => L.oy + wy / L.scaleY;
    // floor, not round: toMapX returns a fractional column index whose integer
    // part IS the containing column.
    const put = (mx, my, ch2, col) => {
      const x = Math.floor(mx), y = Math.floor(my);
      if (x < L.ox || y < L.oy || x >= L.ox + L.nc || y >= L.oy + L.nr) return;
      s.set(x, y, idx[ch2], col);
    };

    // The route, drawn before everything that has to stay readable on top.
    const nav = this.nav;
    if (nav && nav.path && nav.path.length > 1) {
      const col = AC.pal(AC.PAL.NEON_C, 7);
      for (let i = 0; i < nav.path.length - 1; i++) {
        const ax = toMapX(nav.path[i].x), ay = toMapY(nav.path[i].y);
        const bx = toMapX(nav.path[i + 1].x), by = toMapY(nav.path[i + 1].y);
        const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) * 2));
        for (let k = 0; k <= n; k++) {
          put(ax + (bx - ax) * k / n, ay + (by - ay) * k / n, 43, col);
        }
      }
    }

    // Only nearby traffic: at this scale the whole fleet is a smear.
    for (const car of traffic.cars) {
      if (car.state === 'gone') continue;
      if ((car.x - p.x) ** 2 + (car.y - p.y) ** 2 > 40000) continue;
      put(toMapX(car.x), toMapY(car.y), 111, AC.pal(car.base, 5));
    }

    if (nav && nav.pin) {
      put(toMapX(nav.pin.x), toMapY(nav.pin.y), 88, AC.pal(AC.PAL.HOT, 7));
    }

    const arrow = ['>', 'v', '<', '^'][
      Math.round(((p.yaw + Math.PI * 2) % (Math.PI * 2)) / (Math.PI / 2)) % 4];
    put(toMapX(p.x), toMapY(p.y), arrow.charCodeAt(0), AC.pal(AC.PAL.HUD_A, 7));

    // Cursor. Placed on the player the first time the map comes up.
    if (!this.mapCur) {
      this.mapCur = { x: toMapX(p.x) - L.ox, y: toMapY(p.y) - L.oy };
    }
    const cx = Math.floor(L.ox + this.mapCur.x), cy = Math.floor(L.oy + this.mapCur.y);
    this.mapAim = {
      x: (this.mapCur.x + 0.5) * L.scale,
      y: (this.mapCur.y + 0.5) * L.scaleY,
    };
    const cur = AC.pal(AC.PAL.NEON_R, 7);
    put(cx - 1, cy, 91, cur); put(cx + 1, cy, 93, cur);
    if (s.ch[cy * s.cols + cx] === idx[32]) put(cx, cy, 43, cur);

    // Frame and chrome.
    const edge = AC.pal(AC.PAL.HUD_C, 4);
    for (let x = -1; x <= L.nc; x++) {
      s.set(L.ox + x, L.oy - 1, idx[45], edge);
      s.set(L.ox + x, L.oy + L.nr, idx[45], edge);
    }
    for (let y = 0; y < L.nr; y++) {
      s.set(L.ox - 1, L.oy + y, idx[124], edge);
      s.set(L.ox + L.nc, L.oy + y, idx[124], edge);
    }
    const title = ' NEON CITY ';
    s.text(L.ox + ((L.nc - title.length) >> 1), L.oy - 1, title, AC.pal(AC.PAL.NEON_C, 7));

    const near = w.districtNear(this.mapAim.x, this.mapAim.y);
    const dist = nav && nav.pin
      ? Math.hypot(nav.pin.x - p.x, nav.pin.y - p.y) * AC.METRES_PER_UNIT : 0;
    const l1 = nav && nav.pin
      ? ' ' + (nav.name || 'DESTINATION') + '   ' + dist.toFixed(0) + ' m away'
        + (nav.path && nav.path.length ? '   route ' + nav.path.length + ' legs'
                                       : '   no road route')
      : (near ? ' OVER ' + near.name : ' NO DESTINATION');
    const l2 = ' MOUSE aim   RMB set / clear a destination   ESC or CLICK back to the city';
    s.text(1, s.rows - 2, l1.slice(0, s.cols - 1), AC.pal(AC.PAL.HUD_A, 6));
    s.text(1, s.rows - 1, l2.slice(0, s.cols - 1), AC.pal(AC.PAL.HUD_C, 5));
    void cfg;
  }

  /** Cheat confirmation banner. Centred, high on the screen, fading out at the
   *  end of its life so it does not simply blink off mid-glance. */
  _notice() {
    const s = this.s, a = this.a;
    const n = this.notice;
    const u = n.t / this.cfg.noticeDur;
    const txt = '  ' + n.text + '  ';
    const x = (s.cols - txt.length) >> 1;
    const y = Math.max(1, (s.rows * 0.22) | 0);
    if (x < 0) return;
    const shade = u > 0.75 ? Math.max(2, 7 - Math.round((u - 0.75) * 20)) : 7;
    for (let i = 0; i < txt.length; i++) {
      s.set(x + i, y, a.indexOf[32], AC.pal(AC.PAL.NEON_C, 1));
    }
    s.text(x, y, txt, AC.pal(AC.PAL.HOT, shade));
  }
